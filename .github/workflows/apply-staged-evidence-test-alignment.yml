name: Apply staged-evidence test alignment

on:
  push:
    branches:
      - agent/freeze-v0-2-0-b3-contract

permissions:
  contents: write

jobs:
  apply-test-alignment:
    if: ${{ github.event.head_commit.message == 'Retry staged-evidence test alignment' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # actions/checkout v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/freeze-v0-2-0-b3-contract
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact test replacements
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          python .github/scripts/align_staged_evidence_tests.py
          rm .github/scripts/align_staged_evidence_tests.py
          rm .github/workflows/apply-staged-evidence-test-alignment.yml

          expected=$(cat <<'EOF'
          .github/scripts/align_staged_evidence_tests.py
          .github/workflows/apply-staged-evidence-test-alignment.yml
          tests/test_tools.py
          EOF
          )
          actual=$(git status --short | sed 's/^...//' | sort)
          test "${actual}" = "$(printf '%s\n' "${expected}" | sed 's/^          //' | sort)"
          git diff --check

      - name: Install exact development dependencies
        run: |
          python -m pip install --only-binary=:all: --require-hashes \
            -r requirements/development.lock

      - name: Run focused documentation tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_tools.DocumentationTests.test_human_agent_workflow_need_is_planned_without_blocking_publication \
            tests.test_tools.DocumentationTests.test_current_b3_projection_preserves_operational_chronology \
            tests.test_tools.DocumentationTests.test_public_front_door_exposes_verified_evaluation_path

      - name: Commit and push without rewriting history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Konstantinos Togias"
          git config user.email "info@ktogias.gr"
          git add -A
          git commit -m "Align documentation tests with staged evidence"
          git push origin HEAD:agent/freeze-v0-2-0-b3-contract
