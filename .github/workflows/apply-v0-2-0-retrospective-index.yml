name: Apply v0.2.0 retrospective index routing

on:
  push:
    branches:
      - knowledge/v0-2-0-release-retrospective

permissions:
  contents: write

jobs:
  route-retrospective:
    if: ${{ github.event.head_commit.message == 'Apply retrospective index routing' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: knowledge/v0-2-0-release-retrospective
          fetch-depth: 0
          persist-credentials: true

      - name: Add exact index routes and remove this bounded helper
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          python - <<'PY'
          from pathlib import Path

          path = Path("knowledge/index.md")
          text = path.read_text(encoding="utf-8")

          decision_anchor = (
              "- [Use staged evidence maturity for early adoption trials]"
              "(decisions/0052-use-staged-evidence-maturity-for-early-adoption-trials.md)\n"
          )
          decision_route = (
              "- [Select proportional release retrospection and owner-led product learning]"
              "(decisions/0053-select-proportional-release-retrospection-and-owner-led-product-learning.md)\n"
          )
          assessment_anchor = (
              "- [v0.2.0 source and OCI publication result]"
              "(assessments/v0-2-0-source-and-oci-publication-result.md)\n"
          )
          assessment_route = (
              "- [v0.2.0 release-series retrospective]"
              "(assessments/v0-2-0-release-series-retrospective.md)\n"
          )

          for anchor, route in (
              (decision_anchor, decision_route),
              (assessment_anchor, assessment_route),
          ):
              if text.count(anchor) != 1:
                  raise SystemExit(f"expected exactly one index anchor: {anchor!r}")
              if route in text:
                  raise SystemExit(f"index route already present: {route!r}")
              text = text.replace(anchor, anchor + route, 1)

          path.write_text(text, encoding="utf-8")
          PY

          rm .github/workflows/apply-v0-2-0-retrospective-index.yml

          expected=$(cat <<'EOF'
          .github/workflows/apply-v0-2-0-retrospective-index.yml
          knowledge/index.md
          EOF
          )
          actual=$(git status --short | sed 's/^...//' | sort)
          test "${actual}" = "$(printf '%s\n' "${expected}" | sort)"
          git diff --check

      - name: Commit and push the bounded index route
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Konstantinos Togias"
          git config user.email "info@ktogias.gr"
          git add -A
          git commit -m "Route the v0.2.0 release retrospective"
          git push origin HEAD:knowledge/v0-2-0-release-retrospective
