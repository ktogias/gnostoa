name: Apply staged-evidence projection patch

on:
  push:
    branches:
      - agent/freeze-v0-2-0-b3-contract

permissions:
  contents: write

jobs:
  apply-patch:
    if: ${{ github.event.head_commit.message == 'Authorize bounded staged-evidence projection application' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/freeze-v0-2-0-b3-contract
          fetch-depth: 0
          persist-credentials: true

      - name: Bind the triggering branch subject
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Apply the previously verified patch
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/apply_staged_evidence_projections.py
          rm .github/workflows/build-staged-evidence-projection-patch.yml
          rm .github/scripts/apply_staged_evidence_projections.py

          expected=$(cat <<'EOF'
          .github/scripts/apply_staged_evidence_projections.py
          .github/workflows/build-staged-evidence-projection-patch.yml
          README.md
          docs/roadmap.md
          docs/status.md
          knowledge/assessments/b3-independent-adoption-experiment-design.md
          knowledge/decisions/0052-use-staged-evidence-maturity-for-early-adoption-trials.md
          EOF
          )
          actual=$(git status --short | sed 's/^...//' | sort)
          test "${actual}" = "$(printf '%s\n' "${expected}" | sed 's/^          //' | sort)"
          git diff --check

      - name: Commit and push without rewriting history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Konstantinos Togias"
          git config user.email "info@ktogias.gr"
          git add -A
          git commit -m "Align current projections with staged evidence"
          git push origin HEAD:agent/freeze-v0-2-0-b3-contract
