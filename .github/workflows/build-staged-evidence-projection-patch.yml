name: Build staged-evidence projection patch

on:
  push:
    branches:
      - agent/freeze-v0-2-0-b3-contract

permissions:
  contents: read

jobs:
  build-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/freeze-v0-2-0-b3-contract
          fetch-depth: 1
          persist-credentials: false

      - name: Apply fail-closed replacements in the disposable workspace
        run: python .github/scripts/apply_staged_evidence_projections.py

      - name: Check the generated patch
        run: git diff --check

      - name: Upload the bounded patched files
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staged-evidence-projection-files
          path: |
            README.md
            docs/roadmap.md
            docs/status.md
            knowledge/assessments/b3-independent-adoption-experiment-design.md
            knowledge/decisions/0052-use-staged-evidence-maturity-for-early-adoption-trials.md
          if-no-files-found: error
          retention-days: 1
