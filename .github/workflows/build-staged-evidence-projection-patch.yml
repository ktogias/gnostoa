name: Build staged-evidence projection patch

on:
  push:
    branches:
      - agent/freeze-v0-2-0-b3-contract

permissions:
  contents: read

jobs:
  build-patch:
    if: ${{ github.event.head_commit.message == 'Add bounded staged-evidence patch build' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/freeze-v0-2-0-b3-contract
          fetch-depth: 1
          persist-credentials: false

      - name: Apply fail-closed replacements in the disposable workspace
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one literal match, found {count}")
              p.write_text(text.replace(old, new))

          def sub_once(path: str, pattern: str, replacement: str) -> None:
              p = Path(path)
              text = p.read_text()
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.DOTALL)
              if count != 1:
                  raise SystemExit(f"{path}: expected one regex match, found {count}")
              p.write_text(updated)

          replace_once(
              "knowledge/decisions/0052-use-staged-evidence-maturity-for-early-adoption-trials.md",
              """    - kind: supersedes
              target: /decisions/0051-select-the-v0-2-0-source-and-oci-publication-series.md
""",
              """    - kind: supersedes
              target: /decisions/0051-select-the-v0-2-0-source-and-oci-publication-series.md
              description: >-
                Partial supersession limited to section H, the B3-dependent sentence
                in section M, and the corresponding Work Item completion condition.
""",
          )

          replace_once(
              "knowledge/decisions/0052-use-staged-evidence-maturity-for-early-adoption-trials.md",
              """Evidence may move to a richer class when new feedback exists. Absence of a
          higher class does not invalidate a correctly labelled lower-class result.
""",
              """An evidence stream may accumulate richer, separately labelled layers. Each
          original result retains the evidence class under which it was produced.
          Absence of a higher class does not invalidate a correctly labelled lower-class
          result.
""",
          )

          sub_once(
              "README.md",
              r"The first real\n\[B3 independent-adoption methodology\]\(knowledge/assessments/b3-independent-adoption-experiment-design\.md\).*?semantic, Issue and final Change Request authority\.\n",
              """The strict
          [B3 independent-adoption methodology](knowledge/assessments/b3-independent-adoption-experiment-design.md)
          remains pre-registered for a later `INDEPENDENT` evidence stage. Four
          autonomous Nextcloud Mail adoption attempts are retained as historical
          controlled pre-B3 evidence: the baseline and frozen fresh-agent rerun under
          #117, the route-activation diagnostic under #122, and the post-remediation
          rerun under #125. Their original `REJECT` / `UNKNOWN` / `NO` dispositions
          remain unchanged.

          [Decision 0052](knowledge/decisions/0052-use-staged-evidence-maturity-for-early-adoption-trials.md)
          now governs the early product phase through staged evidence. The `v0.2.0`
          source and immutable OCI execution subject are published, reconciled and
          digest-bound. The release-series experiment boundary is the bounded
          [Nextcloud Mail `OWNER-LED` baseline](knowledge/assessments/nextcloud-mail-v0-2-0-owner-led-adoption-trial-baseline.md),
          with `human:ktogias` as the initial semantic and evaluation authority. The
          concrete task run, preliminary owner assessment and retrospective are later
          separate work; upstream or project-participant feedback is additive and does
          not block them. `ktogias/mail` is the local mutation workspace, while
          `nextcloud/mail` retains Issue and final Change Request authority. This
          evidence establishes neither independent adoption nor upstream acceptance.
""",
          )

          sub_once(
              "docs/status.md",
              r"The first real\n\[B3 independent-adoption methodology\]\(\.\./knowledge/assessments/b3-independent-adoption-experiment-design\.md\).*?Selection, release and freeze do not\nthemselves count as transfer evidence or owner disposition\.\n",
              """The strict
          [B3 independent-adoption methodology](../knowledge/assessments/b3-independent-adoption-experiment-design.md)
          remains pre-registered for a later `INDEPENDENT` evidence stage. Four
          autonomous Nextcloud Mail adoption attempts remain historical controlled
          pre-B3 evidence, with their original `REJECT` / `UNKNOWN` / `NO`
          dispositions unchanged.

          [Decision 0052](../knowledge/decisions/0052-use-staged-evidence-maturity-for-early-adoption-trials.md)
          now governs early-product evidence through distinct `SELF-HOSTED`,
          `OWNER-LED`, `COLLABORATIVE` and `INDEPENDENT` classes. The current
          Nextcloud Mail path is `OWNER-LED`, with `human:ktogias` as the initial
          semantic and evaluation authority. The `v0.2.0` source and immutable OCI
          subject are published, reconciled and digest-bound, and the release-series
          experiment boundary is the
          [bounded owner-led baseline](../knowledge/assessments/nextcloud-mail-v0-2-0-owner-led-adoption-trial-baseline.md).
          The concrete task run, preliminary assessment and retrospective are later
          separate work. Upstream feedback is additive rather than blocking, while
          strict `INDEPENDENT` evidence remains a later maturity-stage activity.
          `ktogias/mail` is the local mutation workspace; `nextcloud/mail` retains
          Issue and final Change Request authority. No independent-adoption or
          upstream-acceptance claim is made.
""",
          )

          sub_once(
              "docs/roadmap.md",
              r"The first real\n\[B3 independent-adoption methodology\]\(\.\./knowledge/assessments/b3-independent-adoption-experiment-design\.md\).*?Live lifecycle remains\nprovider-authoritative\.\n",
              """The strict
          [B3 independent-adoption methodology](../knowledge/assessments/b3-independent-adoption-experiment-design.md)
          remains pre-registered as a later maturity-stage `INDEPENDENT` evidence
          method. Four autonomous Nextcloud Mail adoption attempts remain historical
          controlled pre-B3 evidence, with their original `REJECT` / `UNKNOWN` / `NO`
          dispositions unchanged.

          [Decision 0052](../knowledge/decisions/0052-use-staged-evidence-maturity-for-early-adoption-trials.md)
          now governs early-product evidence through staged classes. The `v0.2.0`
          source and OCI artifact are published and their digest-bound release
          reconciliation is complete. For
          [Work Item #146](https://github.com/ktogias/gnostoa/issues/146), the final
          release-series experiment boundary is integration and provider read-back of
          the
          [Nextcloud Mail `OWNER-LED` baseline](../knowledge/assessments/nextcloud-mail-v0-2-0-owner-led-adoption-trial-baseline.md).
          The concrete owner-led task run, preliminary assessment and retrospective are
          later separate work; upstream feedback is additive, and strict
          `INDEPENDENT` evidence is deferred to a separately admitted maturity-stage
          activity. `ktogias/mail` remains the local mutation workspace and
          `nextcloud/mail` retains Issue and final Change Request authority. Live
          lifecycle remains provider-authoritative.
""",
          )

          sub_once(
              "docs/roadmap.md",
              r"control is selected\. Nextcloud Mail is already selected\. Operational work\ntoward B3 has begun, but its adoption attempts were rejected and remain bounded\nas controlled pre-B3 evidence under the strict eligibility contract\. The\n`v0\.2\.0` exact-subject rerun has not begun\. The current delivery sequence is\nthe published release's digest-bound reconciliation followed by the separate\nexact B3 contract freeze\. Provider state remains authoritative for its live\nlifecycle\.\n\n\| Work Items \| Problem addressed \| Completion signal \| Non-goal \|\n\|---\|---\|---\|---\|\n\| \[#146\]\(https://github\.com/ktogias/gnostoa/issues/146\) \| The immutable `v0\.2\.0` source and OCI artifact exist, while current release verification and public projections still require digest-bound reconciliation before the later B3 freeze\. \| Source, OCI digest, provenance, integrated release verification and public records agree; the later Nextcloud Mail B3 contract is frozen to exact subjects and the Work Item closes last\. \| B3 execution or owner disposition; `latest`, extra tags, multi-architecture, reproducibility claims, deployment or a new release framework\. \|",
              """control is selected. Nextcloud Mail is selected for an `OWNER-LED`
          early-product evidence stream under Decision 0052. The published `v0.2.0`
          release and digest-bound reconciliation are complete; the release Work
          Item's final experiment-boundary requirement is the integrated and
          provider-read-back owner-led baseline. The concrete task run and
          retrospective are later separate work, while strict `INDEPENDENT` B3
          evidence is deferred to a separately admitted maturity-stage activity.
          Provider state remains authoritative for its live lifecycle.

          | Work Items | Problem addressed | Completion signal | Non-goal |
          |---|---|---|---|
          | [#146](https://github.com/ktogias/gnostoa/issues/146) | The immutable `v0.2.0` source and OCI artifact are published and reconciled; the release series still needs its bounded early-product experiment boundary represented durably. | Source, OCI digest, provenance, integrated release verification and public records agree, and the Nextcloud Mail `OWNER-LED` baseline is integrated and provider-read back before lifecycle completion. | Executing or scoring the owner-led task; upstream feedback or strict `INDEPENDENT` evidence; `latest`, extra tags, multi-architecture, reproducibility claims, deployment or a new release framework. |""",
          )

          sub_once(
              "docs/roadmap.md",
              r"B3 methodology is\npre-registered and Nextcloud Mail is selected\. Operational work toward B3 has\nbegun; the rejected adoption attempts remain controlled pre-B3 records and\nproduced no final result\. The `v0\.2\.0` exact-subject rerun has not begun\. Work\nItem #146 separately governs the published release's reconciliation and\nexact-subject freeze; it does not execute or disposition the candidate-specific\nexperiment\.\n",
              """The strict B3 methodology remains pre-registered for later
          `INDEPENDENT` evidence. The rejected Nextcloud Mail attempts remain
          historical controlled pre-B3 records and produced no accepted or durable
          adoption result. Decision 0052 selects the current stream as `OWNER-LED`.
          Work Item #146 governs only the published release reconciliation and the
          integrated/provider-read-back owner-led baseline; the concrete task run,
          preliminary assessment and retrospective are later work, and a strict
          independent experiment requires separate future admission.
""",
          )

          sub_once(
              "knowledge/assessments/b3-independent-adoption-experiment-design.md",
              r"## Later chronology note\n\nThe preceding stop point is the pre-registration state at the time this design\nwas frozen, not a current status projection\..*\Z",
              """## Later chronology and staged-evidence note

          The preceding stop point is the pre-registration state at the time this
          design was frozen, not a current status projection. Four autonomous
          Nextcloud Mail adoption attempts were later recorded: the baseline attempt
          and frozen fresh-agent rerun under #117, the route-activation diagnostic
          under #122, and the post-remediation rerun under #125. All four retain their
          original owner acceptance `REJECT`, measured utility `UNKNOWN` and durable
          adoption `NO`. They remain historical controlled pre-B3 evidence because
          they did not satisfy this design's strict independent-owner eligibility.

          [Decision 0052](../decisions/0052-use-staged-evidence-maturity-for-early-adoption-trials.md)
          subsequently introduced staged evidence for Gnostoa's early product phase.
          The current `v0.2.0` Nextcloud Mail path is therefore classified as
          `OWNER-LED`, with `human:ktogias` as the initial semantic and evaluation
          authority. Its integrated baseline, rather than a strict independent
          contract, is the v0.2.0 release-series experiment boundary. The concrete
          task run, preliminary assessment and retrospective are separate later work,
          and upstream feedback is additive rather than an entry gate.

          This later choice does not rewrite the historical attempts or satisfy this
          strict methodology. The methodology remains available for a separately
          admitted future `INDEPENDENT` experiment when product maturity and the
          intended claims make its stronger controls proportionate.
""",
          )
          PY

          git diff --check

      - name: Upload the bounded patched files
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staged-evidence-projection-files
          path: |
            README.md
            docs/roadmap.md
            docs/status.md
            knowledge/assessments/b3-independent-adoption-experiment-design.md
            knowledge/decisions/0052-use-staged-evidence-maturity-for-early-adoption-trials.md
          if-no-files-found: error
          retention-days: 1
