name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Decision 0093: trusted author associations only, in addition to the
    # action's own write-access check on the triggering actor.
    if: |
      (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write # OIDC exchange for the Claude GitHub App token
      actions: read # Required for Claude to read CI results on PRs
    steps:
      # Decision 0094 rules 8 and 9. Agent mode resolves no Pull Request of its
      # own, so the head must be bound explicitly -- but binding it would place
      # contributor-controlled code in the job that holds the Claude credential.
      # This step resolves the head with the read-only token and fails closed on
      # a fork, before any candidate byte is checked out. The author-association
      # gate is not sufficient: it constrains who comments, not whose code runs.
      - name: Resolve trusted review head
        id: review_head
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PULL_NUMBER: >-
            ${{ github.event.pull_request.number
              || (github.event.issue.pull_request && github.event.issue.number) }}
          # Review triggers carry their own identities. Using them keeps the
          # reviewed commit bound to the event, so a push between queue and
          # execution cannot swap the candidate out from under a request whose
          # forwarded path, line and hunk describe the older one.
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -eu
          if [ -z "${PULL_NUMBER}" ]; then
            printf 'head_sha=%s\n' "${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
            printf 'base_sha=%s\n' "${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [ -n "${EVENT_HEAD_SHA}" ]; then
            if [ "${EVENT_HEAD_REPO}" != "${REPOSITORY}" ]; then
              echo "ERROR: refusing a fork-controlled head (${EVENT_HEAD_REPO})" >&2
              exit 1
            fi
            printf 'head_sha=%s\n' "${EVENT_HEAD_SHA}" >> "${GITHUB_OUTPUT}"
            printf 'base_sha=%s\n' "${EVENT_BASE_SHA}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          head_repo="$(gh api "repos/${REPOSITORY}/pulls/${PULL_NUMBER}" \
            --jq '.head.repo.full_name')"
          if [ "${head_repo}" != "${REPOSITORY}" ]; then
            echo "ERROR: refusing to check out a fork-controlled head (${head_repo})" >&2
            exit 1
          fi
          gh api "repos/${REPOSITORY}/pulls/${PULL_NUMBER}" \
            --jq '"head_sha=\(.head.sha)\nbase_sha=\(.base.sha)"' >> "${GITHUB_OUTPUT}"

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.review_head.outputs.head_sha }}
          # A three-dot diff against the base needs both sides present.
          fetch-depth: 0
          persist-credentials: false

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@9171db3e57d6a3140a37ddc2ba92788584e0ead6 # v1.0.234
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          # Decision 0094: supplying `prompt` selects agent mode, which fetches no
          # GitHub data. Tag mode instead retrieves every comment and review with
          # no cap, which exhausted the request on a large Pull Request. Every
          # interpolation below is independent of discussion length.
          display_report: true
          # The pinned action disables Bash by default, so the retrieval the
          # prompt asks for needs an explicit grant. Read-only verbs only:
          # Bash(git:*) would admit push, commit and reset.
          claude_args: >-
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(git show:*),mcp__github_ci__get_ci_status,mcp__github_ci__get_workflow_run_details,mcp__github_ci__download_job_log"
          prompt: |
            Read-only review of a Gnostoa Pull Request. You have no pre-loaded
            discussion history; gather only what the request needs.

            Repository: ${{ github.repository }}
            Item: #${{ github.event.issue.number }}${{ github.event.pull_request.number }}
            Title: >-
              ${{ (github.event.issue.pull_request && github.event.issue.title)
                  || (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                        github.event.issue.author_association)
                      && github.event.issue.title)
                  || (github.event.issue.title
                      && '(withheld: untrusted issue author)')
                  || '' }}
            Base: ${{ steps.review_head.outputs.base_sha }}
            Head: ${{ steps.review_head.outputs.head_sha }}

            Start with README.md, then AGENTS.md, and follow the route it names for
            the area under review. Use your own tools for context, diffing against
            the resolved base rather than a fixed branch:
              git diff --stat ${{ steps.review_head.outputs.base_sha }}...HEAD
              git diff ${{ steps.review_head.outputs.base_sha }}...HEAD -- <path>
              git log --oneline ${{ steps.review_head.outputs.base_sha }}..HEAD
            and Read or Grep for the current state of any file.

            If the Base and Head shown above are the same commit there is no Pull
            Request: the request concerns the issue itself, so answer it from the
            repository rather than from a diff.

            You cannot see the discussion. If a point may already be dispositioned,
            raise it as a question rather than an assertion.

            Report correctness and security findings with file:line and a concrete
            failure scenario for each. State plainly what you did not examine. You
            supply no approval, merge authority or reviewer qualification, and a
            green check is not semantic acceptance.

            --- maintained current state ---
            ${{ (github.event.issue.pull_request && github.event.issue.body)
                || (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                      github.event.issue.author_association)
                    && github.event.issue.body)
                || (github.event.issue.body
                    && '(withheld: the issue author is not a trusted association;
                    this job holds a credential and publishes publicly)')
                || '' }}
            ${{ github.event.pull_request.body }}

            --- inline location, when the request came from a review comment ---
            ${{ github.event.comment.path }}:${{ github.event.comment.line }}
            ${{ github.event.comment.diff_hunk }}

            --- request ---
            ${{ github.event.comment.body }}
            ${{ github.event.review.body }}
