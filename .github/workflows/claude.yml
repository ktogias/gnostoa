name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Decision 0093: trusted author associations only, in addition to the
    # action's own write-access check on the triggering actor.
    if: |
      (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write # OIDC exchange for the Claude GitHub App token
      actions: read # Required for Claude to read CI results on PRs
    steps:
      # Decision 0094 rules 8 and 9. Agent mode resolves no Pull Request of its
      # own, so the head must be bound explicitly -- but binding it would place
      # contributor-controlled code in the job that holds the Claude credential.
      # This step resolves the head with the read-only token and fails closed on
      # a fork, before any candidate byte is checked out. The author-association
      # gate is not sufficient: it constrains who comments, not whose code runs.
      - name: Resolve trusted review head
        id: review_head
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PULL_NUMBER: >-
            ${{ github.event.pull_request.number
              || (github.event.issue.pull_request && github.event.issue.number) }}
          # Review triggers carry their own identities. Using them keeps the
          # reviewed commit bound to the event, so a push between queue and
          # execution cannot swap the candidate out from under a request whose
          # forwarded path, line and hunk describe the older one.
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          # A push landing while an older review is open leaves the Pull Request
          # head ahead of the commit the review actually describes.
          # ci/review_github_current_state.py already treats review.commit_id as a
          # review's head_commit, so the checkout follows the same identity.
          REVIEWED_COMMIT: >-
            ${{ github.event.review.commit_id
              || github.event.comment.commit_id }}
        run: |
          set -eu
          # The prompt keys item type on this number, never on head/base
          # equality: a merged or empty Pull Request can report both the same.
          if [ -z "${PULL_NUMBER}" ]; then
            printf 'pull_number=\n' >> "${GITHUB_OUTPUT}"
            printf 'head_sha=%s\n' "${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
            printf 'base_sha=%s\n' "${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          printf 'pull_number=%s\n' "${PULL_NUMBER}" >> "${GITHUB_OUTPUT}"
          if [ -n "${EVENT_HEAD_SHA}" ]; then
            if [ "${EVENT_HEAD_REPO}" != "${REPOSITORY}" ]; then
              echo "ERROR: refusing a fork-controlled head (${EVENT_HEAD_REPO})" >&2
              exit 1
            fi
            if [ -n "${REVIEWED_COMMIT}" ]; then
              printf 'head_sha=%s\n' "${REVIEWED_COMMIT}" >> "${GITHUB_OUTPUT}"
            else
              printf 'head_sha=%s\n' "${EVENT_HEAD_SHA}" >> "${GITHUB_OUTPUT}"
            fi
            printf 'base_sha=%s\n' "${EVENT_BASE_SHA}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          head_repo="$(gh api "repos/${REPOSITORY}/pulls/${PULL_NUMBER}" \
            --jq '.head.repo.full_name')"
          if [ "${head_repo}" != "${REPOSITORY}" ]; then
            echo "ERROR: refusing to check out a fork-controlled head (${head_repo})" >&2
            exit 1
          fi
          gh api "repos/${REPOSITORY}/pulls/${PULL_NUMBER}" \
            --jq '"head_sha=\(.head.sha)\nbase_sha=\(.base.sha)"' >> "${GITHUB_OUTPUT}"

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.review_head.outputs.head_sha }}
          # A three-dot diff against the base needs both sides present.
          fetch-depth: 0
          persist-credentials: false

      - name: Install the trusted read-only git wrapper
        env:
          WRAPPER_DIR: ${{ runner.temp }}/gnostoa-review-bin
        run: |
          set -eu
          mkdir -p "${WRAPPER_DIR}"
          # The body is written from this workflow file, which comes from the
          # default branch, so the candidate cannot supply or rewrite it.
          cat > "${WRAPPER_DIR}/review-git" <<'WRAPPER'
          #!/bin/sh
          # Trusted read-only git for the bounded reviewer.
          #
          # A prefix grant such as Bash(git log:*) is not read-only:
          #   git log --output=.git/config --format=%B -1 <sha>
          # writes an attacker-authored commit message into repository config, and
          #   git diff --ext-diff <base> <head>
          # then executes the diff.external it configured. In this credential-
          # bearing job that turns candidate content into arbitrary execution.
          #
          # This wrapper therefore takes a positive allowlist: any option not
          # named below is refused, so no new git option can reopen the hole.
          set -eu
          verb=${1:-}
          case "${verb}" in
            diff|log|show) shift ;;
            *)
              echo "refused: ${verb:-<none>} is not diff, log or show" >&2
              exit 2
              ;;
          esac
          # Options are not the only hazard. `git diff <pathA> <pathB>` implies
          # --no-index when a path lies outside the working tree, so an unchecked
          # path argument reads arbitrary host files into a public step summary.
          # Every argument is therefore classified: an allowlisted option, a
          # revision, or -- after `--` -- a relative in-tree path.
          is_revision() {
            printf '%s' "$1" | grep -Eq \
              '^(HEAD|[0-9a-fA-F]{7,40})(~[0-9]+|\^[0-9]*)?(\.\.\.?(HEAD|[0-9a-fA-F]{7,40})(~[0-9]+|\^[0-9]*)?)?$'
          }
          is_in_tree_path() {
            case "$1" in
              -*|/*|..|../*|*/..|*/../*) return 1 ;;
            esac
            printf '%s' "$1" | grep -Eq '^[A-Za-z0-9._][A-Za-z0-9._/-]*$'
          }
          after_separator=0
          for argument in "$@"; do
            if [ "${after_separator}" -eq 1 ]; then
              if is_in_tree_path "${argument}"; then
                continue
              fi
              echo "refused: path ${argument} is not a relative in-tree path" >&2
              exit 2
            fi
            case "${argument}" in
              --)
                after_separator=1
                continue
                ;;
              --stat|--numstat|--name-only|--name-status|--oneline) continue ;;
              -[0-9]|-[0-9][0-9]) continue ;;
              -*)
                echo "refused: option ${argument} is not allowlisted" >&2
                exit 2
                ;;
            esac
            if is_revision "${argument}"; then
              continue
            fi
            echo "refused: ${argument} is neither an option nor a revision" >&2
            exit 2
          done
          GIT_CONFIG_NOSYSTEM=1 \
          GIT_CONFIG_SYSTEM=/dev/null \
          GIT_CONFIG_GLOBAL=/dev/null \
          GIT_CONFIG_COUNT=0 \
          GIT_ATTR_NOSYSTEM=1 \
          GIT_NO_REPLACE_OBJECTS=1 \
          GIT_EXTERNAL_DIFF= \
          exec git --no-pager \
            -c core.hooksPath=/dev/null \
            -c diff.external= \
            -c core.fsmonitor= \
            -c uploadpack.packObjectsHook= \
            "${verb}" --no-ext-diff "$@"
          WRAPPER
          chmod 0755 "${WRAPPER_DIR}/review-git"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@9171db3e57d6a3140a37ddc2ba92788584e0ead6 # v1.0.234
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          # Decision 0094: supplying `prompt` selects agent mode, which fetches no
          # GitHub data. Tag mode instead retrieves every comment and review with
          # no cap, which exhausted the request on a large Pull Request. Every
          # interpolation below is independent of discussion length.
          display_report: true
          # The pinned action disables Bash by default, so the retrieval the
          # prompt asks for needs an explicit grant. The grant is the trusted
          # wrapper installed above, never a git prefix: Bash(git log:*) admits
          # --output=.git/config, which a following --ext-diff turns into
          # arbitrary execution.
          claude_args: >-
            --allowedTools "Read,Grep,Glob,Bash(${{ runner.temp }}/gnostoa-review-bin/review-git:*),mcp__github_ci__get_ci_status,mcp__github_ci__get_workflow_run_details,mcp__github_ci__download_job_log"
          prompt: |
            Read-only review of a Gnostoa Pull Request. You have no pre-loaded
            discussion history; gather only what the request needs.

            Repository: ${{ github.repository }}
            Item: #${{ github.event.issue.number }}${{ github.event.pull_request.number }}
            Pull Request: ${{ steps.review_head.outputs.pull_number
              || '(none: this request concerns an issue)' }}
            Title: >-
              ${{ (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                        github.event.issue.author_association)
                      && github.event.issue.title)
                  || (github.event.issue.title
                      && '(withheld: untrusted issue author)')
                  || '' }}
            Base: ${{ steps.review_head.outputs.base_sha }}
            Head: ${{ steps.review_head.outputs.head_sha }}

            Start with README.md, then AGENTS.md, and follow the route it names for
            the area under review. Use your own tools for context, diffing against
            the resolved base rather than a fixed branch:
              ${{ runner.temp }}/gnostoa-review-bin/review-git diff --stat ${{ steps.review_head.outputs.base_sha }}...HEAD
              ${{ runner.temp }}/gnostoa-review-bin/review-git diff ${{ steps.review_head.outputs.base_sha }}...HEAD -- <path>
              ${{ runner.temp }}/gnostoa-review-bin/review-git log --oneline ${{ steps.review_head.outputs.base_sha }}..HEAD
            and Read or Grep for the current state of any file. That wrapper is the
            only git you can run. It takes diff, log or show and an allowlist of
            options -- --stat, --numstat, --name-only, --name-status, --oneline,
            -<n> and -- -- and refuses anything else, so use Read and Grep rather
            than a custom --format.

            If no Pull Request number is shown above, the request concerns the
            issue itself: answer it from the repository rather than from a diff.
            Do not infer this from Base and Head instead -- a merged or empty Pull
            Request can report both as the same commit.

            You cannot see the discussion. If a point may already be dispositioned,
            raise it as a question rather than an assertion.

            Report correctness and security findings with file:line and a concrete
            failure scenario for each. State plainly what you did not examine. You
            supply no approval, merge authority or reviewer qualification, and a
            green check is not semantic acceptance.

            --- maintained current state ---
            ${{ (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                      github.event.issue.author_association)
                    && github.event.issue.body)
                || (github.event.issue.body
                    && '(withheld: the issue author is not a trusted association;
                    this job holds a credential and publishes publicly)')
                || '' }}
            ${{ (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                      github.event.pull_request.author_association)
                    && github.event.pull_request.body)
                || (github.event.pull_request.body
                    && '(withheld: the Pull Request author is not a trusted
                    association; this job holds a credential and publishes
                    publicly)')
                || '' }}

            --- inline location, when the request came from a review comment ---
            ${{ github.event.comment.path }}:${{ github.event.comment.line }}
            original commit ${{ github.event.comment.original_commit_id }} line ${{ github.event.comment.original_line }}
            ${{ github.event.comment.diff_hunk }}

            --- request ---
            ${{ github.event.comment.body }}
            ${{ github.event.review.body }}
