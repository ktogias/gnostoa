name: Export exact PR 314 head 0105

on:
  push:
    branches:
      - ops/pr314-source-0105

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 0105fb1626eb233888d397a67c02d79d29337075
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact source identity
        shell: bash
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "0105fb1626eb233888d397a67c02d79d29337075"
          test "$(git rev-parse 'HEAD^{tree}')" = "6564f18a58226a738183b71b2c6f415e8627b3dc"
          test -z "$(git status --porcelain)"
      - name: Create verified Git bundle
        shell: bash
        run: |
          set -eu
          git branch --force gnostoa-export-source "0105fb1626eb233888d397a67c02d79d29337075"
          bundle="${RUNNER_TEMP}/gnostoa-pr314-0105fb1626eb233888d397a67c02d79d29337075.bundle"
          git bundle create "${bundle}" refs/heads/gnostoa-export-source
          git bundle verify "${bundle}"
          sha256sum "${bundle}" > "${bundle}.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gnostoa-pr314-source-0105fb1626eb233888d397a67c02d79d29337075
          path: |
            ${{ runner.temp }}/gnostoa-pr314-0105fb1626eb233888d397a67c02d79d29337075.bundle
            ${{ runner.temp }}/gnostoa-pr314-0105fb1626eb233888d397a67c02d79d29337075.bundle.sha256
          if-no-files-found: error
          retention-days: 1
