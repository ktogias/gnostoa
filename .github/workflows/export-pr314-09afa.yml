name: Export exact PR 314 head 09afa

on:
  push:
    branches:
      - ops/pr314-source-09afa

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 09afa312a980cfa4334f9322be46d0ecec0349fa
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact source identity
        shell: bash
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "09afa312a980cfa4334f9322be46d0ecec0349fa"
          test "$(git rev-parse 'HEAD^{tree}')" = "f8cfdc41ecb8b0db2e092b1d957e48cc06ee0040"
          test -z "$(git status --porcelain)"
      - name: Create verified Git bundle
        shell: bash
        run: |
          set -eu
          git branch --force gnostoa-export-source "09afa312a980cfa4334f9322be46d0ecec0349fa"
          bundle="${RUNNER_TEMP}/gnostoa-pr314-09afa312a980cfa4334f9322be46d0ecec0349fa.bundle"
          git bundle create "${bundle}" refs/heads/gnostoa-export-source
          git bundle verify "${bundle}"
          sha256sum "${bundle}" > "${bundle}.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gnostoa-pr314-source-09afa312a980cfa4334f9322be46d0ecec0349fa
          path: |
            ${{ runner.temp }}/gnostoa-pr314-09afa312a980cfa4334f9322be46d0ecec0349fa.bundle
            ${{ runner.temp }}/gnostoa-pr314-09afa312a980cfa4334f9322be46d0ecec0349fa.bundle.sha256
          if-no-files-found: error
          retention-days: 1
