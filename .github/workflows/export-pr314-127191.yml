name: Export exact PR 314 head 127191

on:
  push:
    branches:
      - ops/pr314-source-127191

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 127191bc78daebd38548ac4e95cf9bdd141b2fb5
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact source identity
        shell: bash
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "127191bc78daebd38548ac4e95cf9bdd141b2fb5"
          test "$(git rev-parse 'HEAD^{tree}')" = "05b13790d2a97ba373dba9e65999018d612e13b1"
          test -z "$(git status --porcelain)"
      - name: Create verified Git bundle
        shell: bash
        run: |
          set -eu
          git branch --force gnostoa-export-source "127191bc78daebd38548ac4e95cf9bdd141b2fb5"
          bundle="${RUNNER_TEMP}/gnostoa-pr314-127191bc78daebd38548ac4e95cf9bdd141b2fb5.bundle"
          git bundle create "${bundle}" refs/heads/gnostoa-export-source
          git bundle verify "${bundle}"
          sha256sum "${bundle}" > "${bundle}.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gnostoa-pr314-source-127191bc78daebd38548ac4e95cf9bdd141b2fb5
          path: |
            ${{ runner.temp }}/gnostoa-pr314-127191bc78daebd38548ac4e95cf9bdd141b2fb5.bundle
            ${{ runner.temp }}/gnostoa-pr314-127191bc78daebd38548ac4e95cf9bdd141b2fb5.bundle.sha256
          if-no-files-found: error
          retention-days: 1
