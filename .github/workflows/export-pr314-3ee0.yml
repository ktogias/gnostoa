name: Export exact PR 314 head 3ee0

on:
  push:
    branches:
      - ops/pr314-source-3ee0

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 3ee0e0980276a6f818ed5781a94c15178190036c
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact source identity
        shell: bash
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "3ee0e0980276a6f818ed5781a94c15178190036c"
          test "$(git rev-parse 'HEAD^{tree}')" = "76f81274b53bab61e41207875150e1b0341f1ae2"
          test -z "$(git status --porcelain)"
      - name: Create verified Git bundle
        shell: bash
        run: |
          set -eu
          git branch --force gnostoa-export-source "3ee0e0980276a6f818ed5781a94c15178190036c"
          bundle="${RUNNER_TEMP}/gnostoa-pr314-3ee0e0980276a6f818ed5781a94c15178190036c.bundle"
          git bundle create "${bundle}" refs/heads/gnostoa-export-source
          git bundle verify "${bundle}"
          sha256sum "${bundle}" > "${bundle}.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gnostoa-pr314-source-3ee0e0980276a6f818ed5781a94c15178190036c
          path: |
            ${{ runner.temp }}/gnostoa-pr314-3ee0e0980276a6f818ed5781a94c15178190036c.bundle
            ${{ runner.temp }}/gnostoa-pr314-3ee0e0980276a6f818ed5781a94c15178190036c.bundle.sha256
          if-no-files-found: error
          retention-days: 1
