name: Export exact PR 314 token-test parent

on:
  push:
    branches:
      - ops/pr314-source-export-3fae-token-test

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact parent
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 3fae0d6e2210a0ffe49f3b95ecc51b48f67c8c3b
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact source identity
        shell: bash
        env:
          EXPECTED_SHA: 3fae0d6e2210a0ffe49f3b95ecc51b48f67c8c3b
          EXPECTED_TREE: 454e1976fb553f0fea9b3777adb0fe2998d51bb4
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          test "$(git rev-parse 'HEAD^{tree}')" = "${EXPECTED_TREE}"
          test -z "$(git status --porcelain)"

      - name: Create verified Git bundle
        shell: bash
        env:
          EXPECTED_SHA: 3fae0d6e2210a0ffe49f3b95ecc51b48f67c8c3b
        run: |
          set -eu
          git branch --force gnostoa-export-source "${EXPECTED_SHA}"
          bundle="${RUNNER_TEMP}/gnostoa-pr314-3fae-token-test.bundle"
          git bundle create "${bundle}" refs/heads/gnostoa-export-source
          git bundle verify "${bundle}"
          sha256sum "${bundle}" > "${bundle}.sha256"

      - name: Upload exact source bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gnostoa-pr314-source-3fae0d6e2210a0ffe49f3b95ecc51b48f67c8c3b
          path: |
            ${{ runner.temp }}/gnostoa-pr314-3fae-token-test.bundle
            ${{ runner.temp }}/gnostoa-pr314-3fae-token-test.bundle.sha256
          if-no-files-found: error
          retention-days: 1
