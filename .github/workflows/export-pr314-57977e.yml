name: Export exact PR 314 head 57977e

on:
  push:
    branches:
      - ops/pr314-source-57977e

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 57977e471b1cea9d125fffcbbe68cc6f560e8a32
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact source identity
        shell: bash
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "57977e471b1cea9d125fffcbbe68cc6f560e8a32"
          test "$(git rev-parse 'HEAD^{tree}')" = "883815f3d7b26def9a892a9c4e54e58c0bcbfec5"
          test -z "$(git status --porcelain)"
      - name: Create verified Git bundle
        shell: bash
        run: |
          set -eu
          git branch --force gnostoa-export-source "57977e471b1cea9d125fffcbbe68cc6f560e8a32"
          bundle="${RUNNER_TEMP}/gnostoa-pr314-57977e471b1cea9d125fffcbbe68cc6f560e8a32.bundle"
          git bundle create "${bundle}" refs/heads/gnostoa-export-source
          git bundle verify "${bundle}"
          sha256sum "${bundle}" > "${bundle}.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gnostoa-pr314-source-57977e471b1cea9d125fffcbbe68cc6f560e8a32
          path: |
            ${{ runner.temp }}/gnostoa-pr314-57977e471b1cea9d125fffcbbe68cc6f560e8a32.bundle
            ${{ runner.temp }}/gnostoa-pr314-57977e471b1cea9d125fffcbbe68cc6f560e8a32.bundle.sha256
          if-no-files-found: error
          retention-days: 1
