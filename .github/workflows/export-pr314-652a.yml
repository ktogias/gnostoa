name: Export exact PR 314 head 652a

on:
  push:
    branches:
      - ops/pr314-source-652a

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 652a21b4eefb6e53a88ac823edad95ba089e55f8
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact source identity
        shell: bash
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "652a21b4eefb6e53a88ac823edad95ba089e55f8"
          test "$(git rev-parse 'HEAD^{tree}')" = "1f8fa2e0e46ab67ae1a4e197eddb41a4041dddde"
          test -z "$(git status --porcelain)"
      - name: Create verified Git bundle
        shell: bash
        run: |
          set -eu
          git branch --force gnostoa-export-source "652a21b4eefb6e53a88ac823edad95ba089e55f8"
          bundle="${RUNNER_TEMP}/gnostoa-pr314-652a21b4eefb6e53a88ac823edad95ba089e55f8.bundle"
          git bundle create "${bundle}" refs/heads/gnostoa-export-source
          git bundle verify "${bundle}"
          sha256sum "${bundle}" > "${bundle}.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gnostoa-pr314-source-652a21b4eefb6e53a88ac823edad95ba089e55f8
          path: |
            ${{ runner.temp }}/gnostoa-pr314-652a21b4eefb6e53a88ac823edad95ba089e55f8.bundle
            ${{ runner.temp }}/gnostoa-pr314-652a21b4eefb6e53a88ac823edad95ba089e55f8.bundle.sha256
          if-no-files-found: error
          retention-days: 1
