name: Export exact PR 314 b1c6 source

on:
  push:
    branches:
      - ops/pr314-source-b1c6e9

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: b1c6e9a5e26c4e7b02741644ad43806aa4e25f45
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact source identity
        shell: bash
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "b1c6e9a5e26c4e7b02741644ad43806aa4e25f45"
          test "$(git rev-parse 'HEAD^{tree}')" = "cbf5c5bafdf2634229b208ee4e1414ec6e839074"
          test -z "$(git status --porcelain)"
      - name: Create verified Git bundle
        shell: bash
        run: |
          set -eu
          git branch --force gnostoa-export-source "b1c6e9a5e26c4e7b02741644ad43806aa4e25f45"
          bundle="${RUNNER_TEMP}/gnostoa-pr314-b1c6e9a5e26c4e7b02741644ad43806aa4e25f45.bundle"
          git bundle create "${bundle}" refs/heads/gnostoa-export-source
          git bundle verify "${bundle}"
          sha256sum "${bundle}" > "${bundle}.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gnostoa-pr314-source-b1c6e9a5e26c4e7b02741644ad43806aa4e25f45
          path: |
            ${{ runner.temp }}/gnostoa-pr314-b1c6e9a5e26c4e7b02741644ad43806aa4e25f45.bundle
            ${{ runner.temp }}/gnostoa-pr314-b1c6e9a5e26c4e7b02741644ad43806aa4e25f45.bundle.sha256
          if-no-files-found: error
          retention-days: 1
