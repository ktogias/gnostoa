name: Export exact PR 314 bb351e source

on:
  push:
    branches:
      - ops/pr314-source-bb351e

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: bb351e832a7f95861bdc25ce277893346656b5e7
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact source identity
        shell: bash
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "bb351e832a7f95861bdc25ce277893346656b5e7"
          test "$(git rev-parse 'HEAD^{tree}')" = "103cffbd0d51fe9e54fb3e2b4a48dbc29ecae733"
          test -z "$(git status --porcelain)"
      - name: Create verified Git bundle
        shell: bash
        run: |
          set -eu
          git branch --force gnostoa-export-source "bb351e832a7f95861bdc25ce277893346656b5e7"
          bundle="${RUNNER_TEMP}/gnostoa-pr314-bb351e832a7f95861bdc25ce277893346656b5e7.bundle"
          git bundle create "${bundle}" refs/heads/gnostoa-export-source
          git bundle verify "${bundle}"
          sha256sum "${bundle}" > "${bundle}.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gnostoa-pr314-source-bb351e832a7f95861bdc25ce277893346656b5e7
          path: |
            ${{ runner.temp }}/gnostoa-pr314-bb351e832a7f95861bdc25ce277893346656b5e7.bundle
            ${{ runner.temp }}/gnostoa-pr314-bb351e832a7f95861bdc25ce277893346656b5e7.bundle.sha256
          if-no-files-found: error
          retention-days: 1
