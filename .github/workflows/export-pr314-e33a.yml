name: Export exact PR 314 head e33a

on:
  push:
    branches:
      - ops/pr314-source-e33a

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: e33ab8a629cf78da9ad35543ec2ffa912137614a
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact source identity
        shell: bash
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "e33ab8a629cf78da9ad35543ec2ffa912137614a"
          test "$(git rev-parse 'HEAD^{tree}')" = "1aba3cbe6f84c22383623db18edf4e538caa2412"
          test -z "$(git status --porcelain)"
      - name: Create verified Git bundle
        shell: bash
        run: |
          set -eu
          git branch --force gnostoa-export-source "e33ab8a629cf78da9ad35543ec2ffa912137614a"
          bundle="${RUNNER_TEMP}/gnostoa-pr314-e33ab8a629cf78da9ad35543ec2ffa912137614a.bundle"
          git bundle create "${bundle}" refs/heads/gnostoa-export-source
          git bundle verify "${bundle}"
          sha256sum "${bundle}" > "${bundle}.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gnostoa-pr314-source-e33ab8a629cf78da9ad35543ec2ffa912137614a
          path: |
            ${{ runner.temp }}/gnostoa-pr314-e33ab8a629cf78da9ad35543ec2ffa912137614a.bundle
            ${{ runner.temp }}/gnostoa-pr314-e33ab8a629cf78da9ad35543ec2ffa912137614a.bundle.sha256
          if-no-files-found: error
          retention-days: 1
