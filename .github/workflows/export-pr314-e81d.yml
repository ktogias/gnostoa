name: Export exact PR 314 head e81d

on:
  push:
    branches:
      - ops/pr314-source-e81d

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: e81d143578127cf8076b60ef33a1575f4ed0a59f
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact source identity
        shell: bash
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "e81d143578127cf8076b60ef33a1575f4ed0a59f"
          test "$(git rev-parse 'HEAD^{tree}')" = "c93b41a745450d8195aaae2981cb19010f24661f"
          test -z "$(git status --porcelain)"
      - name: Create verified Git bundle
        shell: bash
        run: |
          set -eu
          git branch --force gnostoa-export-source "e81d143578127cf8076b60ef33a1575f4ed0a59f"
          bundle="${RUNNER_TEMP}/gnostoa-pr314-e81d143578127cf8076b60ef33a1575f4ed0a59f.bundle"
          git bundle create "${bundle}" refs/heads/gnostoa-export-source
          git bundle verify "${bundle}"
          sha256sum "${bundle}" > "${bundle}.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gnostoa-pr314-source-e81d143578127cf8076b60ef33a1575f4ed0a59f
          path: |
            ${{ runner.temp }}/gnostoa-pr314-e81d143578127cf8076b60ef33a1575f4ed0a59f.bundle
            ${{ runner.temp }}/gnostoa-pr314-e81d143578127cf8076b60ef33a1575f4ed0a59f.bundle.sha256
          if-no-files-found: error
          retention-days: 1
