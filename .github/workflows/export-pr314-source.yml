name: Export exact PR 314 source bundle

on:
  push:
    branches:
      - ops/analyzer-readback-source-export-314

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact implementation parent
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 099163e35bf0e4934b3e2c0d33baf88ac3802cf8
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact source identity
        shell: bash
        env:
          EXPECTED_SHA: 099163e35bf0e4934b3e2c0d33baf88ac3802cf8
          EXPECTED_TREE: 1acb848bf4bf8ab276ad5fd0960ac41f9211073b
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          test "$(git rev-parse 'HEAD^{tree}')" = "${EXPECTED_TREE}"
          git status --short
          test -z "$(git status --porcelain)"

      - name: Create verified Git bundle
        shell: bash
        env:
          EXPECTED_SHA: 099163e35bf0e4934b3e2c0d33baf88ac3802cf8
        run: |
          set -eu
          git branch --force gnostoa-export-source "${EXPECTED_SHA}"
          bundle="${RUNNER_TEMP}/gnostoa-pr314-099163e35bf0e4934b3e2c0d33baf88ac3802cf8.bundle"
          git bundle create "${bundle}" refs/heads/gnostoa-export-source
          git bundle verify "${bundle}"
          sha256sum "${bundle}" > "${bundle}.sha256"
          test -s "${bundle}"
          test -s "${bundle}.sha256"

      - name: Set up trusted Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Build portable locked Python 3.12 development environment
        shell: bash
        run: |
          set -eu
          destination="${RUNNER_TEMP}/python312-dev"
          mkdir -p "${destination}"
          cp -a "${pythonLocation}/." "${destination}/"
          observed_prefix="$("${destination}/bin/python" -c 'import sys; print(sys.prefix)')"
          test "${observed_prefix}" = "${destination}"
          "${destination}/bin/python" -m pip install \
            --disable-pip-version-check \
            --only-binary=:all: \
            --require-hashes \
            -r requirements/development.lock
          test "$("${destination}/bin/python" -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')" = "3.12"
          test "$("${destination}/bin/python" -m ruff --version)" = "ruff 0.16.0"
          tar -C "${RUNNER_TEMP}" -czf "${RUNNER_TEMP}/gnostoa-python312-dev.tgz" python312-dev
          sha256sum "${RUNNER_TEMP}/gnostoa-python312-dev.tgz" > "${RUNNER_TEMP}/gnostoa-python312-dev.tgz.sha256"

      - name: Upload portable Python 3.12 development environment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gnostoa-pr314-python312-dev
          path: |
            ${{ runner.temp }}/gnostoa-python312-dev.tgz
            ${{ runner.temp }}/gnostoa-python312-dev.tgz.sha256
          if-no-files-found: error
          retention-days: 1

      - name: Download exact locked Ruff wheel
        shell: bash
        env:
          RUFF_SHA256: 4f11a8d11010301d0a398a2fdef67691feca7294da6aef55e2150e8fa2cd520b
        run: |
          set -eu
          mkdir -p "${RUNNER_TEMP}/ruff-wheel"
          python -m pip download --disable-pip-version-check --no-deps --only-binary=:all:             --dest "${RUNNER_TEMP}/ruff-wheel" ruff==0.16.0
          wheel="$(find "${RUNNER_TEMP}/ruff-wheel" -maxdepth 1 -name 'ruff-0.16.0-*.whl' -print -quit)"
          test -n "${wheel}"
          test "$(sha256sum "${wheel}" | awk '{print $1}')" = "${RUFF_SHA256}"

      - name: Upload exact source bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gnostoa-pr314-source-099163e35bf0e4934b3e2c0d33baf88ac3802cf8
          path: |
            ${{ runner.temp }}/gnostoa-pr314-099163e35bf0e4934b3e2c0d33baf88ac3802cf8.bundle
            ${{ runner.temp }}/gnostoa-pr314-099163e35bf0e4934b3e2c0d33baf88ac3802cf8.bundle.sha256
          if-no-files-found: error
          retention-days: 1

      - name: Upload exact locked Ruff wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gnostoa-pr314-ruff-0.16.0
          path: ${{ runner.temp }}/ruff-wheel/ruff-0.16.0-*.whl
          if-no-files-found: error
          retention-days: 1
