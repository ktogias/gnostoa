name: Inspect PR 314 Codacy annotations

on:
  push:
    branches:
      - ops/analyzer-readback-source-export-314
    paths:
      - .github/workflows/inspect-pr314-codacy-annotations.yml

permissions:
  contents: read
  checks: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read Codacy check annotations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/check-runs/107267422406/annotations?per_page=100" \
            --jq '.[] | {path,start_line,end_line,annotation_level,title,message,raw_details}'
