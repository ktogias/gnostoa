name: One-shot PR 272 stale-contract repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.number == 272 && github.head_ref == 'fix/ruff-authoritative-scope'
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/ruff-authoritative-scope
          fetch-depth: 0
      - name: Apply the bounded stale-test repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_tools.py")
          text = path.read_text(encoding="utf-8")
          lines = text.splitlines(keepends=True)

          stale = 'if step.get("name") == "Run per-change Ruff gates"'
          current = 'if step.get("name") == "Run project style gate"'
          stale_indexes = [i for i, line in enumerate(lines) if stale in line]

          if not stale_indexes:
              if sum(current in line for line in lines) == 1 and './ci/style --check' in text:
                  print("stale CI contract is already repaired")
                  raise SystemExit(0)
              raise SystemExit("stale CI contract selector not found and repaired form is not unique")
          if len(stale_indexes) != 1:
              raise SystemExit(f"expected exactly one stale CI contract selector, found {len(stale_indexes)}")

          selector_index = stale_indexes[0]
          lines[selector_index] = lines[selector_index].replace(stale, current)

          anchor = 'self.assertEqual("matrix.python-version == \'3.12\'", ruff_step["if"])'
          anchor_indexes = [
              i for i, line in enumerate(lines[selector_index:], start=selector_index) if anchor in line
          ]
          if len(anchor_indexes) != 1:
              raise SystemExit(f"expected exactly one Ruff if-condition anchor, found {len(anchor_indexes)}")

          start = anchor_indexes[0] + 1
          if lines[start] != "        self.assertEqual(\n":
              raise SystemExit(f"unexpected Ruff run assertion start: {lines[start]!r}")

          run_line = None
          for i in range(start + 1, min(start + 20, len(lines))):
              if 'ruff_step["run"],' in lines[i]:
                  run_line = i
                  break
          if run_line is None or run_line + 1 >= len(lines) or lines[run_line + 1] != "        )\n":
              raise SystemExit("could not bound the stale Ruff run assertion")

          lines[start : run_line + 2] = [
              '        self.assertEqual("./ci/style --check", ruff_step["run"])\n'
          ]
          path.write_text("".join(lines), encoding="utf-8")
          PY
          if git diff --quiet -- tests/test_tools.py; then
            echo "No repair commit needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_tools.py
          git diff --cached --check
          git commit -m "Align CI contract test with shared style gate"
          git push origin HEAD:fix/ruff-authoritative-scope
