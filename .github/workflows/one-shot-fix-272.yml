name: One-shot PR 272 stale-contract repair

on:
  push:
    branches:
      - fix/ruff-authoritative-scope

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/ruff-authoritative-scope
          fetch-depth: 0
      - name: Apply the bounded stale-test repair and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_tools.py")
          text = path.read_text(encoding="utf-8")
          old = '''        ruff_steps = [
              step
              for step in compatibility["steps"]
              if step.get("name") == "Run per-change Ruff gates"
          ]
          self.assertEqual(1, len(ruff_steps), ruff_steps)
          ruff_step = ruff_steps[0]
          ruff_step_index = compatibility["steps"].index(ruff_step)
          self.assertGreater(ruff_step_index, 0)
          self.assertEqual(
              "Install the exact development dependencies",
              compatibility["steps"][ruff_step_index - 1]["name"],
          )
          self.assertEqual("matrix.python-version == '3.12'", ruff_step["if"])
          self.assertEqual(
              (
                  "python -m ruff format --check tools ci tests\\n"
                  "python -m ruff check tools ci tests\\n"
              ),
              ruff_step["run"],
          )
          '''
          new = '''        ruff_steps = [
              step
              for step in compatibility["steps"]
              if step.get("name") == "Run project style gate"
          ]
          self.assertEqual(1, len(ruff_steps), ruff_steps)
          ruff_step = ruff_steps[0]
          ruff_step_index = compatibility["steps"].index(ruff_step)
          self.assertGreater(ruff_step_index, 0)
          self.assertEqual(
              "Install the exact development dependencies",
              compatibility["steps"][ruff_step_index - 1]["name"],
          )
          self.assertEqual("matrix.python-version == '3.12'", ruff_step["if"])
          self.assertEqual("./ci/style --check", ruff_step["run"])
          '''
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one stale CI contract block, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          rm .github/workflows/one-shot-fix-272.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_tools.py .github/workflows/one-shot-fix-272.yml
          git diff --cached --check
          git commit -m "Align CI contract test with shared style gate"
          git push origin HEAD:fix/ruff-authoritative-scope
