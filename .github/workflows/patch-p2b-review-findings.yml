name: Patch P2b review findings

on:
  push:
    branches:
      - r2a-p2b-materialization
    paths:
      - ".github/workflows/patch-p2b-review-findings.yml"

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor == 'ktogias' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact review-fix head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Apply bounded exact review fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one anchor, found {count}")
              return text.replace(old, new, 1)

          publisher_path = Path(".github/workflows/publish-r2a-p2b-oci.yml")
          publisher = publisher_path.read_text(encoding="utf-8")

          auth_anchor = '''          digest_ref="${IMAGE_NAME}@${registry_digest}"\n          timeout --kill-after=5s 120s docker pull --quiet "${digest_ref}" >/dev/null\n          test "$(timeout --kill-after=5s 30s docker buildx imagetools inspect "${digest_ref}" --format '{{.Manifest.Digest}}')" = "${registry_digest}"\n          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "${digest_ref}")" = "linux/amd64"\n          test "$(docker image inspect --format '{{.Config.User}}' "${digest_ref}")" = "kit"\n          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "${digest_ref}")" = "${SOURCE_COMMIT}"\n'''
          auth_replacement = '''          digest_ref="${IMAGE_NAME}@${registry_digest}"\n          timeout --kill-after=5s 120s docker pull --quiet "${digest_ref}" >/dev/null\n          test "$(timeout --kill-after=5s 30s docker buildx imagetools inspect "${digest_ref}" --format '{{.Manifest.Digest}}')" = "${registry_digest}"\n          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "${digest_ref}")" = "linux/amd64"\n          test "$(docker image inspect --format '{{.Config.User}}' "${digest_ref}")" = "kit"\n          test "$(docker run --rm --entrypoint id "${digest_ref}" -u)" = "10001"\n          test "$(docker run --rm --entrypoint id "${digest_ref}" -g)" = "10001"\n          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "${digest_ref}")" = "${SOURCE_COMMIT}"\n'''
          publisher = replace_once(
              publisher, auth_anchor, auth_replacement, "authenticated UID/GID readback"
          )

          reconcile_anchor = '''          reconcile_config="$(mktemp -d)"\n          trap 'docker image rm "${digest_ref}" >/dev/null 2>&1 || true; rm -rf "${reconcile_config}"' EXIT\n          timeout --kill-after=5s 30s docker logout ghcr.io >/dev/null 2>&1 || true\n          docker image rm "${digest_ref}" >/dev/null 2>&1 || true\n          timeout --kill-after=5s 120s env DOCKER_CONFIG="${reconcile_config}" \\\n            docker pull --quiet "${digest_ref}" >/dev/null\n'''
          reconcile_replacement = '''          reconcile_config="$(mktemp -d)"\n          cleanup_reconciliation() {\n            local prior_status=$?\n            local cleanup_status=0\n            trap - EXIT\n            if docker image inspect "${digest_ref}" >/dev/null 2>&1; then\n              docker image rm "${digest_ref}" >/dev/null 2>&1 || cleanup_status=1\n            fi\n            rm -rf "${reconcile_config}" || cleanup_status=1\n            if [ "${prior_status}" -ne 0 ]; then\n              exit "${prior_status}"\n            fi\n            exit "${cleanup_status}"\n          }\n          trap cleanup_reconciliation EXIT\n          timeout --kill-after=5s 30s docker logout ghcr.io >/dev/null 2>&1 || true\n          if docker image inspect "${digest_ref}" >/dev/null 2>&1; then\n            docker image rm "${digest_ref}" >/dev/null\n          fi\n          if docker image inspect "${digest_ref}" >/dev/null 2>&1; then\n            echo "digest image remained cached before reconciliation reacquisition" >&2\n            exit 1\n          fi\n          timeout --kill-after=5s 120s env DOCKER_CONFIG="${reconcile_config}" \\\n            docker pull --quiet "${digest_ref}" >/dev/null\n'''
          publisher = replace_once(
              publisher,
              reconcile_anchor,
              reconcile_replacement,
              "uncached reconciliation reacquisition",
          )
          publisher_path.write_text(publisher, encoding="utf-8")

          guardrails_path = Path("policy/guardrails.yaml")
          guardrails = guardrails_path.read_text(encoding="utf-8")
          semantic_impl_anchor = '''      - .github/workflows/r2a-protected-current-advisory.yml\n    tests:\n'''
          semantic_impl_replacement = '''      - .github/workflows/r2a-protected-current-advisory.yml\n      - .github/workflows/publish-r2a-p2b-oci.yml\n    tests:\n'''
          guardrails = replace_once(
              guardrails,
              semantic_impl_anchor,
              semantic_impl_replacement,
              "semantic materializer implementation",
          )
          semantic_test_anchor = '''      - tests/test_review_assurance_p2b_b2_activation_red.py\n      - ci/review_b15_runtime_smoke.py\n'''
          semantic_test_replacement = '''      - tests/test_review_assurance_p2b_b2_activation_red.py\n      - tests/test_r2a_p2b_integrated_materialization.py\n      - ci/review_b15_runtime_smoke.py\n'''
          guardrails = replace_once(
              guardrails,
              semantic_test_anchor,
              semantic_test_replacement,
              "semantic materializer contract",
          )
          guardrails_path.write_text(guardrails, encoding="utf-8")

          test_path = Path("tests/test_r2a_p2b_integrated_materialization.py")
          test_text = test_path.read_text(encoding="utf-8")
          test_anchor = '''        semantic_section = _guardrail_section(guardrails, "semantic-review-assurance")\n        self.assertIn(DECISION_RELATIVE_PATH, semantic_section)\n\n        r2a_workflow = R2A_WORKFLOW_PATH.read_text(encoding="utf-8")\n'''
          test_replacement = '''        semantic_section = _guardrail_section(guardrails, "semantic-review-assurance")\n        self.assertIn(DECISION_RELATIVE_PATH, semantic_section)\n        self.assertIn(WORKFLOW_RELATIVE_PATH, semantic_section)\n        self.assertIn(\n            "tests/test_r2a_p2b_integrated_materialization.py", semantic_section\n        )\n\n        r2a_workflow = R2A_WORKFLOW_PATH.read_text(encoding="utf-8")\n'''
          test_text = replace_once(
              test_text,
              test_anchor,
              test_replacement,
              "semantic inventory contract",
          )
          test_path.write_text(test_text, encoding="utf-8")
          PY
          git diff --check

      - name: Commit bounded review fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "gnostoa-review-fix"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/publish-r2a-p2b-oci.yml policy/guardrails.yaml tests/test_r2a_p2b_integrated_materialization.py
          git diff --cached --quiet && exit 0
          git commit -m "fix: close P2b materialization review findings"
          git push origin HEAD:r2a-p2b-materialization
