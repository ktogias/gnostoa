name: Patch P2b review findings

on:
  push:
    branches:
      - r2a-p2b-materialization
    paths:
      - ".github/workflows/patch-p2b-review-findings.yml"

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor == 'ktogias' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact review-fix head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Apply bounded non-workflow review fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one anchor, found {count}")
              return text.replace(old, new, 1)

          guardrails_path = Path("policy/guardrails.yaml")
          guardrails = guardrails_path.read_text(encoding="utf-8")
          semantic_impl_anchor = '''      - .github/workflows/r2a-protected-current-advisory.yml\n    tests:\n'''
          semantic_impl_replacement = '''      - .github/workflows/r2a-protected-current-advisory.yml\n      - .github/workflows/publish-r2a-p2b-oci.yml\n    tests:\n'''
          guardrails = replace_once(
              guardrails,
              semantic_impl_anchor,
              semantic_impl_replacement,
              "semantic materializer implementation",
          )
          semantic_test_anchor = '''      - tests/test_review_assurance_p2b_b2_activation_red.py\n      - ci/review_b15_runtime_smoke.py\n'''
          semantic_test_replacement = '''      - tests/test_review_assurance_p2b_b2_activation_red.py\n      - tests/test_r2a_p2b_integrated_materialization.py\n      - ci/review_b15_runtime_smoke.py\n'''
          guardrails = replace_once(
              guardrails,
              semantic_test_anchor,
              semantic_test_replacement,
              "semantic materializer contract",
          )
          guardrails_path.write_text(guardrails, encoding="utf-8")

          test_path = Path("tests/test_r2a_p2b_integrated_materialization.py")
          test_text = test_path.read_text(encoding="utf-8")
          test_anchor = '''        semantic_section = _guardrail_section(guardrails, "semantic-review-assurance")\n        self.assertIn(DECISION_RELATIVE_PATH, semantic_section)\n\n        r2a_workflow = R2A_WORKFLOW_PATH.read_text(encoding="utf-8")\n'''
          test_replacement = '''        semantic_section = _guardrail_section(guardrails, "semantic-review-assurance")\n        self.assertIn(DECISION_RELATIVE_PATH, semantic_section)\n        self.assertIn(WORKFLOW_RELATIVE_PATH, semantic_section)\n        self.assertIn(\n            "tests/test_r2a_p2b_integrated_materialization.py", semantic_section\n        )\n\n        r2a_workflow = R2A_WORKFLOW_PATH.read_text(encoding="utf-8")\n'''
          test_text = replace_once(
              test_text,
              test_anchor,
              test_replacement,
              "semantic inventory contract",
          )
          test_path.write_text(test_text, encoding="utf-8")
          PY
          git diff --check

      - name: Commit bounded review fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "gnostoa-review-fix"
          git config user.email "actions@users.noreply.github.com"
          git add policy/guardrails.yaml tests/test_r2a_p2b_integrated_materialization.py
          git diff --cached --quiet && exit 0
          git commit -m "fix: complete P2b materialization guardrail inventory"
          git push origin HEAD:r2a-p2b-materialization
