name: PR 154 exact extended verification

on:
  push:
    branches:
      - ops/pr154-exact-extended

permissions:
  contents: read

jobs:
  extended:
    name: exact-head-extended
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # actions/checkout v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: eab78d527641451f24ac0910623f715e86567b88
          persist-credentials: false
          fetch-depth: 1

      - name: Bind exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "eab78d527641451f24ac0910623f715e86567b88"
          test "$(git rev-parse 'HEAD^{tree}')" = "920e010bb76971206fcc00172905161f9d1ae76c"
          printf 'candidate.commit=%s\n' "$(git rev-parse HEAD)"
          printf 'candidate.tree=%s\n' "$(git rev-parse 'HEAD^{tree}')"

      - name: Build candidate development runtime
        run: |
          docker build \
            --target development \
            --build-arg VCS_REF="eab78d527641451f24ac0910623f715e86567b88" \
            --tag gnostoa-pr154-extended:eab78d5 .

      - name: Prepare evidence output
        run: mkdir -p "${RUNNER_TEMP}/gnostoa-quality-evidence"

      - name: Run exact-head extended verification
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --entrypoint sh \
            --env HOME=/tmp \
            --env GNOSTOA_QUALITY_OUTPUT=/evidence \
            --mount type=bind,source="${GITHUB_WORKSPACE}",target=/workspace,readonly \
            --mount type=bind,source="${RUNNER_TEMP}/gnostoa-quality-evidence",target=/evidence \
            --workdir /workspace \
            gnostoa-pr154-extended:eab78d5 \
            -ec './ci/verify extended'

      - name: Upload bounded evidence
        if: ${{ always() }}
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr154-exact-extended-eab78d5
          path: ${{ runner.temp }}/gnostoa-quality-evidence
          if-no-files-found: error
          retention-days: 14
