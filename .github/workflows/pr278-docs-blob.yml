name: PR278 exact documentation blob
on:
  push:
    branches: [support/pr278-chatgpt-source-20260918]
    paths: [.github/workflows/pr278-docs-blob.yml]
permissions:
  contents: write
jobs:
  blob:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Upload the preverified single documentation object only
        env:
          GH_OBJECT_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 -I - <<'PY'
          import base64, hashlib, json, os, urllib.request
          def api(path, data=None):
              req = urllib.request.Request(
                  'https://api.github.com/repos/ktogias/gnostoa/' + path,
                  data=None if data is None else json.dumps(data).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_OBJECT_TOKEN'],
                           'Accept': 'application/vnd.github+json',
                           'Content-Type': 'application/json',
                           'X-GitHub-Api-Version': '2022-11-28'},
                  method='GET' if data is None else 'POST')
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          def blob_id(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          parent = '8be02a65195039758d8cbb90a681fea796433fc0'
          old_blob = '83abd3c53414bc68e96039a1a4703cc51207cc05'
          expected = 'b3546315fae3b01e29350d400df87a8747096cb5'
          assert api('git/ref/heads/security/275-protected-payload-ci')['object']['sha'] == parent
          obj = api('git/blobs/' + old_blob)
          assert obj['encoding'] == 'base64' and obj['size'] < 100000
          source = base64.b64decode(obj['content'])
          assert blob_id(source) == old_blob
          text = source.decode('utf-8')
          for name in ('test_protected_finalizer_errors.py', 'test_security_review_followup.py', 'test_review_current_payload_transport.py', 'test_tools.py'):
              old = '../../tests/' + name
              assert text.count(old) == 1
              text = text.replace(old, 'https://github.com/ktogias/gnostoa/blob/' + parent + '/tests/' + name)
          encoded = text.encode('utf-8')
          assert len(encoded) == 33886 and blob_id(encoded) == expected
          result = api('git/blobs', {'content': text, 'encoding': 'utf-8'})
          assert result['sha'] == expected
          print(json.dumps({'parent': parent, 'old_blob': old_blob, 'new_blob': result['sha'], 'bytes': len(encoded), 'effect': 'one immutable blob only; no commit/ref mutation; no candidate code execution'}))
          PY
