name: PR278 one-shot evidence archive
on:
  push:
    branches:
      - evidence/pr278-deep-review-ad1efac7-20260918
permissions:
  contents: write
  actions: read
jobs:
  archive:
    if: github.repository == 'ktogias/gnostoa' && github.ref == 'refs/heads/evidence/pr278-deep-review-ad1efac7-20260918'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Archive fixed review evidence without executing candidate code
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, runpy, urllib.request
          sha = '248cd4cf572002d3680ee9baddd8a4b6a2fbbf57'
          url = 'https://api.github.com/repos/ktogias/gnostoa/git/blobs/' + sha
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'User-Agent': 'pr278-evidence-bootstrap', 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=60) as response:
              obj = json.loads(response.read(1048576))
          data = base64.b64decode(obj['content'])
          actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          if actual != sha:
              raise SystemExit('archiver Git blob identity mismatch')
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'archive_pr278.py'
          path.write_bytes(data)
          runpy.run_path(str(path), run_name='__main__')
          PY
