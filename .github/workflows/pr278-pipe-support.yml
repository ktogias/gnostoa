name: PR278 bounded source-object transfer
on:
  push:
    branches: [support/pr278-chatgpt-source-20260918]
permissions:
  contents: write
jobs:
  transfer:
    name: pr278-objects-only-no-candidate-execution-or-ref-effects
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: c179adf7d33803b37a2ce5ac02c204f87c61d678
          persist-credentials: false
      - name: Reconstruct and store only exact verified Git objects
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -I - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, subprocess, urllib.request
          BASE='c179adf7d33803b37a2ce5ac02c204f87c61d678'
          BASE_TREE='13d4b503cee73144bcf59a0f3545c5ae2d9a4e88'
          TREE='fed022acb6ad85e3c478c6e5011d71bc4abaa5b5'
          BLOB='4ef8fec3c46e9e14e3e8775fbb4f7cf57bfa94e3'
          PATCH_HASH='d06af3d40035e879e5b95a7c92fe3e4799acb5ee05d12af82daf91ce186b6462'
          GZIP_HASH='8d7ac9c86bae2bc0966a167710d8e69228d7bff370569832a6290c6c5f23b5cc'
          files={
            'knowledge/decisions/0082-eliminate-host-persistence-for-protected-review-payloads-and-route-security-gates.md':'ba5bfc519dfaf217328c73fbbe86acb0a95b8bbb',
            'policy/guardrails.yaml':'d847cfe04db1f02cd9e717eec1bc2b7923500ead',
            'tests/test_protected_pipe_setup_cleanup.py':'f3c2c843ee28250cbda036abc1fa1c719cf588ca',
            'tools/review_current.py':'45ea5e6f5e5e1d883fee6a79b0eac64de6245279',
            'tools/security_scan.py':'c00accc94d83b94edef086c951cd10e50b6b0141',
          }
          def git(*args,data=None):
              return subprocess.check_output(['git','-c','core.hooksPath=/dev/null',*args],input=data).decode().strip()
          def api(method,path,payload=None):
              req=urllib.request.Request('https://api.github.com/repos/ktogias/gnostoa/'+path,method=method,
                data=None if payload is None else json.dumps(payload).encode(),headers={
                  'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],
                  'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=30) as stream:
                  raw=stream.read(2000001)
              if len(raw)>2000000: raise RuntimeError('bounded API response overflow')
              return json.loads(raw)
          assert git('rev-parse','HEAD')==BASE and git('rev-parse','HEAD^{tree}')==BASE_TREE
          assert not git('status','--porcelain')
          blob=api('GET','git/blobs/'+BLOB)
          assert blob['sha']==BLOB and blob['encoding']=='base64'
          compressed=base64.b64decode(''.join(blob['content'].split()),validate=True)
          assert hashlib.sha256(compressed).hexdigest()==GZIP_HASH
          patch=gzip.decompress(compressed)
          assert len(patch)==10137 and hashlib.sha256(patch).hexdigest()==PATCH_HASH
          git('apply','--index','--whitespace=error-all','-',data=patch)
          assert git('diff','--cached','--name-only').splitlines()==sorted(files)
          assert git('write-tree')==TREE
          entries=[]
          for path,sha in files.items():
              assert git('ls-files','--stage','--',path).startswith('100644 '+sha+' 0\t')
              raw=pathlib.Path(path).read_bytes()
              assert len(raw)<250000
              assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==sha
              response=api('POST','git/blobs',{'encoding':'utf-8','content':raw.decode('utf-8')})
              assert response['sha']==sha
              entries.append({'path':path,'mode':'100644','type':'blob','sha':sha})
          response=api('POST','git/trees',{'base_tree':BASE_TREE,'tree':entries})
          assert response['sha']==TREE
          receipt={'baseline':BASE,'tree':TREE,'patch_sha256':PATCH_HASH,'blobs':files,'candidate_code_execution':'NOT_RUN','ref_effects':'NONE'}
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'pr278-object-receipt'
          out.mkdir()
          (out/'receipt.json').write_text(json.dumps(receipt,indent=2))
          print(json.dumps(receipt,sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr278-pipe-repair-object-receipt
          path: ${{ runner.temp }}/pr278-object-receipt
          if-no-files-found: error
          retention-days: 14
