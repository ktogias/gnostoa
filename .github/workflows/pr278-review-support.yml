name: PR278 read-only review support
on:
  push:
    branches: [support/pr278-chatgpt-source-20260918]
permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: read
  actions: read
jobs:
  export:
    name: pr278-read-only-snapshot-not-a-merge-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: c179adf7d33803b37a2ce5ac02c204f87c61d678
          fetch-depth: 0
          persist-credentials: false
      - name: Export exact source without executing candidate code
        run: |
          set -eu
          out="${RUNNER_TEMP}/pr278-review-snapshot"
          mkdir -p "${out}"
          test "$(git rev-parse HEAD)" = c179adf7d33803b37a2ce5ac02c204f87c61d678
          test "$(git rev-parse 'HEAD^{tree}')" = 13d4b503cee73144bcf59a0f3545c5ae2d9a4e88
          git bundle create "${out}/source.bundle" HEAD refs/remotes/origin/main
          git bundle verify "${out}/source.bundle"
      - name: Read complete paginated review metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -I - <<'PY'
          import datetime, hashlib, json, os, pathlib, urllib.request
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pr278-review-snapshot'
          headers = {'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          def read(url, data=None):
              request = urllib.request.Request(url, headers=headers, data=None if data is None else json.dumps(data).encode())
              with urllib.request.urlopen(request, timeout=30) as stream:
                  raw = stream.read(16000001)
              if len(raw) > 16000000:
                  raise RuntimeError('bounded snapshot response overflow')
              return json.loads(raw)
          api = 'https://api.github.com/repos/ktogias/gnostoa/'
          def pages(path):
              result = []
              for page in range(1, 31):
                  items = read(api + path + ('&' if '?' in path else '?') + 'per_page=100&page=' + str(page))
                  result.extend(items)
                  if len(items) < 100:
                      return result
              raise RuntimeError('snapshot pagination bound exceeded')
          snapshot = {'observed_at': datetime.datetime.now(datetime.timezone.utc).isoformat()}
          snapshot['pr'] = read(api + 'pulls/278')
          snapshot['main'] = read(api + 'git/ref/heads/main')
          for key, path in [('comments','issues/278/comments'), ('reviews','pulls/278/reviews'), ('inline','pulls/278/comments')]:
              snapshot[key] = pages(path)
          snapshot['checks'] = read(api + 'commits/c179adf7d33803b37a2ce5ac02c204f87c61d678/check-runs?per_page=100')
          snapshot['statuses'] = read(api + 'commits/c179adf7d33803b37a2ce5ac02c204f87c61d678/status?per_page=100')
          threads, cursor = [], None
          query = '''query($after:String){repository(owner:"ktogias",name:"gnostoa"){pullRequest(number:278){reviewThreads(first:100,after:$after){nodes{id isResolved isOutdated path line comments(first:100){nodes{databaseId author{login} body url createdAt commit{oid}} pageInfo{hasNextPage}}} pageInfo{hasNextPage endCursor}}}}}'''
          for page in range(30):
              result = read('https://api.github.com/graphql', {'query':query,'variables':{'after':cursor}})
              if result.get('errors'):
                  raise RuntimeError('review thread snapshot unavailable')
              connection = result['data']['repository']['pullRequest']['reviewThreads']
              for thread in connection['nodes']:
                  if thread['comments']['pageInfo']['hasNextPage']:
                      raise RuntimeError('thread requires further comment pagination')
              threads.extend(connection['nodes'])
              if not connection['pageInfo']['hasNextPage']:
                  break
              cursor = connection['pageInfo']['endCursor']
          else:
              raise RuntimeError('thread pagination bound exceeded')
          snapshot['threads'] = threads
          (root/'reviews.json').write_text(json.dumps(snapshot, ensure_ascii=False, indent=2))
          files = sorted(root.iterdir())
          (root/'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in files))
          print('Snapshot complete:', len(snapshot['comments']), 'comments;', len(snapshot['reviews']), 'reviews;', len(threads), 'threads')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr278-current-review-snapshot
          path: ${{ runner.temp }}/pr278-review-snapshot
          retention-days: 1
          if-no-files-found: error
