name: PR278 isolated candidate preparation
on:
  push:
    branches: [support/pr278-chatgpt-source-20260918]
permissions:
  contents: read
jobs:
  reconstruct-and-verify:
    name: pr278-source-reconstruction-not-a-merge-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: support
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: a744776795a4e083b4df45c49016c25a2aa2071a
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Reconstruct the exact locally verified source tree
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -I support/.github/pr278-upload-support.py candidate prepare
      - name: Verify reconstructed source without write credentials
        working-directory: candidate
        run: |
          set -eu
          python -m pip install --only-binary=:all: --require-hashes -r requirements/development.lock
          ./ci/style --fix
          git diff --exit-code
          test "$(git write-tree)" = 5fdde305526b6acf7e305165d2242ede1609b5e3
          ./ci/verify policy
          ./ci/verify security-fast
          ./ci/verify fast
          python -m mypy
  upload-exact-objects:
    name: pr278-object-upload-no-ref-or-publication-effects
    needs: reconstruct-and-verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: support
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: a744776795a4e083b4df45c49016c25a2aa2071a
          path: candidate
          persist-credentials: false
      - name: Upload verified blobs and tree only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -I support/.github/pr278-upload-support.py candidate upload
