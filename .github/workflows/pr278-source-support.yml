name: PR278 isolated source support

on:
  push:
    branches: [support/pr278-chatgpt-source-20260918]

permissions:
  contents: read

jobs:
  source-support:
    name: pr278-source-support-not-a-merge-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: a744776795a4e083b4df45c49016c25a2aa2071a
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Export exact public source and hash-locked offline dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = a744776795a4e083b4df45c49016c25a2aa2071a
          test "$(git rev-parse 'HEAD^{tree}')" = e52fa6f76c0da7296deac7cab31cdd030c850fcc
          output="${RUNNER_TEMP}/pr278-source-support"
          mkdir -p "${output}/wheels"
          git bundle create "${output}/source.bundle" HEAD refs/remotes/origin/main
          git bundle verify "${output}/source.bundle"
          git rev-parse HEAD 'HEAD^{tree}' refs/remotes/origin/main > "${output}/source-identities.txt"
          python -m pip download --only-binary=:all: --require-hashes -r requirements/development.lock --dest "${output}/wheels"
          (cd "${output}" && sha256sum source.bundle wheels/* > SHA256SUMS)
      - name: Retain temporary development input, not candidate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr278-exact-source-support
          path: ${{ runner.temp }}/pr278-source-support
          if-no-files-found: error
          retention-days: 1
