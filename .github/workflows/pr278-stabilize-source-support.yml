name: PR278 stabilization source support

on:
  push:
    branches: [support/pr278-chatgpt-source-20260918]
    paths: [.github/workflows/pr278-stabilize-source-support.yml]

permissions:
  contents: read

jobs:
  source-support:
    name: pr278-source-input-only-not-a-merge-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 19f4dab66f35c9e2c3b8c0699ce1af328a228afe
          fetch-depth: 0
          persist-credentials: false
      - name: Export exact public source only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 19f4dab66f35c9e2c3b8c0699ce1af328a228afe
          test "$(git rev-parse 'HEAD^{tree}')" = f25ba02e6958ac7aed65b7439c68cd933cc36b2f
          output="${RUNNER_TEMP}/pr278-stabilization-source"
          mkdir -p "${output}"
          git bundle create "${output}/source.bundle" HEAD refs/remotes/origin/main
          git bundle verify "${output}/source.bundle"
          git rev-parse HEAD 'HEAD^{tree}' refs/remotes/origin/main > "${output}/source-identities.txt"
          (cd "${output}" && sha256sum source.bundle > SHA256SUMS)
      - name: Retain development inputs, not review or runtime evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr278-stabilization-source-19f4dab
          path: ${{ runner.temp }}/pr278-stabilization-source
          if-no-files-found: error
          retention-days: 1
