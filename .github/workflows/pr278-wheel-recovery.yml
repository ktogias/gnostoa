name: PR278 pinned wheel recovery
on:
  push:
    branches: [support/pr278-chatgpt-source-20260918]
    paths: [.github/workflows/pr278-wheel-recovery.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: e29b12950612e3696d3d087708cdd9a615d92b04
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Download only the locked verified wheels
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = e29b12950612e3696d3d087708cdd9a615d92b04
          mkdir -p "$RUNNER_TEMP/pr278-wheels/wheels"
          python -m pip download --only-binary=:all: --require-hashes --dest "$RUNNER_TEMP/pr278-wheels/wheels" -r requirements/development.lock
          cp requirements/development.lock "$RUNNER_TEMP/pr278-wheels/"
          cd "$RUNNER_TEMP/pr278-wheels"
          sha256sum development.lock wheels/* > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr278-pinned-wheels
          path: ${{ runner.temp }}/pr278-wheels/
          retention-days: 3
          if-no-files-found: error
