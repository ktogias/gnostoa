name: PR314 candidate preparation

on:
  push:
    branches:
      - transport/pr314-exact-source-09afa312

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_SHA: 09afa312a980cfa4334f9322be46d0ecec0349fa
      TARGET_TREE: f8cfdc41ecb8b0db2e092b1d957e48cc06ee0040
      CANDIDATE_PATCH_SHA256: fa55214f22bb38791c4331cd002485f57729b27cc5cbc4d0dc32086e8c89a755
      CANDIDATE_PATCH_B64: 
    steps:
      - name: Checkout exact parent
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact parent and apply immutable candidate patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          test "$(git rev-parse 'HEAD^{tree}')" = "${TARGET_TREE}"
          test -z "$(git status --porcelain)"

          patch="${RUNNER_TEMP}/candidate.patch"
          printf '%s' "${CANDIDATE_PATCH_B64}" | base64 -d > "${patch}"
          actual="$(sha256sum "${patch}" | awk '{print $1}')"
          test "${actual}" = "${CANDIDATE_PATCH_SHA256}"

          git apply --check "${patch}"
          git apply "${patch}"
          git diff --check

          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            knowledge/decisions/0091-add-authenticated-provider-neutral-analyzer-readback.md
            tests/test_analyzer_readback.py
            tools/analyzer_deepsource.py
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do
            test "${changed[$i]}" = "${expected[$i]}"
          done

          git diff --binary > "${RUNNER_TEMP}/candidate-observed.patch"
          observed="$(sha256sum "${RUNNER_TEMP}/candidate-observed.patch" | awk '{print $1}')"
          test "${observed}" = "${CANDIDATE_PATCH_SHA256}"

      - name: Set up trusted Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/development.lock

      - name: Install exact development dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install             --only-binary=:all:             --require-hashes             -r requirements/development.lock

      - name: Run exact-parent Decision 0090 preparation
        shell: bash
        run: |
          set -euo pipefail
          wrapper="${RUNNER_TEMP}/parent-prepare"
          git show "${TARGET_SHA}:ci/prepare-candidate" > "${wrapper}"
          test -s "${wrapper}"

          receipt="${RUNNER_TEMP}/pr314-receipt.json"
          sh "${wrapper}" prepare             --parent "${TARGET_SHA}"             --receipt "${receipt}"             --focused-profile fast             --trusted-python "$(command -v python)"             > "${RUNNER_TEMP}/prepare-result.json"

          python - "${receipt}" "${RUNNER_TEMP}" <<'PY'
          import json
          import sys
          from pathlib import Path

          receipt_path = Path(sys.argv[1])
          out = Path(sys.argv[2])
          doc = json.loads(receipt_path.read_text(encoding="utf-8"))
          expected_paths = [
              "knowledge/decisions/0091-add-authenticated-provider-neutral-analyzer-readback.md",
              "tests/test_analyzer_readback.py",
              "tools/analyzer_deepsource.py",
          ]
          assert doc["parent_commit"] == "09afa312a980cfa4334f9322be46d0ecec0349fa", doc
          assert doc["parent_tree"] == "f8cfdc41ecb8b0db2e092b1d957e48cc06ee0040", doc
          assert doc["changed_paths"] == expected_paths, doc
          assert doc["focused_profile"] == "fast", doc
          assert all(value == 0 for value in doc["checks"].values()), doc
          (out / "receipt-sha256.txt").write_text(doc["receipt_sha256"] + "\n", encoding="utf-8")
          (out / "prepared-tree.txt").write_text(doc["prepared_tree"] + "\n", encoding="utf-8")
          (out / "retention-ref.txt").write_text(doc["retention_ref"] + "\n", encoding="utf-8")
          (out / "prepared-diff-sha256.txt").write_text(doc["prepared_diff_sha256"] + "\n", encoding="utf-8")
          PY

          prepared_tree="$(cat "${RUNNER_TEMP}/prepared-tree.txt")"
          retention_ref="$(cat "${RUNNER_TEMP}/retention-ref.txt")"
          git diff --binary "${TARGET_SHA}" "${prepared_tree}" > "${RUNNER_TEMP}/prepared.patch"
          actual_prepared="sha256:$(sha256sum "${RUNNER_TEMP}/prepared.patch" | awk '{print $1}')"
          test "${actual_prepared}" = "$(cat "${RUNNER_TEMP}/prepared-diff-sha256.txt")"

          git bundle create "${RUNNER_TEMP}/prepared.bundle" "${retention_ref}"
          git bundle verify "${RUNNER_TEMP}/prepared.bundle"
          sha256sum "${RUNNER_TEMP}/prepared.bundle" > "${RUNNER_TEMP}/prepared.bundle.sha256"

      - name: Upload non-secret preparation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr314-decision0090-preparation
          path: |
            ${{ runner.temp }}/candidate-observed.patch
            ${{ runner.temp }}/pr314-receipt.json
            ${{ runner.temp }}/receipt-sha256.txt
            ${{ runner.temp }}/prepared-tree.txt
            ${{ runner.temp }}/retention-ref.txt
            ${{ runner.temp }}/prepared-diff-sha256.txt
            ${{ runner.temp }}/prepared.patch
            ${{ runner.temp }}/prepared.bundle
            ${{ runner.temp }}/prepared.bundle.sha256
            ${{ runner.temp }}/prepare-result.json
          retention-days: 1
          if-no-files-found: error
