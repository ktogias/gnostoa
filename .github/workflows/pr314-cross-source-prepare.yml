name: Prepare PR 314 cross-source run association fix

on:
  push:
    branches:
      - ops/pr314-cross-source-09afa

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reconstruct exact candidate
        shell: bash
        env:
          PARENT: 09afa312a980cfa4334f9322be46d0ecec0349fa
          PARENT_TREE: f8cfdc41ecb8b0db2e092b1d957e48cc06ee0040
          PATCH_SHA256: 9ad89d3bbd5ded7597981498ee7299e5cb39a5c0cbcf3ab1f8e6a9fb632e0ad3
          GZIP_SHA256: 53dcf5edf28dc6fa4f6d2b032a6224d9e6bc7d190975fca176a0a2bad37b14b4
        run: |
          set -euo pipefail
          gzip_file="${RUNNER_TEMP}/candidate.patch.gz"
          patch_file="${RUNNER_TEMP}/candidate.patch"
          base64 --decode .gnostoa-ops/pr314-cross-source.patch.gz.b64 > "${gzip_file}"
          echo "${GZIP_SHA256}  ${gzip_file}" | sha256sum -c -
          gzip -dc "${gzip_file}" > "${patch_file}"
          echo "${PATCH_SHA256}  ${patch_file}" | sha256sum -c -

          git checkout --detach "${PARENT}"
          test "$(git rev-parse HEAD)" = "${PARENT}"
          test "$(git rev-parse 'HEAD^{tree}')" = "${PARENT_TREE}"
          test -z "$(git status --porcelain)"
          git apply --binary "${patch_file}"
          test "$(git diff --binary --full-index "${PARENT}" -- tests/test_analyzer_readback.py tools/analyzer_deepsource.py | sha256sum | awk '{print $1}')" = "${PATCH_SHA256}"
          git diff --check "${PARENT}"
          printf '%s\n' tests/test_analyzer_readback.py tools/analyzer_deepsource.py > "${RUNNER_TEMP}/expected-paths"
          git diff --name-only "${PARENT}" > "${RUNNER_TEMP}/actual-paths"
          diff -u "${RUNNER_TEMP}/expected-paths" "${RUNNER_TEMP}/actual-paths"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/development.lock

      - name: Install exact development tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --only-binary=:all: --require-hashes -r requirements/development.lock
          python -m ruff --version
          command -v docker
          docker --version

      - name: Run Decision 0090 preparation
        shell: bash
        env:
          PARENT: 09afa312a980cfa4334f9322be46d0ecec0349fa
        run: |
          set -euo pipefail
          receipt="${RUNNER_TEMP}/receipt.json"
          ./ci/prepare-candidate prepare             --parent "${PARENT}"             --receipt "${receipt}"             --focused-profile fast             --trusted-python "$(command -v python)"

          tree="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["prepared_tree"])' "${receipt}")"
          receipt_sha="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["receipt_sha256"])' "${receipt}")"

          ./ci/prepare-candidate verify             --parent "${PARENT}"             --tree "${tree}"             --receipt "${receipt}"             --receipt-sha256 "${receipt_sha}"             --trusted-python "$(command -v python)"

          out="${RUNNER_TEMP}/prepared"
          mkdir -p "${out}"
          git diff --binary --full-index "${PARENT}" "${tree}" > "${out}/normalized.patch"
          cp "${receipt}" "${out}/receipt.json"
          patch_sha="$(sha256sum "${out}/normalized.patch" | awk '{print $1}')"
          python - "${out}/metadata.json" "${tree}" "${receipt_sha}" "${patch_sha}" <<'PY'
          import json, sys
          from pathlib import Path
          Path(sys.argv[1]).write_text(
              json.dumps(
                  {
                      "parent": "09afa312a980cfa4334f9322be46d0ecec0349fa",
                      "prepared_tree": sys.argv[2],
                      "receipt_sha256": sys.argv[3],
                      "normalized_patch_sha256": sys.argv[4],
                  },
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr314-cross-source-prepared
          path: ${{ runner.temp }}/prepared
          if-no-files-found: error
          retention-days: 2
