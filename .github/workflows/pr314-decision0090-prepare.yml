name: PR314 Decision 0090 read-only preparation

on:
  push:
    branches:
      - transport/pr314-exact-source-09afa312

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PARENT_SHA: 09afa312a980cfa4334f9322be46d0ecec0349fa
      PARENT_TREE: f8cfdc41ecb8b0db2e092b1d957e48cc06ee0040
      INPUT_PATCH_SHA256: 4948ad43ea56e00b67e1d4da0a431d6fb87fc0da850c9d6422f9de3d269a1719
    steps:
      - name: Checkout immutable recovery control
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false

      - name: Verify immutable candidate patch
        shell: bash
        run: |
          set -euo pipefail
          patch="${GITHUB_WORKSPACE}/control/recovery/pr314-candidate.patch"
          test -f "${patch}"
          observed="$(sha256sum "${patch}" | awk '{print $1}')"
          test "${observed}" = "${INPUT_PATCH_SHA256}"

      - name: Checkout exact parent source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.PARENT_SHA }}
          fetch-depth: 0
          path: source
          persist-credentials: false

      - name: Bind exact parent and apply candidate patch
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/source"
          test "$(git rev-parse HEAD)" = "${PARENT_SHA}"
          test "$(git rev-parse 'HEAD^{tree}')" = "${PARENT_TREE}"
          test -z "$(git status --porcelain)"
          patch="${GITHUB_WORKSPACE}/control/recovery/pr314-candidate.patch"
          git apply --check "${patch}"
          git apply "${patch}"
          printf '%s\n'             knowledge/decisions/0091-add-authenticated-provider-neutral-analyzer-readback.md             tests/test_analyzer_readback.py             tools/analyzer_deepsource.py             > "${RUNNER_TEMP}/expected-paths"
          git diff --name-only | LC_ALL=C sort > "${RUNNER_TEMP}/observed-paths"
          LC_ALL=C sort -o "${RUNNER_TEMP}/expected-paths" "${RUNNER_TEMP}/expected-paths"
          diff -u "${RUNNER_TEMP}/expected-paths" "${RUNNER_TEMP}/observed-paths"
          git diff --check

      - name: Set up trusted Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: source/requirements/development.lock

      - name: Install exact development dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install             --only-binary=:all:             --require-hashes             -r "${GITHUB_WORKSPACE}/source/requirements/development.lock"

      - name: Run focused candidate verification before preparation
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/source"
          PYTHONPATH=. python -m unittest             tests.test_analyzer_readback.DeepSourceAnalyzerReadbackTests.test_commit_status_and_check_run_disagreement_is_ambiguous
          PYTHONPATH=. python -m unittest tests.test_analyzer_readback
          python -m py_compile tools/analyzer_deepsource.py tests/test_analyzer_readback.py

      - name: Execute exact-parent Decision 0090 preparation
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/source"
          trusted_python="$(command -v python)"
          wrapper="${RUNNER_TEMP}/parent-prepare-candidate"
          git show "${PARENT_SHA}:ci/prepare-candidate" > "${wrapper}"
          sh "${wrapper}" prepare             --parent "${PARENT_SHA}"             --receipt "${RUNNER_TEMP}/pr314-preparation-receipt.json"             --focused-profile fast             --trusted-python "${trusted_python}"             > "${RUNNER_TEMP}/pr314-preparation-output.json"

      - name: Verify receipt and materialize normalized prepared patch
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/source"
          receipt="${RUNNER_TEMP}/pr314-preparation-receipt.json"
          output="${RUNNER_TEMP}/pr314-preparation-output.json"
          prepared_tree="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["prepared_tree"])' "${receipt}")"
          receipt_sha="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["receipt_sha256"])' "${receipt}")"
          prepared_diff_sha="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["prepared_diff_sha256"])' "${receipt}")"
          trusted_python="$(command -v python)"
          wrapper="${RUNNER_TEMP}/parent-prepare-candidate"
          sh "${wrapper}" verify             --parent "${PARENT_SHA}"             --tree "${prepared_tree}"             --receipt "${receipt}"             --receipt-sha256 "${receipt_sha}"             --trusted-python "${trusted_python}"             > "${RUNNER_TEMP}/pr314-receipt-verify.json"
          git diff --binary --full-index "${PARENT_SHA}" "${prepared_tree}" > "${RUNNER_TEMP}/pr314-prepared.patch"
          observed_prepared_diff_sha="sha256:$(sha256sum "${RUNNER_TEMP}/pr314-prepared.patch" | awk '{print $1}')"
          test "${observed_prepared_diff_sha}" = "${prepared_diff_sha}"
          {
            printf 'parent_commit=%s\n' "${PARENT_SHA}"
            printf 'parent_tree=%s\n' "${PARENT_TREE}"
            printf 'input_patch_sha256=%s\n' "${INPUT_PATCH_SHA256}"
            printf 'prepared_tree=%s\n' "${prepared_tree}"
            printf 'receipt_sha256=%s\n' "${receipt_sha}"
            printf 'prepared_diff_sha256=%s\n' "${prepared_diff_sha}"
          } > "${RUNNER_TEMP}/pr314-preparation.identity"
          cat "${receipt}"
          cat "${RUNNER_TEMP}/pr314-preparation.identity"

      - name: Upload bounded preparation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr314-decision0090-preparation
          path: |
            ${{ runner.temp }}/pr314-preparation-receipt.json
            ${{ runner.temp }}/pr314-preparation-output.json
            ${{ runner.temp }}/pr314-receipt-verify.json
            ${{ runner.temp }}/pr314-prepared.patch
            ${{ runner.temp }}/pr314-preparation.identity
          retention-days: 1
          if-no-files-found: error
