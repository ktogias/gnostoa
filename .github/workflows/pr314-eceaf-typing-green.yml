name: PR314 typing fix GREEN and Decision 0090

on:
  push:
    branches:
      - transport/pr314-eceaf-typing-red

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PARENT_SHA: eceafbfdbdaed2aa3a076b250cf277bd06d7526b
      PARENT_TREE: 4aa72ceca940a89aa7594f08814fabd269418705
      INPUT_PATCH_SHA256: f3eaff5745b439df63149b0e1068ec0e98b193fc21a5dacb892cdaae5fc9585d
    steps:
      - name: Checkout immutable recovery control
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false

      - name: Verify immutable candidate patch
        shell: bash
        run: |
          set -euo pipefail
          patch="${GITHUB_WORKSPACE}/control/recovery/pr314-eceaf-typing-fix.patch"
          test -f "${patch}"
          test "$(sha256sum "${patch}" | awk '{print $1}')" = "${INPUT_PATCH_SHA256}"

      - name: Checkout exact parent source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.PARENT_SHA }}
          fetch-depth: 0
          path: source
          persist-credentials: false

      - name: Bind parent and apply one-line fix
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/source"
          test "$(git rev-parse HEAD)" = "${PARENT_SHA}"
          test "$(git rev-parse 'HEAD^{tree}')" = "${PARENT_TREE}"
          test -z "$(git status --porcelain)"
          patch="${GITHUB_WORKSPACE}/control/recovery/pr314-eceaf-typing-fix.patch"
          git apply --check "${patch}"
          git apply "${patch}"
          test "$(git diff --name-only)" = "tools/analyzer_deepsource.py"
          git diff --check

      - name: Set up trusted Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: source/requirements/development.lock

      - name: Install exact development dependencies
        shell: bash
        run: |
          python -m pip install             --only-binary=:all:             --require-hashes             -r "${GITHUB_WORKSPACE}/source/requirements/development.lock"

      - name: Prove GREEN before preparation
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/source"
          python -m mypy --output json tools ci > "${RUNNER_TEMP}/mypy-green.jsonl"
          PYTHONPATH=. python -m unittest tests.test_analyzer_readback

      - name: Execute exact-parent Decision 0090 preparation
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/source"
          trusted_python="$(command -v python)"
          wrapper="${RUNNER_TEMP}/parent-prepare-candidate"
          git show "${PARENT_SHA}:ci/prepare-candidate" > "${wrapper}"
          sh "${wrapper}" prepare             --parent "${PARENT_SHA}"             --receipt "${RUNNER_TEMP}/pr314-typing-receipt.json"             --focused-profile fast             --trusted-python "${trusted_python}"             > "${RUNNER_TEMP}/pr314-typing-prepare-result.json"

      - name: Verify receipt and prepared diff
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/source"
          receipt="${RUNNER_TEMP}/pr314-typing-receipt.json"
          prepared_tree="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["prepared_tree"])' "${receipt}")"
          receipt_sha="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["receipt_sha256"])' "${receipt}")"
          prepared_diff_sha="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["prepared_diff_sha256"])' "${receipt}")"
          trusted_python="$(command -v python)"
          wrapper="${RUNNER_TEMP}/parent-prepare-candidate"
          sh "${wrapper}" verify             --parent "${PARENT_SHA}"             --tree "${prepared_tree}"             --receipt "${receipt}"             --receipt-sha256 "${receipt_sha}"             --trusted-python "${trusted_python}"             > "${RUNNER_TEMP}/pr314-typing-receipt-verify.json"
          git diff --binary --full-index "${PARENT_SHA}" "${prepared_tree}" > "${RUNNER_TEMP}/pr314-typing-prepared.patch"
          observed="sha256:$(sha256sum "${RUNNER_TEMP}/pr314-typing-prepared.patch" | awk '{print $1}')"
          test "${observed}" = "${prepared_diff_sha}"
          {
            printf 'parent_commit=%s\n' "${PARENT_SHA}"
            printf 'parent_tree=%s\n' "${PARENT_TREE}"
            printf 'input_patch_sha256=%s\n' "${INPUT_PATCH_SHA256}"
            printf 'prepared_tree=%s\n' "${prepared_tree}"
            printf 'receipt_sha256=%s\n' "${receipt_sha}"
            printf 'prepared_diff_sha256=%s\n' "${prepared_diff_sha}"
          } > "${RUNNER_TEMP}/pr314-typing.identity"

      - name: Upload GREEN preparation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr314-eceaf-typing-green
          path: |
            ${{ runner.temp }}/mypy-green.jsonl
            ${{ runner.temp }}/pr314-typing-receipt.json
            ${{ runner.temp }}/pr314-typing-prepare-result.json
            ${{ runner.temp }}/pr314-typing-receipt-verify.json
            ${{ runner.temp }}/pr314-typing-prepared.patch
            ${{ runner.temp }}/pr314-typing.identity
          retention-days: 1
          if-no-files-found: error
