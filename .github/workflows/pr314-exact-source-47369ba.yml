name: PR314 exact-source transport 47369ba

on:
  push:
    branches:
      - transport/pr314-exact-source-47369ba

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_SHA: 47369ba6a95a48fb0b2ba765c6c478564b95850c
      TARGET_TREE: b1e8db204139ab22a477fb3a037773471ad7b938
    steps:
      - name: Checkout exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          test "$(git rev-parse 'HEAD^{tree}')" = "${TARGET_TREE}"
          test -z "$(git status --porcelain)"
      - name: Build and verify exact-source bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle="${RUNNER_TEMP}/pr314-47369ba.bundle"
          git update-ref refs/heads/gnostoa-exact-source-export "${TARGET_SHA}"
          git bundle create "${bundle}" refs/heads/gnostoa-exact-source-export
          git bundle verify "${bundle}"
          sha256sum "${bundle}" > "${bundle}.sha256"
          {
            printf 'commit=%s\n' "${TARGET_SHA}"
            printf 'tree=%s\n' "${TARGET_TREE}"
          } > "${RUNNER_TEMP}/pr314-47369ba.identity"
      - name: Upload exact-source transport
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr314-exact-source-47369ba
          path: |
            ${{ runner.temp }}/pr314-47369ba.bundle
            ${{ runner.temp }}/pr314-47369ba.bundle.sha256
            ${{ runner.temp }}/pr314-47369ba.identity
          retention-days: 1
          if-no-files-found: error
