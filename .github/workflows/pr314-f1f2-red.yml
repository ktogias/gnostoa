name: Read PR314 exact Codacy annotation

on:
  push:
    branches: [ops/pr314-f1f2-evidence-cf7d]

permissions:
  checks: read

jobs:
  annotations:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the fixed check and its annotation without candidate code
        shell: bash
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          root='https://api.github.com/repos/ktogias/gnostoa/check-runs/107598722506'
          token=os.environ['GH_READ_TOKEN']
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):
                  raise RuntimeError('redirect refused')
          opener=urllib.request.build_opener(NoRedirect())
          def read(url):
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with opener.open(req,timeout=30) as response:
                  raw=response.read(2_000_001)
              assert len(raw)<=2_000_000
              return json.loads(raw)
          check=read(root)
          assert check['head_sha']=='1442d11d4eb8c0785866f42922dd58f7e94d6f92'
          assert check['app']['slug']=='codacy-production'
          assert check['output']['annotations_count']==1
          annotations=read(root+'/annotations?per_page=100')
          assert isinstance(annotations,list) and len(annotations)==1
          result={'head':check['head_sha'],'check_id':check['id'],'app':check['app']['slug'],'conclusion':check['conclusion'],'annotations':annotations}
          text=json.dumps(result,ensure_ascii=True,sort_keys=True,indent=2)
          assert token not in text
          Path(os.environ['RUNNER_TEMP'],'codacy-annotation.json').write_text(text+'\n')
          print(text)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr314-codacy-annotation-1442
          path: ${{ runner.temp }}/codacy-annotation.json
          if-no-files-found: error
          retention-days: 3
