name: PR314 F1 F2 exact-parent RED

on:
  push:
    branches: [ops/pr314-f1f2-evidence-cf7d]

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: cf7d6f346890517d5f40dd2eee8cea6c1e8c7e7d
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Apply only the digest-bound regression tests
        shell: bash
        env:
          TEST_PATCH:  # pragma: allowlist secret -- public synthetic test patch
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = cf7d6f346890517d5f40dd2eee8cea6c1e8c7e7d
          test "$(git rev-parse 'HEAD^{tree}')" = 89e1dfd65b96209fc388ef869b7b27171463958a
          test -z "$(git status --porcelain)"
          printf '%s' "$TEST_PATCH" | base64 -d > "$RUNNER_TEMP/tests.patch.gz"
          echo "b472d2bf93e2f40000ff7440ce86896d8a48c6c90855bfd02836de0d20b36fc2  $RUNNER_TEMP/tests.patch.gz" | sha256sum -c -
          gzip -dc "$RUNNER_TEMP/tests.patch.gz" > "$RUNNER_TEMP/tests.patch"
          echo "70d98d4038cb23ad249cfc6ab514d587c3c2bbe54616c816680c073c3fb725d8  $RUNNER_TEMP/tests.patch" | sha256sum -c -
          git apply "$RUNNER_TEMP/tests.patch"
          test "$(git diff --name-only)" = tests/test_analyzer_readback_runner.py
          python -m pip install --only-binary=:all: --require-hashes -r requirements/development.lock
          python -m ruff check --fix tests/test_analyzer_readback_runner.py
          python -m ruff format tests/test_analyzer_readback_runner.py
      - name: Assert RED population before production edits
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/red"
          python - <<'PY' 2>&1 | tee "$RUNNER_TEMP/red/red.txt"
          import unittest
          from tests.test_analyzer_readback_runner import AnalyzerTransportCredentialTests
          suite = unittest.defaultTestLoader.loadTestsFromTestCase(AnalyzerTransportCredentialTests)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          expected = {
              'test_malformed_credentials_do_not_echo_through_real_http_headers',
              'test_credential_validation_rejects_without_trimming_or_opener',
              'test_transport_value_errors_have_bounded_non_secret_diagnostics',
              'test_main_malformed_github_credentials_do_not_enter_stderr',
              'test_malformed_optional_credential_keeps_valid_peer_readback',
          }
          actual = {test.id().split('.')[-1].split(' ')[0] for test, _ in result.failures}
          assert result.testsRun == 7 and not result.errors
          assert len(result.failures) == 39 and actual == expected, actual
          print('F1_CHARACTERIZATION_GREEN F2_RED_REPRODUCED tests=7 failing_subcases=39 production_edits=0')
          PY
          test "$(git diff --name-only)" = tests/test_analyzer_readback_runner.py
          git diff --binary --full-index HEAD > "$RUNNER_TEMP/red/tests.patch"
          cp tests/test_analyzer_readback_runner.py "$RUNNER_TEMP/red/test_analyzer_readback_runner.py"
          sha256sum "$RUNNER_TEMP/red/tests.patch" "$RUNNER_TEMP/red/test_analyzer_readback_runner.py" | tee "$RUNNER_TEMP/red/digests.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr314-f1f2-red-cf7d
          path: ${{ runner.temp }}/red
          if-no-files-found: error
          retention-days: 3
