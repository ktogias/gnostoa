name: Stage verified PR314 pagination and test cleanup

on:
  push:
    branches: [ops/pr314-f1f2-stage-cf7d]

permissions:
  contents: write
  actions: read

env:
  TRUSTED_MAIN: 074bd0499395986021b4c320ee9d23ec67859186
  PARENT: 1442d11d4eb8c0785866f42922dd58f7e94d6f92
  PREPARED_TREE: 48ce506d70cea2d5ed1c54d12bbcbe3ed70c24cb
  RECEIPT_SHA256: sha256:f7fc54514cfd29b309d9627699a9791c82fe58f2812e1c9296486ae2d3fc4db8
  PATCH_SHA256: 1f762b7d6a9742b8b5f50527a4c80f08091d3e7c25b491e7d6dbc3b028415fb0
  TARGET_BRANCH: ops/pr314-f1f2-prepared-tree-cf7d
  EXPECTED_STAGING: cf3fba384083e6632bf2812570714ac4a5e6294e

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 074bd0499395986021b4c320ee9d23ec67859186
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: pr314-pagination-cleanup-prepared-1442
          run-id: '35990600810'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/prepared
      - name: Verify receipt and reconstruct tree without executing candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TRUSTED_MAIN"
          test -z "$(git status --porcelain)"
          test "$(git rev-parse "$PARENT^{tree}")" = 99a2647d07be9fe4988f6ee38ef67f133b216b00
          git diff --exit-code "$TRUSTED_MAIN" "$PARENT" -- ci/prepare-candidate tools/candidate_prepare.py
          patch="$RUNNER_TEMP/prepared/normalized.patch"
          receipt="$RUNNER_TEMP/prepared/receipt.json"
          echo "$PATCH_SHA256  $patch" | sha256sum -c -
          ./ci/prepare-candidate verify --parent "$PARENT" --tree "$PREPARED_TREE" --receipt "$receipt" --receipt-sha256 "$RECEIPT_SHA256" --trusted-python "$(command -v python)"
          export GIT_INDEX_FILE="$RUNNER_TEMP/prepared.index"
          git read-tree "$PARENT"
          git apply --cached --binary "$patch"
          git diff --cached --check "$PARENT"
          test "$(git write-tree)" = "$PREPARED_TREE"
          cat > "$RUNNER_TEMP/expected-paths" <<'EOF'
          tests/test_analyzer_readback.py
          tests/test_analyzer_readback_runner.py
          tools/analyzer_codacy.py
          tools/analyzer_deepsource.py
          EOF
          git diff --cached --name-only "$PARENT" > "$RUNNER_TEMP/actual-paths"
          diff -u "$RUNNER_TEMP/expected-paths" "$RUNNER_TEMP/actual-paths"
          unset GIT_INDEX_FILE
          test -z "$(git status --porcelain)"
      - name: Replace unused staging candidate with guarded combined candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$TRUSTED_MAIN"
          test "$(git ls-remote origin refs/heads/analyzer-readback-309-313 | cut -f1)" = "$PARENT"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$EXPECTED_STAGING"
          commit="$(printf '%s\n' 'fix: reject non-advancing analyzer pagination (#309 #313)' | git -c user.name='Gnostoa preparation' -c user.email='noreply@invalid' commit-tree "$PREPARED_TREE" -p "$PARENT")"
          git -c core.hooksPath=/dev/null push --force-with-lease="refs/heads/$TARGET_BRANCH:$EXPECTED_STAGING" origin "$commit:refs/heads/$TARGET_BRANCH"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$commit"
          printf 'STAGED_COMMIT=%s\nPREPARED_TREE=%s\nPRODUCTION_REF_UNCHANGED=%s\nSUPERSEDED_STAGING=%s\n' "$commit" "$PREPARED_TREE" "$PARENT" "$EXPECTED_STAGING" | tee "$RUNNER_TEMP/stage-result.txt"
          cat "$RUNNER_TEMP/stage-result.txt" >> "$GITHUB_STEP_SUMMARY"
