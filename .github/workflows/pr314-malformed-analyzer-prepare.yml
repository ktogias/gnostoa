name: PR314 malformed analyzer GREEN preparation

on:
  push:
    branches:
      - transport/pr314-malformed-analyzer-2ade51

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PARENT_SHA: 2ade51b6ebccfde341aa153d7c1502a51bbfac96
      PARENT_TREE: 832c7f719abd5596522a155aef98e0855bafdb1f
      INPUT_PATCH_BLOB_SHA: d7bf36a4927d4962f0ec0ba6fc531cc55d55f90b
    steps:
      - name: Checkout immutable helper control
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false

      - name: Verify immutable patch
        shell: bash
        run: |
          set -euo pipefail
          patch="${GITHUB_WORKSPACE}/control/recovery/pr314-malformed-analyzer.patch"
          test -f "${patch}"
          observed_blob="$(git -C "${GITHUB_WORKSPACE}/control" hash-object recovery/pr314-malformed-analyzer.patch)"
          test "${observed_blob}" = "${INPUT_PATCH_BLOB_SHA}"
          input_patch_sha256="$(sha256sum "${patch}" | awk '{print $1}')"
          printf 'INPUT_PATCH_SHA256=%s\n' "${input_patch_sha256}" >> "${GITHUB_ENV}"
          printf '%s\n' "${input_patch_sha256}" > "${RUNNER_TEMP}/pr314-malformed-analyzer-input-patch.sha256"

      - name: Checkout exact parent
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.PARENT_SHA }}
          fetch-depth: 0
          path: source
          persist-credentials: false

      - name: Bind parent and apply candidate
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/source"
          test "$(git rev-parse HEAD)" = "${PARENT_SHA}"
          test "$(git rev-parse 'HEAD^{tree}')" = "${PARENT_TREE}"
          test -z "$(git status --porcelain)"
          patch="${GITHUB_WORKSPACE}/control/recovery/pr314-malformed-analyzer.patch"
          git apply --check "${patch}"
          git apply "${patch}"
          printf '%s\n'             tests/test_analyzer_readback.py             tools/analyzer_deepsource.py             > "${RUNNER_TEMP}/expected-paths"
          git diff --name-only | LC_ALL=C sort > "${RUNNER_TEMP}/observed-paths"
          LC_ALL=C sort -o "${RUNNER_TEMP}/expected-paths" "${RUNNER_TEMP}/expected-paths"
          diff -u "${RUNNER_TEMP}/expected-paths" "${RUNNER_TEMP}/observed-paths"
          git diff --check

      - name: Set up trusted Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: source/requirements/development.lock

      - name: Install exact development dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install             --only-binary=:all:             --require-hashes             -r "${GITHUB_WORKSPACE}/source/requirements/development.lock"

      - name: Prove strict mypy and behavioral GREEN
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/source"
          python -m mypy tools/analyzer_deepsource.py
          PYTHONPATH=. python -m unittest             tests.test_analyzer_readback.DeepSourceAnalyzerReadbackTests.test_full_run_rejects_malformed_check_analyzer_without_issues
          PYTHONPATH=. python -m unittest tests.test_analyzer_readback
          python -m py_compile tools/analyzer_deepsource.py tests/test_analyzer_readback.py

      - name: Execute exact-parent Decision 0090 preparation
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/source"
          wrapper="${RUNNER_TEMP}/parent-prepare-candidate"
          git show "${PARENT_SHA}:ci/prepare-candidate" > "${wrapper}"
          sh "${wrapper}" prepare             --parent "${PARENT_SHA}"             --receipt "${RUNNER_TEMP}/pr314-malformed-analyzer-receipt.json"             --focused-profile fast             --trusted-python "$(command -v python)"             > "${RUNNER_TEMP}/pr314-malformed-analyzer-preparation-output.json"

      - name: Verify receipt and materialize prepared tree
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/source"
          receipt="${RUNNER_TEMP}/pr314-malformed-analyzer-receipt.json"
          prepared_tree="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["prepared_tree"])' "${receipt}")"
          receipt_sha="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["receipt_sha256"])' "${receipt}")"
          prepared_diff_sha="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["prepared_diff_sha256"])' "${receipt}")"
          retention_ref="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["retention_ref"])' "${receipt}")"
          wrapper="${RUNNER_TEMP}/parent-prepare-candidate"
          sh "${wrapper}" verify             --parent "${PARENT_SHA}"             --tree "${prepared_tree}"             --receipt "${receipt}"             --receipt-sha256 "${receipt_sha}"             --trusted-python "$(command -v python)"             > "${RUNNER_TEMP}/pr314-malformed-analyzer-receipt-verify.json"
          git diff --binary --full-index "${PARENT_SHA}" "${prepared_tree}" > "${RUNNER_TEMP}/pr314-malformed-analyzer-prepared.patch"
          actual="sha256:$(sha256sum "${RUNNER_TEMP}/pr314-malformed-analyzer-prepared.patch" | awk '{print $1}')"
          test "${actual}" = "${prepared_diff_sha}"
          git bundle create "${RUNNER_TEMP}/pr314-malformed-analyzer-prepared.bundle" "${retention_ref}"
          git bundle verify "${RUNNER_TEMP}/pr314-malformed-analyzer-prepared.bundle"
          sha256sum "${RUNNER_TEMP}/pr314-malformed-analyzer-prepared.bundle" > "${RUNNER_TEMP}/pr314-malformed-analyzer-prepared.bundle.sha256"
          {
            printf 'parent_commit=%s\n' "${PARENT_SHA}"
            printf 'parent_tree=%s\n' "${PARENT_TREE}"
            printf 'input_patch_sha256=%s\n' "${INPUT_PATCH_SHA256}"
            printf 'prepared_tree=%s\n' "${prepared_tree}"
            printf 'receipt_sha256=%s\n' "${receipt_sha}"
            printf 'prepared_diff_sha256=%s\n' "${prepared_diff_sha}"
          } > "${RUNNER_TEMP}/pr314-malformed-analyzer-preparation.identity"

      - name: Upload bounded preparation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr314-malformed-analyzer-decision0090-preparation
          path: |
            ${{ runner.temp }}/pr314-malformed-analyzer-input-patch.sha256
            ${{ runner.temp }}/pr314-malformed-analyzer-receipt.json
            ${{ runner.temp }}/pr314-malformed-analyzer-preparation-output.json
            ${{ runner.temp }}/pr314-malformed-analyzer-receipt-verify.json
            ${{ runner.temp }}/pr314-malformed-analyzer-prepared.patch
            ${{ runner.temp }}/pr314-malformed-analyzer-prepared.bundle
            ${{ runner.temp }}/pr314-malformed-analyzer-prepared.bundle.sha256
            ${{ runner.temp }}/pr314-malformed-analyzer-preparation.identity
          retention-days: 1
          if-no-files-found: error
