name: PR314 mypy GREEN and Decision 0090 preparation

on:
  push:
    branches:
      - transport/pr314-mypy-eceafbf

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PARENT_SHA: eceafbfdbdaed2aa3a076b250cf277bd06d7526b
      PARENT_TREE: 4aa72ceca940a89aa7594f08814fabd269418705
      PATCH_SHA256: ef2db75dd2072b325a5a381908b925e7a58432bc1ab5a7b9e88dc0122908160c
    steps:
      - name: Checkout immutable helper control
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Verify patch bytes
        shell: bash
        run: |
          set -euo pipefail
          patch="${GITHUB_WORKSPACE}/control/recovery/pr314-mypy-annotation.patch"
          test -f "${patch}"
          test "$(sha256sum "${patch}" | awk '{print $1}')" = "${PATCH_SHA256}"
      - name: Checkout exact parent
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.PARENT_SHA }}
          fetch-depth: 0
          path: source
          persist-credentials: false
      - name: Bind parent and apply one-line fix
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/source"
          test "$(git rev-parse HEAD)" = "${PARENT_SHA}"
          test "$(git rev-parse 'HEAD^{tree}')" = "${PARENT_TREE}"
          test -z "$(git status --porcelain)"
          patch="${GITHUB_WORKSPACE}/control/recovery/pr314-mypy-annotation.patch"
          git apply --check "${patch}"
          git apply "${patch}"
          test "$(git diff --name-only)" = "tools/analyzer_deepsource.py"
          git diff --check
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: source/requirements/development.lock
      - name: Install exact development dependencies
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r "${GITHUB_WORKSPACE}/source/requirements/development.lock"
      - name: Prove GREEN
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/source"
          python -m mypy tools/analyzer_deepsource.py
          PYTHONPATH=. python -m unittest tests.test_analyzer_readback
          python -m py_compile tools/analyzer_deepsource.py
      - name: Execute exact-parent Decision 0090 preparation
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/source"
          wrapper="${RUNNER_TEMP}/parent-prepare"
          git show "${PARENT_SHA}:ci/prepare-candidate" > "${wrapper}"
          receipt="${RUNNER_TEMP}/pr314-mypy-receipt.json"
          sh "${wrapper}" prepare             --parent "${PARENT_SHA}"             --receipt "${receipt}"             --focused-profile fast             --trusted-python "$(command -v python)"             > "${RUNNER_TEMP}/prepare-result.json"
          prepared_tree="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["prepared_tree"])' "${receipt}")"
          receipt_sha="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["receipt_sha256"])' "${receipt}")"
          prepared_diff_sha="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["prepared_diff_sha256"])' "${receipt}")"
          retention_ref="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["retention_ref"])' "${receipt}")"
          sh "${wrapper}" verify             --parent "${PARENT_SHA}"             --tree "${prepared_tree}"             --receipt "${receipt}"             --receipt-sha256 "${receipt_sha}"             --trusted-python "$(command -v python)"             > "${RUNNER_TEMP}/receipt-verify.json"
          git diff --binary --full-index "${PARENT_SHA}" "${prepared_tree}" > "${RUNNER_TEMP}/prepared.patch"
          test "sha256:$(sha256sum "${RUNNER_TEMP}/prepared.patch" | awk '{print $1}')" = "${prepared_diff_sha}"
          git bundle create "${RUNNER_TEMP}/prepared.bundle" "${retention_ref}"
          git bundle verify "${RUNNER_TEMP}/prepared.bundle"
          sha256sum "${RUNNER_TEMP}/prepared.bundle" > "${RUNNER_TEMP}/prepared.bundle.sha256"
          python - "${receipt}" "${RUNNER_TEMP}" <<'PY'
          import json,sys
          from pathlib import Path
          receipt=Path(sys.argv[1]); out=Path(sys.argv[2])
          doc=json.loads(receipt.read_text())
          assert doc["parent_commit"]=="eceafbfdbdaed2aa3a076b250cf277bd06d7526b", doc
          assert doc["parent_tree"]=="4aa72ceca940a89aa7594f08814fabd269418705", doc
          assert doc["changed_paths"]==["tools/analyzer_deepsource.py"], doc
          assert all(v==0 for v in doc["checks"].values()), doc
          for key in ("prepared_tree","receipt_sha256","prepared_diff_sha256","retention_ref"):
              (out/f"{key}.txt").write_text(str(doc[key])+"\n")
          PY
      - name: Upload preparation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr314-mypy-decision0090-preparation
          path: |
            ${{ runner.temp }}/pr314-mypy-receipt.json
            ${{ runner.temp }}/prepare-result.json
            ${{ runner.temp }}/receipt-verify.json
            ${{ runner.temp }}/prepared.patch
            ${{ runner.temp }}/prepared.bundle
            ${{ runner.temp }}/prepared.bundle.sha256
            ${{ runner.temp }}/prepared_tree.txt
            ${{ runner.temp }}/receipt_sha256.txt
            ${{ runner.temp }}/prepared_diff_sha256.txt
            ${{ runner.temp }}/retention_ref.txt
          retention-days: 1
          if-no-files-found: error
