name: PR314 mypy fix Decision 0090 preparation

on:
  push:
    branches:
      - transport/pr314-mypy-eceafb

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PARENT_SHA: eceafbfdbdaed2aa3a076b250cf277bd06d7526b
      PARENT_TREE: 4aa72ceca940a89aa7594f08814fabd269418705
      INPUT_PATCH_SHA256: ef2db75dd2072b325a5a381908b925e7a58432bc1ab5a7b9e88dc0122908160c
    steps:
      - name: Checkout immutable recovery control
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false

      - name: Verify immutable patch
        shell: bash
        run: |
          set -euo pipefail
          patch="${GITHUB_WORKSPACE}/control/recovery/pr314-mypy-fix.patch"
          test -f "${patch}"
          test "$(sha256sum "${patch}" | awk '{print $1}')" = "${INPUT_PATCH_SHA256}"

      - name: Checkout exact parent
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.PARENT_SHA }}
          fetch-depth: 0
          path: source
          persist-credentials: false

      - name: Bind parent and apply patch
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/source"
          test "$(git rev-parse HEAD)" = "${PARENT_SHA}"
          test "$(git rev-parse 'HEAD^{tree}')" = "${PARENT_TREE}"
          test -z "$(git status --porcelain)"
          git apply --check "${GITHUB_WORKSPACE}/control/recovery/pr314-mypy-fix.patch"
          git apply "${GITHUB_WORKSPACE}/control/recovery/pr314-mypy-fix.patch"
          test "$(git diff --name-only)" = "tools/analyzer_deepsource.py"
          git diff --check

      - name: Set up trusted Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: source/requirements/development.lock

      - name: Install exact development dependencies
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r "${GITHUB_WORKSPACE}/source/requirements/development.lock"

      - name: Strict mypy GREEN
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/source"
          python -m mypy tools/analyzer_deepsource.py

      - name: Focused and module GREEN
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/source"
          PYTHONPATH=. python -m unittest tests.test_analyzer_readback.DeepSourceAnalyzerReadbackTests.test_multiple_check_run_ids_for_same_analyzer_are_ambiguous
          PYTHONPATH=. python -m unittest tests.test_analyzer_readback
          python -m py_compile tools/analyzer_deepsource.py tests/test_analyzer_readback.py

      - name: Execute exact-parent Decision 0090 preparation
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/source"
          wrapper="${RUNNER_TEMP}/parent-prepare-candidate"
          git show "${PARENT_SHA}:ci/prepare-candidate" > "${wrapper}"
          sh "${wrapper}" prepare             --parent "${PARENT_SHA}"             --receipt "${RUNNER_TEMP}/pr314-mypy-receipt.json"             --focused-profile fast             --trusted-python "$(command -v python)"             > "${RUNNER_TEMP}/pr314-mypy-preparation-output.json"

      - name: Verify receipt and materialize prepared tree
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/source"
          receipt="${RUNNER_TEMP}/pr314-mypy-receipt.json"
          prepared_tree="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["prepared_tree"])' "${receipt}")"
          receipt_sha="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["receipt_sha256"])' "${receipt}")"
          prepared_diff_sha="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["prepared_diff_sha256"])' "${receipt}")"
          retention_ref="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["retention_ref"])' "${receipt}")"
          wrapper="${RUNNER_TEMP}/parent-prepare-candidate"
          sh "${wrapper}" verify             --parent "${PARENT_SHA}"             --tree "${prepared_tree}"             --receipt "${receipt}"             --receipt-sha256 "${receipt_sha}"             --trusted-python "$(command -v python)"             > "${RUNNER_TEMP}/pr314-mypy-receipt-verify.json"
          git diff --binary --full-index "${PARENT_SHA}" "${prepared_tree}" > "${RUNNER_TEMP}/pr314-mypy-prepared.patch"
          actual="sha256:$(sha256sum "${RUNNER_TEMP}/pr314-mypy-prepared.patch" | awk '{print $1}')"
          test "${actual}" = "${prepared_diff_sha}"
          git bundle create "${RUNNER_TEMP}/pr314-mypy-prepared.bundle" "${retention_ref}"
          git bundle verify "${RUNNER_TEMP}/pr314-mypy-prepared.bundle"
          sha256sum "${RUNNER_TEMP}/pr314-mypy-prepared.bundle" > "${RUNNER_TEMP}/pr314-mypy-prepared.bundle.sha256"
          {
            printf 'parent_commit=%s\n' "${PARENT_SHA}"
            printf 'parent_tree=%s\n' "${PARENT_TREE}"
            printf 'input_patch_sha256=%s\n' "${INPUT_PATCH_SHA256}"
            printf 'prepared_tree=%s\n' "${prepared_tree}"
            printf 'receipt_sha256=%s\n' "${receipt_sha}"
            printf 'prepared_diff_sha256=%s\n' "${prepared_diff_sha}"
          } > "${RUNNER_TEMP}/pr314-mypy-preparation.identity"

      - name: Upload bounded preparation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr314-mypy-decision0090-preparation
          path: |
            ${{ runner.temp }}/pr314-mypy-receipt.json
            ${{ runner.temp }}/pr314-mypy-preparation-output.json
            ${{ runner.temp }}/pr314-mypy-receipt-verify.json
            ${{ runner.temp }}/pr314-mypy-prepared.patch
            ${{ runner.temp }}/pr314-mypy-prepared.bundle
            ${{ runner.temp }}/pr314-mypy-prepared.bundle.sha256
            ${{ runner.temp }}/pr314-mypy-preparation.identity
          retention-days: 1
          if-no-files-found: error
