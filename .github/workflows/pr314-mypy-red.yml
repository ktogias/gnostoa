name: PR314 exact-head mypy RED

on:
  push:
    branches:
      - transport/pr314-mypy-red-eceafbf

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_SHA: eceafbfdbdaed2aa3a076b250cf277bd06d7526b
      TARGET_TREE: 4aa72ceca940a89aa7594f08814fabd269418705
    steps:
      - name: Checkout exact RED subject
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false

      - name: Verify exact RED subject
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          test "$(git rev-parse 'HEAD^{tree}')" = "${TARGET_TREE}"
          test -z "$(git status --porcelain)"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/development.lock

      - name: Install exact development dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --only-binary=:all: --require-hashes -r requirements/development.lock

      - name: Prove strict-mypy RED
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python -m mypy tools ci > "${RUNNER_TEMP}/mypy-red.log" 2>&1
          rc=$?
          set -e
          cat "${RUNNER_TEMP}/mypy-red.log"
          test "${rc}" -ne 0
          grep -F 'Argument 1 to "add" of "set" has incompatible type "tuple[str, ...]"; expected "tuple[str, str]"' "${RUNNER_TEMP}/mypy-red.log"

      - name: Upload RED evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr314-mypy-red-eceafbf
          path: ${{ runner.temp }}/mypy-red.log
          retention-days: 1
          if-no-files-found: error
