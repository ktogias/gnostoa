name: PR314 pagination metadata GREEN preparation

on:
  push:
    branches:
      - transport/pr314-final-hardening-aaedae

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PARENT_SHA: aaedae65d27f96629533f25366b2f563d31ada75
      PARENT_TREE: 361943f69b0e79f097ab7d576860381bcb471144
      CODE_BLOB: 55aa14f3ac25ab22540882b9366ab69ae2bf7b56
      TEST_BLOB: 800f3b11504ec4b859056a095a666bd32885a27c
    steps:
      - name: Checkout immutable helper control
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false

      - name: Verify exact candidate blobs
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/control"
          test "$(git hash-object tools/analyzer_deepsource.py)" = "${CODE_BLOB}"
          test "$(git hash-object tests/test_analyzer_readback.py)" = "${TEST_BLOB}"

      - name: Checkout exact parent
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.PARENT_SHA }}
          fetch-depth: 0
          path: source
          persist-credentials: false

      - name: Bind parent and materialize candidate
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/source"
          test "$(git rev-parse HEAD)" = "${PARENT_SHA}"
          test "$(git rev-parse 'HEAD^{tree}')" = "${PARENT_TREE}"
          test -z "$(git status --porcelain)"
          cp "${GITHUB_WORKSPACE}/control/tools/analyzer_deepsource.py" tools/analyzer_deepsource.py
          cp "${GITHUB_WORKSPACE}/control/tests/test_analyzer_readback.py" tests/test_analyzer_readback.py
          printf '%s\n' tests/test_analyzer_readback.py tools/analyzer_deepsource.py > "${RUNNER_TEMP}/expected-paths"
          git diff --name-only | LC_ALL=C sort > "${RUNNER_TEMP}/observed-paths"
          LC_ALL=C sort -o "${RUNNER_TEMP}/expected-paths" "${RUNNER_TEMP}/expected-paths"
          diff -u "${RUNNER_TEMP}/expected-paths" "${RUNNER_TEMP}/observed-paths"
          git diff --check

      - name: Set up trusted Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: source/requirements/development.lock

      - name: Install exact development dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install \
            --only-binary=:all: \
            --require-hashes \
            -r "${GITHUB_WORKSPACE}/source/requirements/development.lock"

      - name: Prove strict mypy and behavioral GREEN
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/source"
          python -m mypy tools/analyzer_deepsource.py
          PYTHONPATH=. python -m unittest \
            tests.test_analyzer_readback.DeepSourceAnalyzerReadbackTests.test_full_run_rejects_malformed_check_analyzer_without_issues \
            tests.test_analyzer_readback.DeepSourceAnalyzerReadbackTests.test_full_run_rejects_check_metadata_drift_without_issues \
            tests.test_analyzer_readback.DeepSourceAnalyzerReadbackTests.test_full_run_rejects_malformed_suppression_state
          PYTHONPATH=. python -m unittest tests.test_analyzer_readback
          python -m py_compile tools/analyzer_deepsource.py tests/test_analyzer_readback.py

      - name: Execute exact-parent Decision 0090 preparation
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/source"
          wrapper="${RUNNER_TEMP}/parent-prepare-candidate"
          git show "${PARENT_SHA}:ci/prepare-candidate" > "${wrapper}"
          sh "${wrapper}" prepare \
            --parent "${PARENT_SHA}" \
            --receipt "${RUNNER_TEMP}/pr314-pagination-metadata-receipt.json" \
            --focused-profile fast \
            --trusted-python "$(command -v python)" \
            > "${RUNNER_TEMP}/pr314-pagination-metadata-preparation-output.json"

      - name: Verify receipt and materialize prepared tree
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/source"
          receipt="${RUNNER_TEMP}/pr314-pagination-metadata-receipt.json"
          prepared_tree="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["prepared_tree"])' "${receipt}")"
          receipt_sha="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["receipt_sha256"])' "${receipt}")"
          prepared_diff_sha="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["prepared_diff_sha256"])' "${receipt}")"
          retention_ref="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["retention_ref"])' "${receipt}")"
          wrapper="${RUNNER_TEMP}/parent-prepare-candidate"
          sh "${wrapper}" verify \
            --parent "${PARENT_SHA}" \
            --tree "${prepared_tree}" \
            --receipt "${receipt}" \
            --receipt-sha256 "${receipt_sha}" \
            --trusted-python "$(command -v python)" \
            > "${RUNNER_TEMP}/pr314-pagination-metadata-receipt-verify.json"
          git diff --binary --full-index "${PARENT_SHA}" "${prepared_tree}" > "${RUNNER_TEMP}/pr314-pagination-metadata-prepared.patch"
          actual="sha256:$(sha256sum "${RUNNER_TEMP}/pr314-pagination-metadata-prepared.patch" | awk '{print $1}')"
          test "${actual}" = "${prepared_diff_sha}"
          git bundle create "${RUNNER_TEMP}/pr314-pagination-metadata-prepared.bundle" "${retention_ref}"
          git bundle verify "${RUNNER_TEMP}/pr314-pagination-metadata-prepared.bundle"
          sha256sum "${RUNNER_TEMP}/pr314-pagination-metadata-prepared.bundle" > "${RUNNER_TEMP}/pr314-pagination-metadata-prepared.bundle.sha256"
          {
            printf 'parent_commit=%s\n' "${PARENT_SHA}"
            printf 'parent_tree=%s\n' "${PARENT_TREE}"
            printf 'code_blob=%s\n' "${CODE_BLOB}"
            printf 'test_blob=%s\n' "${TEST_BLOB}"
            printf 'prepared_tree=%s\n' "${prepared_tree}"
            printf 'receipt_sha256=%s\n' "${receipt_sha}"
            printf 'prepared_diff_sha256=%s\n' "${prepared_diff_sha}"
          } > "${RUNNER_TEMP}/pr314-pagination-metadata-preparation.identity"

      - name: Upload bounded preparation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr314-pagination-metadata-decision0090-preparation
          path: |
            ${{ runner.temp }}/pr314-pagination-metadata-receipt.json
            ${{ runner.temp }}/pr314-pagination-metadata-preparation-output.json
            ${{ runner.temp }}/pr314-pagination-metadata-receipt-verify.json
            ${{ runner.temp }}/pr314-pagination-metadata-prepared.patch
            ${{ runner.temp }}/pr314-pagination-metadata-prepared.bundle
            ${{ runner.temp }}/pr314-pagination-metadata-prepared.bundle.sha256
            ${{ runner.temp }}/pr314-pagination-metadata-preparation.identity
          retention-days: 1
          if-no-files-found: error
