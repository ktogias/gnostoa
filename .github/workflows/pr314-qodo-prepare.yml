name: PR314 Qodo follow-up preparation

on:
  push:
    branches:
      - transport/pr314-qodo-checkrun-47369ba

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_SHA: 47369ba6a95a48fb0b2ba765c6c478564b95850c
      TARGET_TREE: b1e8db204139ab22a477fb3a037773471ad7b938
      CANDIDATE_PATCH_SHA256: f870e4254b43bf77b0427c705f1ac974a6a8694e37e0c97626d67ac878b6e410
      CANDIDATE_PATCH_B64: 
    steps:
      - name: Checkout exact parent
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact parent and apply immutable candidate patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          test "$(git rev-parse 'HEAD^{tree}')" = "${TARGET_TREE}"
          test -z "$(git status --porcelain)"
          patch="${RUNNER_TEMP}/candidate.patch"
          printf '%s' "${CANDIDATE_PATCH_B64}" | base64 -d > "${patch}"
          test "$(sha256sum "${patch}" | awk '{print $1}')" = "${CANDIDATE_PATCH_SHA256}"
          git apply --check "${patch}"
          git apply "${patch}"
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(tests/test_analyzer_readback.py tools/analyzer_deepsource.py)
          test "${#changed[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do test "${changed[$i]}" = "${expected[$i]}"; done
          git diff --binary > "${RUNNER_TEMP}/candidate-observed.patch"
          test "$(sha256sum "${RUNNER_TEMP}/candidate-observed.patch" | awk '{print $1}')" = "${CANDIDATE_PATCH_SHA256}"

      - name: Set up trusted Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/development.lock

      - name: Install exact development dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --only-binary=:all: --require-hashes -r requirements/development.lock

      - name: Run focused candidate verification
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m unittest tests.test_analyzer_readback.DeepSourceAnalyzerReadbackTests.test_multiple_check_run_ids_for_same_analyzer_are_ambiguous
          PYTHONPATH=. python -m unittest tests.test_analyzer_readback
          python -m py_compile tools/analyzer_deepsource.py tests/test_analyzer_readback.py

      - name: Run exact-parent Decision 0090 preparation
        shell: bash
        run: |
          set -euo pipefail
          wrapper="${RUNNER_TEMP}/parent-prepare"
          git show "${TARGET_SHA}:ci/prepare-candidate" > "${wrapper}"
          receipt="${RUNNER_TEMP}/pr314-qodo-receipt.json"
          sh "${wrapper}" prepare             --parent "${TARGET_SHA}"             --receipt "${receipt}"             --focused-profile fast             --trusted-python "$(command -v python)"             > "${RUNNER_TEMP}/prepare-result.json"

          prepared_tree="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["prepared_tree"])' "${receipt}")"
          receipt_sha="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["receipt_sha256"])' "${receipt}")"
          prepared_diff_sha="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["prepared_diff_sha256"])' "${receipt}")"
          retention_ref="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["retention_ref"])' "${receipt}")"

          sh "${wrapper}" verify             --parent "${TARGET_SHA}"             --tree "${prepared_tree}"             --receipt "${receipt}"             --receipt-sha256 "${receipt_sha}"             --trusted-python "$(command -v python)"             > "${RUNNER_TEMP}/receipt-verify.json"

          git diff --binary --full-index "${TARGET_SHA}" "${prepared_tree}" > "${RUNNER_TEMP}/prepared.patch"
          test "sha256:$(sha256sum "${RUNNER_TEMP}/prepared.patch" | awk '{print $1}')" = "${prepared_diff_sha}"
          git bundle create "${RUNNER_TEMP}/prepared.bundle" "${retention_ref}"
          git bundle verify "${RUNNER_TEMP}/prepared.bundle"
          sha256sum "${RUNNER_TEMP}/prepared.bundle" > "${RUNNER_TEMP}/prepared.bundle.sha256"

          python - "${receipt}" "${RUNNER_TEMP}" <<'PY'
          import json, sys
          from pathlib import Path
          receipt=Path(sys.argv[1])
          out=Path(sys.argv[2])
          doc=json.loads(receipt.read_text(encoding="utf-8"))
          assert doc["parent_commit"] == "47369ba6a95a48fb0b2ba765c6c478564b95850c", doc
          assert doc["parent_tree"] == "b1e8db204139ab22a477fb3a037773471ad7b938", doc
          assert doc["changed_paths"] == ["tests/test_analyzer_readback.py","tools/analyzer_deepsource.py"], doc
          assert doc["focused_profile"] == "fast", doc
          assert all(v == 0 for v in doc["checks"].values()), doc
          for key in ("prepared_tree","receipt_sha256","prepared_diff_sha256","retention_ref"):
              (out / f"{key}.txt").write_text(str(doc[key])+"\n",encoding="utf-8")
          PY

      - name: Upload non-secret preparation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr314-qodo-decision0090-preparation
          path: |
            ${{ runner.temp }}/candidate-observed.patch
            ${{ runner.temp }}/pr314-qodo-receipt.json
            ${{ runner.temp }}/prepare-result.json
            ${{ runner.temp }}/receipt-verify.json
            ${{ runner.temp }}/prepared.patch
            ${{ runner.temp }}/prepared.bundle
            ${{ runner.temp }}/prepared.bundle.sha256
            ${{ runner.temp }}/prepared_tree.txt
            ${{ runner.temp }}/receipt_sha256.txt
            ${{ runner.temp }}/prepared_diff_sha256.txt
            ${{ runner.temp }}/retention_ref.txt
          retention-days: 1
          if-no-files-found: error
