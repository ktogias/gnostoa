name: Prepare PR 314 R7 test hardening

on:
  push:
    branches:
      - ops/pr314-r7-test-prep-3fae

permissions:
  contents: read

concurrency:
  group: pr314-r7-test-preparation
  cancel-in-progress: false

env:
  PARENT: 3fae0d6e2210a0ffe49f3b95ecc51b48f67c8c3b
  PARENT_TREE: 454e1976fb553f0fea9b3777adb0fe2998d51bb4
  INPUT_PATCH_SHA256: eae7024623abdf3d98b440632f4444f026562a4a25a9540393db38230bf67f99
  INPUT_GZIP_SHA256: fbed15ee92bb5303c54e0a0781e6ffc067e4698e314223284c42d2585d759ecf

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout helper inputs
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reconstruct and bind test-only patch
        shell: bash
        run: |
          set -euo pipefail
          gzip_file="${RUNNER_TEMP}/candidate.patch.gz"
          patch_file="${RUNNER_TEMP}/candidate.patch"
          base64 --decode .gnostoa-ops/pr314-r7-test.patch.gz.b64 > "${gzip_file}"
          echo "${INPUT_GZIP_SHA256}  ${gzip_file}" | sha256sum -c -
          gzip -dc "${gzip_file}" > "${patch_file}"
          echo "${INPUT_PATCH_SHA256}  ${patch_file}" | sha256sum -c -

          git checkout --detach "${PARENT}"
          test "$(git rev-parse HEAD)" = "${PARENT}"
          test "$(git rev-parse 'HEAD^{tree}')" = "${PARENT_TREE}"
          test -z "$(git status --porcelain)"
          git apply --binary "${patch_file}"
          git diff --check "${PARENT}"
          test "$(git diff --name-only "${PARENT}")" = "tests/test_analyzer_readback.py"

      - name: Set up trusted Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/development.lock

      - name: Install exact development tooling
        run: |
          set -euo pipefail
          python -m pip install             --only-binary=:all:             --require-hashes             -r requirements/development.lock
          test "$(python -m ruff --version)" = "ruff 0.16.0"
          command -v docker
          docker --version

      - name: Run Decision 0090 preparation
        shell: bash
        run: |
          set -euo pipefail
          receipt="${RUNNER_TEMP}/receipt.json"
          ./ci/prepare-candidate prepare             --parent "${PARENT}"             --receipt "${receipt}"             --focused-profile fast             --trusted-python "$(command -v python)"

          tree="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["prepared_tree"])' "${receipt}")"
          receipt_sha="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["receipt_sha256"])' "${receipt}")"
          ./ci/prepare-candidate verify             --parent "${PARENT}"             --tree "${tree}"             --receipt "${receipt}"             --receipt-sha256 "${receipt_sha}"             --trusted-python "$(command -v python)"

          python - "${receipt}" <<'PY'
          import json
          import sys
          from pathlib import Path
          doc=json.loads(Path(sys.argv[1]).read_text())
          assert doc["parent_commit"] == "3fae0d6e2210a0ffe49f3b95ecc51b48f67c8c3b"
          assert doc["parent_tree"] == "454e1976fb553f0fea9b3777adb0fe2998d51bb4"
          assert doc["changed_paths"] == ["tests/test_analyzer_readback.py"]
          assert doc["checks"] == {
              "style_fix": 0,
              "focused_verification": 0,
              "style_check": 0,
              "diff_check": 0,
          }
          assert doc["ruff_version"] == "ruff 0.16.0"
          PY

          out="${RUNNER_TEMP}/prepared"
          mkdir -p "${out}"
          git diff --binary --full-index "${PARENT}" "${tree}" > "${out}/normalized.patch"
          cp "${receipt}" "${out}/receipt.json"
          git show "${tree}:tests/test_analyzer_readback.py" > "${out}/test_analyzer_readback.py"
          sha256sum "${out}/normalized.patch" "${out}/test_analyzer_readback.py" > "${out}/sha256sums.txt"

      - name: Upload prepared test candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr314-r7-test-prepared
          path: ${{ runner.temp }}/prepared
          if-no-files-found: error
          retention-days: 2
