name: PR314 integrated readback dispatch control
on:
  push:
    branches: [ops/pr314-readback-dispatch-ff887985]
    paths: [.github/workflows/pr314-readback-dispatch-control.yml]
permissions:
  contents: read
  pull-requests: read
  actions: write
concurrency:
  group: pr314-integrated-analyzer-readback
  cancel-in-progress: false
jobs:
  dispatch:
    if: github.repository == 'ktogias/gnostoa'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch only the integrated main reader once
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_HOST: github.com
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ktogias/gnostoa'
          test "$GITHUB_REF" = 'refs/heads/ops/pr314-readback-dispatch-ff887985'
          test "$GITHUB_RUN_ATTEMPT" = '1'
          repo='ktogias/gnostoa'
          main='ff8879858c09531c13cf8906cd14094e1077e27b'
          head='125fd23eaa5c29fb327cb06d077921bdd2105733'
          tree='48ce506d70cea2d5ed1c54d12bbcbe3ed70c24cb'
          test "$(gh api "repos/$repo/git/ref/heads/main" --jq .object.sha)" = "$main"
          gh api "repos/$repo/pulls/314" > "$RUNNER_TEMP/pr314-dispatch-subject.json"
          jq -e --arg main "$main" --arg head "$head" '.merged == true and .merge_commit_sha == $main and .head.sha == $head' "$RUNNER_TEMP/pr314-dispatch-subject.json" > /dev/null
          test "$(gh api "repos/$repo/git/commits/$main" --jq .tree.sha)" = "$tree"
          count="$(gh api --method GET "repos/$repo/actions/workflows/analyzer-readback.yml/runs" -f head_sha="$main" -f event=workflow_dispatch --jq .total_count)"
          case "$count" in ''|*[!0-9]*) echo 'INVALID_RUN_COUNT'; exit 1;; esac
          if test "$count" -gt 1; then
            echo 'EXISTING_OFFICIAL_READBACK_FOUND; no duplicate dispatch'
            exit 0
          fi
          test "$count" = '1'
          gh api "repos/$repo/actions/runs/35996303251" > "$RUNNER_TEMP/pr314-first-run.json"
          jq -e --arg main "$main" '.conclusion == "success" and .head_sha == $main and .head_branch == "main" and .path == ".github/workflows/analyzer-readback.yml"' "$RUNNER_TEMP/pr314-first-run.json" > /dev/null
          probe_head='81e955b1962eaa8a415fae3dad00568b12c3349e'
          gh api "repos/$repo/pulls/305" > "$RUNNER_TEMP/pr305-readback-subject.json"
          jq -e --arg head "$probe_head" '.merged == true and .head.sha == $head' "$RUNNER_TEMP/pr305-readback-subject.json" > /dev/null
          test "$(gh api "repos/$repo/git/ref/heads/main" --jq .object.sha)" = "$main"
          jq -n --arg head "$probe_head" '{ref:"main",inputs:{pull_number:"305",head:$head}}' > "$RUNNER_TEMP/pr314-dispatch-request.json"
          gh api --method POST "repos/$repo/actions/workflows/analyzer-readback.yml/dispatches" -H 'X-GitHub-Api-Version: 2026-03-10' --input "$RUNNER_TEMP/pr314-dispatch-request.json"
          echo 'OFFICIAL_EXISTING_ANALYSIS_READBACK_DISPATCH_ACCEPTED'
