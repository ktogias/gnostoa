name: PR314 normalized tool identity GREEN preparation

on:
  push:
    branches:
      - transport/pr314-tool-identity-b817299

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PARENT_SHA: b817299fb8b7f9bf47cd69c440a1ea675e5dfa12
      PARENT_TREE: 9b3b76491c3a604a0d519dda97a68db3abcfed78
      COMMON_BLOB: 312b53053dcf8de55b66adff252833df930d8718
      DEEPSOURCE_BLOB: 59fb76849d597967e11d2e0086a2ab68736f815b
      CODACY_BLOB: dbdfb4fb8ff335e43304a9cdf6674ae91f096edc
      TESTS_BLOB: 071fefc93666777286af4b0fa87edd048e19f450
      DECISION_BLOB: cfb31427b1ca82960b51f98b308c851f891f05d8
    steps:
      - name: Checkout immutable helper control
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Verify immutable candidate blobs
        shell: bash
        run: |
          set -euo pipefail
          control="${GITHUB_WORKSPACE}/control"
          test "$(git -C "${control}" hash-object recovery/candidate-tools-analyzer_readback.py)" = "${COMMON_BLOB}"
          test "$(git -C "${control}" hash-object recovery/candidate-tools-analyzer_deepsource.py)" = "${DEEPSOURCE_BLOB}"
          test "$(git -C "${control}" hash-object recovery/candidate-tools-analyzer_codacy.py)" = "${CODACY_BLOB}"
          test "$(git -C "${control}" hash-object recovery/candidate-tests-test_analyzer_readback.py)" = "${TESTS_BLOB}"
          test "$(git -C "${control}" hash-object recovery/candidate-decision-0091.md)" = "${DECISION_BLOB}"
      - name: Checkout exact parent
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.PARENT_SHA }}
          fetch-depth: 0
          path: source
          persist-credentials: false
      - name: Bind parent and materialize candidate
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/source"
          test "$(git rev-parse HEAD)" = "${PARENT_SHA}"
          test "$(git rev-parse 'HEAD^{tree}')" = "${PARENT_TREE}"
          test -z "$(git status --porcelain)"
          cp "${GITHUB_WORKSPACE}/control/recovery/candidate-tools-analyzer_readback.py" tools/analyzer_readback.py
          cp "${GITHUB_WORKSPACE}/control/recovery/candidate-tools-analyzer_deepsource.py" tools/analyzer_deepsource.py
          cp "${GITHUB_WORKSPACE}/control/recovery/candidate-tools-analyzer_codacy.py" tools/analyzer_codacy.py
          cp "${GITHUB_WORKSPACE}/control/recovery/candidate-tests-test_analyzer_readback.py" tests/test_analyzer_readback.py
          cp "${GITHUB_WORKSPACE}/control/recovery/candidate-decision-0091.md" knowledge/decisions/0091-add-authenticated-provider-neutral-analyzer-readback.md
          printf '%s\n' \
            knowledge/decisions/0091-add-authenticated-provider-neutral-analyzer-readback.md \
            tests/test_analyzer_readback.py \
            tools/analyzer_codacy.py \
            tools/analyzer_deepsource.py \
            tools/analyzer_readback.py \
            > "${RUNNER_TEMP}/expected-paths"
          git diff --name-only | LC_ALL=C sort > "${RUNNER_TEMP}/observed-paths"
          LC_ALL=C sort -o "${RUNNER_TEMP}/expected-paths" "${RUNNER_TEMP}/expected-paths"
          diff -u "${RUNNER_TEMP}/expected-paths" "${RUNNER_TEMP}/observed-paths"
          git diff --check
      - name: Set up trusted Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: source/requirements/development.lock
      - name: Install exact development dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --only-binary=:all: --require-hashes \
            -r "${GITHUB_WORKSPACE}/source/requirements/development.lock"
      - name: Prove focused GREEN and architecture separation
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/source"
          python -m mypy tools/analyzer_readback.py tools/analyzer_deepsource.py tools/analyzer_codacy.py ci/analyzer_readback.py
          PYTHONPATH=. python -m unittest \
            tests.test_analyzer_readback.AnalyzerReadbackModelTests.test_common_model_retains_provider_scoped_tool_identity \
            tests.test_analyzer_readback.AnalyzerReadbackModelTests.test_common_model_rejects_unknown_tool_identity_fields \
            tests.test_analyzer_readback.DeepSourceAnalyzerReadbackTests.test_full_run_uses_exact_run_and_complete_issue_pagination \
            tests.test_analyzer_readback.CodacyAnalyzerReadbackTests.test_codacy_current_api_origin_and_native_issue_identities_are_retained
          PYTHONPATH=. python -m unittest tests.test_analyzer_readback
          python -m py_compile tools/analyzer_readback.py tools/analyzer_deepsource.py tools/analyzer_codacy.py tests/test_analyzer_readback.py
          decision=knowledge/decisions/0091-add-authenticated-provider-neutral-analyzer-readback.md
          grep -Fq 'target: /decisions/0089-establish-q0-reviewer-qualification-semantics.md' "${decision}"
          grep -Fq 'target: /decisions/0067-evaluate-semantic-review-assurance-through-bound-evidence.md' "${decision}"
          grep -Fq 'analyzer-provider boundary' "${decision}"
          grep -Fq 'independence_domain_id' "${decision}"
          ! grep -Eq 'analyzer_(deepsource|codacy)|gnostoa-analyzer-readback' tools/review_reconcile.py tools/review_evaluate.py schemas/review-check-input.schema.json
      - name: Execute exact-parent Decision 0090 preparation
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/source"
          wrapper="${RUNNER_TEMP}/parent-prepare-candidate"
          git show "${PARENT_SHA}:ci/prepare-candidate" > "${wrapper}"
          sh "${wrapper}" prepare \
            --parent "${PARENT_SHA}" \
            --receipt "${RUNNER_TEMP}/pr314-tool-identity-receipt.json" \
            --focused-profile fast \
            --trusted-python "$(command -v python)" \
            > "${RUNNER_TEMP}/pr314-tool-identity-prepare.json"
      - name: Verify receipt and retain prepared material
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/source"
          receipt="${RUNNER_TEMP}/pr314-tool-identity-receipt.json"
          tree="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["prepared_tree"])' "${receipt}")"
          receipt_sha="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["receipt_sha256"])' "${receipt}")"
          diff_sha="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["prepared_diff_sha256"])' "${receipt}")"
          retention_ref="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["retention_ref"])' "${receipt}")"
          wrapper="${RUNNER_TEMP}/parent-prepare-candidate"
          sh "${wrapper}" verify \
            --parent "${PARENT_SHA}" \
            --tree "${tree}" \
            --receipt "${receipt}" \
            --receipt-sha256 "${receipt_sha}" \
            --trusted-python "$(command -v python)" \
            > "${RUNNER_TEMP}/pr314-tool-identity-verify.json"
          git diff --binary --full-index "${PARENT_SHA}" "${tree}" > "${RUNNER_TEMP}/pr314-tool-identity-prepared.patch"
          actual="sha256:$(sha256sum "${RUNNER_TEMP}/pr314-tool-identity-prepared.patch" | awk '{print $1}')"
          test "${actual}" = "${diff_sha}"
          git bundle create "${RUNNER_TEMP}/pr314-tool-identity-prepared.bundle" "${retention_ref}"
          git bundle verify "${RUNNER_TEMP}/pr314-tool-identity-prepared.bundle"
          sha256sum "${RUNNER_TEMP}/pr314-tool-identity-prepared.bundle" > "${RUNNER_TEMP}/pr314-tool-identity-prepared.bundle.sha256"
          {
            printf 'parent_commit=%s\n' "${PARENT_SHA}"
            printf 'parent_tree=%s\n' "${PARENT_TREE}"
            printf 'prepared_tree=%s\n' "${tree}"
            printf 'receipt_sha256=%s\n' "${receipt_sha}"
            printf 'prepared_diff_sha256=%s\n' "${diff_sha}"
          } > "${RUNNER_TEMP}/pr314-tool-identity.identity"
      - name: Upload bounded preparation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr314-tool-identity-decision0090-preparation
          path: |
            ${{ runner.temp }}/pr314-tool-identity-receipt.json
            ${{ runner.temp }}/pr314-tool-identity-prepare.json
            ${{ runner.temp }}/pr314-tool-identity-verify.json
            ${{ runner.temp }}/pr314-tool-identity-prepared.patch
            ${{ runner.temp }}/pr314-tool-identity-prepared.bundle
            ${{ runner.temp }}/pr314-tool-identity-prepared.bundle.sha256
            ${{ runner.temp }}/pr314-tool-identity.identity
          retention-days: 1
          if-no-files-found: error
