name: Prepare PR 314 typing fix

on:
  push:
    branches:
      - ops/pr314-typing-127191

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reconstruct exact candidate
        shell: bash
        env:
          PARENT: 127191bc78daebd38548ac4e95cf9bdd141b2fb5
          PARENT_TREE: 05b13790d2a97ba373dba9e65999018d612e13b1
          PATCH_SHA256: 9cde5d839140a8c66806a0c8164da02f49d1412818f3ffb2f067514c5307b5b4
        run: |
          set -euo pipefail
          patch_file="${RUNNER_TEMP}/candidate.patch"
          cp .gnostoa-ops/pr314-typing-fix.patch "${patch_file}"
          echo "${PATCH_SHA256}  ${patch_file}" | sha256sum -c -
          git checkout --detach "${PARENT}"
          test "$(git rev-parse HEAD)" = "${PARENT}"
          test "$(git rev-parse 'HEAD^{tree}')" = "${PARENT_TREE}"
          test -z "$(git status --porcelain)"
          git apply --binary "${patch_file}"
          test "$(git diff --binary --full-index "${PARENT}" -- tools/analyzer_deepsource.py | sha256sum | awk '{print $1}')" = "${PATCH_SHA256}"
          git diff --check "${PARENT}"
          printf '%s\n' tools/analyzer_deepsource.py > "${RUNNER_TEMP}/expected-paths"
          git diff --name-only "${PARENT}" > "${RUNNER_TEMP}/actual-paths"
          diff -u "${RUNNER_TEMP}/expected-paths" "${RUNNER_TEMP}/actual-paths"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/development.lock

      - name: Install exact development tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --only-binary=:all: --require-hashes -r requirements/development.lock
          python -m ruff --version
          python -m mypy --version
          command -v docker
          docker --version

      - name: Verify strict typing
        shell: bash
        run: |
          set -euo pipefail
          python -m mypy tools/analyzer_deepsource.py

      - name: Run Decision 0090 preparation
        shell: bash
        env:
          PARENT: 127191bc78daebd38548ac4e95cf9bdd141b2fb5
        run: |
          set -euo pipefail
          receipt="${RUNNER_TEMP}/receipt.json"
          ./ci/prepare-candidate prepare             --parent "${PARENT}"             --receipt "${receipt}"             --focused-profile fast             --trusted-python "$(command -v python)"
          tree="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["prepared_tree"])' "${receipt}")"
          receipt_sha="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["receipt_sha256"])' "${receipt}")"
          ./ci/prepare-candidate verify             --parent "${PARENT}"             --tree "${tree}"             --receipt "${receipt}"             --receipt-sha256 "${receipt_sha}"             --trusted-python "$(command -v python)"
          out="${RUNNER_TEMP}/prepared"
          mkdir -p "${out}"
          git diff --binary --full-index "${PARENT}" "${tree}" > "${out}/normalized.patch"
          cp "${receipt}" "${out}/receipt.json"
          patch_sha="$(sha256sum "${out}/normalized.patch" | awk '{print $1}')"
          python - "${out}/metadata.json" "${tree}" "${receipt_sha}" "${patch_sha}" <<'PY'
          import json, sys
          from pathlib import Path
          Path(sys.argv[1]).write_text(
              json.dumps(
                  {
                      "parent": "127191bc78daebd38548ac4e95cf9bdd141b2fb5",
                      "prepared_tree": sys.argv[2],
                      "receipt_sha256": sys.argv[3],
                      "normalized_patch_sha256": sys.argv[4],
                  },
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr314-typing-prepared
          path: ${{ runner.temp }}/prepared
          if-no-files-found: error
          retention-days: 2
