name: PR315 Ready-stage documentation preparation

on:
  push:
    branches: [agent-support/pr315-ready-followup-20260924]
    paths: [.github/workflows/pr315-ready-followup.yml]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr315-ready-followup-20260924
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      payload: ${{ steps.export.outputs.payload }}
      digest: ${{ steps.export.outputs.digest }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 5abf5a3472ca82a49e0f460b3b704a093cfb89c6
          fetch-depth: 1
          persist-credentials: false
      - name: Observe structural gaps before edits and prepare only the runbook
        run: |
          set -eu
          python3 - <<'PYDOC'
          import base64, hashlib, json, os, subprocess
          from pathlib import Path

          parent = "5abf5a3472ca82a49e0f460b3b704a093cfb89c6"
          base_tree = "d3a0bdf1f9fe64b1bbb10ebb144ae3276cbe4e6c"
          def git(*args):
              return subprocess.check_output(["git", "-c", "core.hooksPath=/dev/null", *args], text=True).strip()
          def require(condition, message):
              if not condition:
                  raise SystemExit(message)
          require(git("rev-parse", "HEAD") == parent, "wrong parent")
          require(git("rev-parse", "HEAD^{tree}") == base_tree, "wrong source tree")
          require(not git("status", "--porcelain"), "dirty source")
          edits = {'knowledge/runbooks/deliver-bounded-self-hosted-slice.md': [['2. Use a pinned `actions/checkout`, `contents: read`,\n   `persist-credentials: false`, and an explicit exact SHA.\n3. Assert exact `HEAD`, exact `HEAD^{tree}` and a clean checkout before export.\n4. Create a `git bundle`, run `git bundle verify`, retain its SHA-256 and upload\n   it as a short-lived artifact.\n5. After download, verify the artifact digest and bundle again, clone from it,\n   check out the exact commit and repeat the head/tree/clean assertions.\n', '2. Use a pinned `actions/checkout`, `contents: read`,\n   `persist-credentials: false`, `fetch-depth: 0`, and an explicit exact SHA.\n3. Require `git rev-parse --is-shallow-repository` to return `false`; assert\n   exact `HEAD`, exact `HEAD^{tree}` and a clean checkout. Verify the declared\n   preparation-parent object with `git cat-file -e <preparation-parent>^{commit}`.\n4. Create a self-contained `git bundle` from named refs for the declared source\n   and any distinct preparation parent, without excluding prerequisite history\n   or exporting unrelated refs. Run `git bundle verify`, retain its SHA-256 and\n   upload it as a short-lived artifact.\n5. After download, verify the artifact digest and verify the bundle in a\n   disposable empty Git repository. Clone into a fresh repository and require\n   `git fsck --full` to succeed. Verify the declared\n   preparation-parent object again, check out the exact source commit and repeat\n   the head/tree/clean assertions.\n\nThe preparation parent is the explicitly bound commit and may equal exported\n`HEAD`; do not substitute `HEAD^`. Bundle verification and exact HEAD/tree\nchecks alone do not establish connected history or availability of every\nrequired object. The non-shallow export and post-clone checks are both required.\n'], ['4. create the Environment-scoped secrets first;\n5. read back only secret **names/metadata** and the Environment policy; never\n   attempt to retrieve or retain secret values;\n6. only after the Environment copies are confirmed, delete broader\n   repository-level copies of the same secret names;\n7. read back repository secret names and prove those broader copies are absent.\n\nDo not reverse steps 4-6: deleting the only working credential copy before the\nEnvironment copy exists creates avoidable recovery pressure.\n', '4. follow verify-before-store below: probe the intended value and write that\n   same verified value to the Environment-scoped secret;\n5. read back only secret **names/metadata** and the Environment policy; never\n   retrieve values from GitHub or put them in retained evidence;\n6. satisfy the functional/recovery gate below before deleting broader copies;\n7. delete the authorized repository-level copies, then read back secret names\n   and prove those broader copies are absent.\n\nMetadata proves existence, not stored-value correctness or secret injection.\nWhen an admitted pre-cleanup probe is available, require a successful trusted,\nmain-only Environment-bound readback of the intended provider subject before\ncleanup. Otherwise, cleanup requires all of: the same-value\nverify-before-store evidence, an independently recoverable verified value held\nby the maintainer under existing authorized secret-management policy, and\nexplicit maintainer authorization for deferred injection verification. Keep that\nrecovery value available until the trusted Environment-bound smoke succeeds;\nGnostoa retains only the non-secret receipt and the unresolved smoke requirement.\nWithout these conditions, stop for owner disposition rather than deleting the\nlast recovery path. Check affected consumers before deleting any shared copy.\nThis does not authorize a new secret store, weaker Environment restrictions or\nbroader repository/organization copies for live execution. The live route remains\ndisabled until its Environment-only credential boundary is satisfied.\n'], ['6. revoke the superseded provider token when its identity is known and doing so\n   cannot disrupt another consumer.\n\nThis **verify-before-store** order', "6. revoke the superseded provider token when its identity is known and doing so\n   cannot disrupt another consumer.\n\nApply the same functional/recovery gate before discarding the last recoverable\nvalue or revoking the last working credential. Local probe copies are still\nunset promptly; any authorized recovery value stays in the maintainer's existing\nsecret-management path, never in Gnostoa evidence or broader Actions secrets.\n\nThis **verify-before-store** order"]]}
          originals = {path: Path(path).read_text(encoding="utf-8") for path in edits}
          # Every source observation is completed before the first document write.
          for path, replacements in edits.items():
              for number, (old, new) in enumerate(replacements, 1):
                  require(originals[path].count(old) == 1, "missing/ambiguous prior text: " + path)
                  require(new not in originals[path], "criterion already met: " + path)
                  print(f"STRUCTURAL_UNMET_BEFORE_EDIT {path}#{number}")
          for path, replacements in edits.items():
              text = originals[path]
              for old, new in replacements:
                  text = text.replace(old, new, 1)
              Path(path).write_text(text, encoding="utf-8")
          for path, replacements in edits.items():
              text = Path(path).read_text(encoding="utf-8")
              for number, (old, new) in enumerate(replacements, 1):
                  require(text.count(new) == 1 and old not in text, "structural repair failed: " + path)
                  print(f"STRUCTURAL_SATISFIED_AFTER_EDIT {path}#{number}")
          require(set(git("diff", "--name-only").splitlines()) == set(edits), "unexpected changed paths")
          subprocess.run(["git", "diff", "--check"], check=True)
          subprocess.run(["git", "-c", "core.hooksPath=/dev/null", "add", "--", *sorted(edits)], check=True)
          files = []
          for path in sorted(edits):
              raw = Path(path).read_bytes()
              files.append({"path": path, "sha256": hashlib.sha256(raw).hexdigest(), "content": base64.b64encode(raw).decode("ascii")})
          payload = {"parent": parent, "base_tree": base_tree, "tree": git("write-tree"), "files": files}
          raw = json.dumps(payload, sort_keys=True, separators=(",", ":")).encode("utf-8")
          Path(os.environ["RUNNER_TEMP"], "pr315-ready-prepared.json").write_bytes(raw)
          print("PREPARED_DOC_TREE=" + payload["tree"])
          PYDOC
      - name: Build repository OCI runtime for prepared documents
        run: ./ci/build-runtime --tag gnostoa:pr315-ready-prepared
      - name: Verify policy and fast in OCI runtime
        run: |
          set -eu
          for suite in policy fast; do
            docker run --rm --entrypoint sh \
              --mount type=bind,source="${GITHUB_WORKSPACE}",target=/workspace,readonly \
              --workdir /workspace gnostoa:pr315-ready-prepared -ec "./ci/verify ${suite}"
          done
      - name: Reverify document bytes and export prepared handoff
        id: export
        run: |
          set -eu
          python3 - <<'PYEXPORT'
          import base64, hashlib, json, os, subprocess
          from pathlib import Path
          raw = Path(os.environ["RUNNER_TEMP"], "pr315-ready-prepared.json").read_bytes()
          data = json.loads(raw)
          subprocess.run(["git", "diff", "--quiet"], check=True)
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          tree = subprocess.check_output(["git", "write-tree"], text=True).strip()
          if head != data["parent"] or tree != data["tree"]:
              raise SystemExit("post-verification identity drift")
          for item in data["files"]:
              if hashlib.sha256(Path(item["path"]).read_bytes()).hexdigest() != item["sha256"]:
                  raise SystemExit("post-verification document drift")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("payload=" + base64.b64encode(raw).decode("ascii") + "\n")
              out.write("digest=" + hashlib.sha256(raw).hexdigest() + "\n")
          print("VERIFIED_DOC_TREE=" + tree)
          print("PREPARED_PAYLOAD_SHA256=" + hashlib.sha256(raw).hexdigest())
          PYEXPORT
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr315-ready-documentation-preparation
          path: ${{ runner.temp }}/pr315-ready-prepared.json
          retention-days: 7
          if-no-files-found: error

  retain-objects:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Retain checked Git objects only; never update the target PR ref
        env:
          OBJECT_WRITE_TOKEN: ${{ github.token }}
          PREPARED_B64: ${{ needs.prepare.outputs.payload }}
          PREPARED_SHA256: ${{ needs.prepare.outputs.digest }}
        run: |
          set -eu
          python3 - <<'PYRETAIN'
          import base64, hashlib, json, os, re, urllib.error, urllib.request
          parent = "5abf5a3472ca82a49e0f460b3b704a093cfb89c6"
          base_tree = "d3a0bdf1f9fe64b1bbb10ebb144ae3276cbe4e6c"
          result_ref = "refs/heads/agent-support/pr315-ready-prepared-20260924"
          paths = {"knowledge/runbooks/deliver-bounded-self-hosted-slice.md"}
          def require(condition, message):
              if not condition:
                  raise SystemExit(message)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise RuntimeError("redirect rejected")
          opener = urllib.request.build_opener(NoRedirect())
          token = os.environ["OBJECT_WRITE_TOKEN"]
          def api(path, body=None):
              allowed = {"/pulls/315", "/git/commits/" + parent, "/git/blobs", "/git/trees", "/git/commits", "/git/refs"}
              require(path in allowed, "disallowed API resource")
              request = urllib.request.Request(
                  "https://api.github.com/repos/ktogias/gnostoa" + path,
                  data=None if body is None else json.dumps(body).encode("utf-8"),
                  headers={"Authorization": "Bearer " + token, "Accept": "application/vnd.github+json", "Content-Type": "application/json", "X-GitHub-Api-Version": "2022-11-28"},
                  method="GET" if body is None else "POST",
              )
              try:
                  with opener.open(request, timeout=30) as response:
                      raw = response.read(2000001)
                  require(len(raw) <= 2000000, "oversized API response")
                  return json.loads(raw)
              except urllib.error.HTTPError as error:
                  raise SystemExit("GitHub object API HTTP " + str(error.code)) from None
          encoded = os.environ["PREPARED_B64"]
          require(len(encoded) < 500000, "oversized payload")
          raw = base64.b64decode(encoded, validate=True)
          require(hashlib.sha256(raw).hexdigest() == os.environ["PREPARED_SHA256"], "payload digest mismatch")
          data = json.loads(raw)
          require(data["parent"] == parent and data["base_tree"] == base_tree, "wrong preparation parent")
          require(re.fullmatch(r"[0-9a-f]{40}", data["tree"]) is not None, "invalid tree")
          require(len(data["files"]) == 1 and {f["path"] for f in data["files"]} == paths, "unexpected file scope")
          require(api("/git/commits/" + parent)["tree"]["sha"] == base_tree, "source tree mismatch")
          require(api("/pulls/315")["head"]["sha"] == parent, "CONCURRENT_WRITER: target moved")
          entries = []
          for item in data["files"]:
              contents = base64.b64decode(item["content"], validate=True)
              require(0 < len(contents) < 150000, "invalid document size")
              contents.decode("utf-8")
              require(contents.endswith(b"\n") and b"\x00" not in contents, "invalid document bytes")
              require(hashlib.sha256(contents).hexdigest() == item["sha256"], "document digest mismatch")
              expected = hashlib.sha1(b"blob " + str(len(contents)).encode("ascii") + b"\0" + contents).hexdigest()
              blob = api("/git/blobs", {"content": item["content"], "encoding": "base64"})
              require(blob["sha"] == expected, "blob identity mismatch")
              entries.append({"path": item["path"], "mode": "100644", "type": "blob", "sha": blob["sha"]})
          tree = api("/git/trees", {"base_tree": base_tree, "tree": entries})
          require(tree["sha"] == data["tree"], "prepared tree mismatch")
          commit = api("/git/commits", {
              "message": "docs: make recovery bundles and credential cleanup explicit (#315)\n\nTwo Ready-stage findings; one runbook only. Structural evidence recorded before edits; repository OCI policy and fast verification passed.\n\nPreparation run: " + os.environ["GITHUB_RUN_ID"] + "\nPrepared payload SHA-256: " + hashlib.sha256(raw).hexdigest() + "\nNo runtime, policy, Environment, secret, main or Q0 change.",
              "tree": tree["sha"], "parents": [parent],
          })
          require([p["sha"] for p in commit["parents"]] == [parent], "wrong commit parent")
          require(api("/pulls/315")["head"]["sha"] == parent, "CONCURRENT_WRITER before retention")
          ref = api("/git/refs", {"ref": result_ref, "sha": commit["sha"]})
          require(ref["object"]["sha"] == commit["sha"], "result ref mismatch")
          print(json.dumps({"prepared_commit": commit["sha"], "tree": tree["sha"], "parent": parent, "result_ref": result_ref, "target_ref_unchanged": True}, sort_keys=True))
          PYRETAIN
