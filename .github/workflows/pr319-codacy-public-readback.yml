name: PR319 Codacy public readback b690

on:
  push:
    branches:
      - agent-support/pr319-codacy-b690-20260925

permissions:
  contents: read

jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read exact PR319 Codacy findings
        env:
          EXPECTED_HEAD: b690cbcc25dda953df6d06beede9c6fd13299e1d
        run: |
          set -eu
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          from pathlib import Path
          expected=os.environ["EXPECTED_HEAD"]
          root="https://app.codacy.com/api/v3/analysis/organizations/gh/ktogias/repositories/gnostoa"
          pr_url=root+"/pull-requests/319"
          def get(url):
              req=urllib.request.Request(url,headers={"Accept":"application/json","User-Agent":"gnostoa-pr319-public-readback"})
              with urllib.request.urlopen(req,timeout=30) as r:
                  raw=r.read(4_194_305)
              if len(raw)>4_194_304: raise SystemExit("CODACY_RESPONSE_TOO_LARGE")
              obj=json.loads(raw.decode())
              if not isinstance(obj,dict): raise SystemExit("CODACY_RESPONSE_NOT_OBJECT")
              return obj
          pr=get(pr_url)
          pull=pr.get("pullRequest") or {}
          if pull.get("number")!=319 or pull.get("repository")!="gnostoa": raise SystemExit("PR_IDENTITY_MISMATCH")
          if pull.get("headCommitSha")!=expected: raise SystemExit("HEAD_MISMATCH")
          if pr.get("isAnalysing") is not False: raise SystemExit("ANALYSIS_NOT_COMPLETE")
          out=[]
          for potential in (False,True):
              cursor=None
              pages=0
              while True:
                  q={"status":"new","onlyPotential":"true" if potential else "false"}
                  if cursor:q["cursor"]=cursor
                  doc=get(pr_url+"/issues?"+urllib.parse.urlencode(q))
                  pages+=1
                  if pages>100: raise SystemExit("PAGINATION_BOUND")
                  if doc.get("analyzed") is not True: raise SystemExit("LATEST_COMMIT_NOT_ANALYZED")
                  data=doc.get("data")
                  if not isinstance(data,list): raise SystemExit("ISSUES_NOT_LIST")
                  for item in data:
                      ci=item.get("commitIssue") or {}
                      pat=ci.get("patternInfo") or {}
                      tool=ci.get("toolInfo") or {}
                      out.append({
                          "issue_id":item.get("issueId") or ci.get("issueId"),
                          "delta_type":item.get("deltaType"),
                          "potential":potential,
                          "message":ci.get("message") or pat.get("title") or pat.get("id"),
                          "rule":pat.get("id"),
                          "severity":pat.get("severityLevel"),
                          "category":pat.get("category"),
                          "path":ci.get("filePath"),
                          "line":ci.get("lineNumber"),
                          "tool_name":tool.get("name"),
                          "tool_uuid":tool.get("uuid"),
                      })
                  cursor=(doc.get("pagination") or {}).get("cursor")
                  if not cursor: break
          by={}
          for item in out:
              key=item["issue_id"]
              if not isinstance(key,str) or not key: raise SystemExit("ISSUE_ID_MISSING")
              if key in by:
                  by[key]["potential"]=bool(by[key]["potential"] or item["potential"])
              else:
                  by[key]=dict(item)
          final=get(pr_url)
          if (final.get("pullRequest") or {}).get("headCommitSha")!=expected or final.get("isAnalysing") is not False:
              raise SystemExit("SUBJECT_CHANGED_DURING_READBACK")
          result={"schema":"pr319-codacy-public-readback/v1","head":expected,"count":len(by),"is_up_to_standards":final.get("isUpToStandards"),"findings":[by[k] for k in sorted(by)]}
          Path("/tmp/codacy-readback.json").write_text(json.dumps(result,sort_keys=True,indent=2)+"\n")
          print("CODACY_READBACK_OK count="+str(len(by)))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr319-codacy-readback-b690
          path: /tmp/codacy-readback.json
          if-no-files-found: error
          retention-days: 1
