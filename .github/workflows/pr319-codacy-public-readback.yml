name: PR319 Codacy public readback 9df1bd05

on:
  push:
    branches:
      - agent-support/pr319-codacy-readback-9df1bd05-20260925

permissions:
  contents: read

jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read exact PR319 Codacy findings
        env:
          EXPECTED_HEAD: 9df1bd05b3fc2d4d8ce6aa2066c18a90281f95fc
        run: |
          set -eu
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          from pathlib import Path
          expected=os.environ["EXPECTED_HEAD"]
          root="https://app.codacy.com/api/v3/analysis/organizations/gh/ktogias/repositories/gnostoa"
          pr_url=root+"/pull-requests/319"
          def get(url):
              req=urllib.request.Request(url,headers={"Accept":"application/json","User-Agent":"gnostoa-pr319-public-readback"})
              with urllib.request.urlopen(req,timeout=30) as r:
                  raw=r.read(4_194_305)
              if len(raw)>4_194_304: raise SystemExit("RESPONSE_BOUND")
              obj=json.loads(raw.decode())
              if not isinstance(obj,dict): raise SystemExit("RESPONSE_TYPE")
              return obj
          pr=get(pr_url); pull=pr.get("pullRequest") or {}
          if pull.get("number")!=319 or pull.get("repository")!="gnostoa" or pull.get("headCommitSha")!=expected:
              raise SystemExit("SUBJECT_MISMATCH")
          if pr.get("isAnalysing") is not False: raise SystemExit("ANALYSIS_NOT_COMPLETE")
          rows=[]
          for potential in (False,True):
              cursor=None
              for _ in range(100):
                  q={"status":"new","onlyPotential":"true" if potential else "false"}
                  if cursor: q["cursor"]=cursor
                  doc=get(pr_url+"/issues?"+urllib.parse.urlencode(q))
                  if doc.get("analyzed") is not True: raise SystemExit("NOT_ANALYZED")
                  data=doc.get("data")
                  if not isinstance(data,list): raise SystemExit("DATA_TYPE")
                  for item in data:
                      ci=item.get("commitIssue") or {}; pat=ci.get("patternInfo") or {}; tool=ci.get("toolInfo") or {}
                      rows.append({
                        "issue_id":item.get("issueId") or ci.get("issueId"),
                        "delta_type":item.get("deltaType"),"potential":potential,
                        "message":ci.get("message") or pat.get("title") or pat.get("id"),
                        "rule":pat.get("id"),"severity":pat.get("severityLevel"),"category":pat.get("category"),
                        "path":ci.get("filePath"),"line":ci.get("lineNumber"),
                        "tool_name":tool.get("name"),"tool_uuid":tool.get("uuid"),
                      })
                  cursor=(doc.get("pagination") or {}).get("cursor")
                  if not cursor: break
              else: raise SystemExit("PAGINATION_BOUND")
          by={}
          for item in rows:
              k=item["issue_id"]
              if not isinstance(k,str) or not k: raise SystemExit("ISSUE_ID")
              if k in by:
                  old=by[k]; old["potential"]=bool(old["potential"] or item["potential"])
                  for f,v in item.items():
                      if f!="potential" and old.get(f)!=v: raise SystemExit("CONFLICT")
              else: by[k]=dict(item)
          final=get(pr_url)
          if (final.get("pullRequest") or {}).get("headCommitSha")!=expected or final.get("isAnalysing") is not False:
              raise SystemExit("SUBJECT_CHANGED")
          result={"schema":"pr319-codacy-public-readback/v1","head":expected,"count":len(by),
                  "is_up_to_standards":final.get("isUpToStandards"),"findings":[by[k] for k in sorted(by)]}
          Path("/tmp/codacy-readback.json").write_text(json.dumps(result,sort_keys=True,indent=2)+"\n")
          print("CODACY_READBACK_OK count="+str(len(by)))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr319-codacy-readback-9df1bd05
          path: /tmp/codacy-readback.json
          if-no-files-found: error
          retention-days: 1
