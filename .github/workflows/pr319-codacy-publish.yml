name: PR319 guarded Codacy annotation publication

on:
  push:
    branches:
      - agent-support/pr319-source-0fdf-20260925

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: vf0-verification-first-15
          fetch-depth: 0
          persist-credentials: true
          path: target
      - name: Publish exact prepared tree
        working-directory: target
        env:
          EXPECTED_PARENT: 0fdfefe80407555b3e8f950677752826e7dfcea9
          EXPECTED_PARENT_TREE: 532a230115ace25ec9da9133225c5e1f1f5f7d89
          EXPECTED_TREE: e6389215ba6298d20e88915b1f05b9b1ac3fde9b
          PATCH_SHA256: 3506d26f3dc2fc0871c5659baddfd96d700a861e39c892c31d06ef96122a9081
          TARGET_BRANCH: vf0-verification-first-15
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_PARENT"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_PARENT_TREE"
          remote_head="$(git ls-remote --heads origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$EXPECTED_PARENT"
          cat > "$RUNNER_TEMP/candidate.patch.b64" <<'PATCH64'

PATCH64
          base64 -d "$RUNNER_TEMP/candidate.patch.b64" > "$RUNNER_TEMP/candidate.patch"
          echo "$PATCH_SHA256  $RUNNER_TEMP/candidate.patch" | sha256sum --check
          git apply --index "$RUNNER_TEMP/candidate.patch"
          git diff --check --cached
          actual_paths="$(git diff --cached --name-only | sort)"
          expected_paths="$(printf '%s\n' tests/test_vf0_execution.py tests/vf0_execution_oci_smoke.py tools/vf0_execution.py | sort)"
          test "$actual_paths" = "$expected_paths"
          tree="$(git write-tree)"
          test "$tree" = "$EXPECTED_TREE"
          commit="$(printf '%s\n' 'Document intentional VF0 analyzer boundaries (#15)' | git -c user.name='Konstantinos Togias' -c user.email='info@ktogias.gr' commit-tree "$tree" -p "$EXPECTED_PARENT")"
          remote_head="$(git ls-remote --heads origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$EXPECTED_PARENT"
          git push origin "$commit:refs/heads/$TARGET_BRANCH"
          printf '%s\n' "$commit" > "$RUNNER_TEMP/published-commit.txt"
          printf '%s\n' "$tree" > "$RUNNER_TEMP/published-tree.txt"
      - name: Retain publication identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr319-codacy-publication
          path: |
            ${{ runner.temp }}/published-commit.txt
            ${{ runner.temp }}/published-tree.txt
          if-no-files-found: error
          retention-days: 1
