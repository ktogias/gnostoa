name: PR319 CodeQL alert export

on:
  push:
    branches:
      - agent-support/pr319-codeql-alert-export-20260925

permissions:
  contents: read
  security-events: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Export bounded PR CodeQL alert metadata
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPOSITORY}/code-scanning/alerts?state=open&pr=319&per_page=100"
          curl --fail --silent --show-error --location \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${api}" > alerts.raw.json
          jq '
            [
              .[]
              | select(.tool.name == "CodeQL")
              | {
                  number,
                  html_url,
                  state,
                  rule: {
                    id: .rule.id,
                    name: .rule.name,
                    description: .rule.description,
                    severity: .rule.severity,
                    security_severity_level: .rule.security_severity_level,
                    tags: .rule.tags
                  },
                  instance: {
                    ref: .most_recent_instance.ref,
                    analysis_key: .most_recent_instance.analysis_key,
                    category: .most_recent_instance.category,
                    state: .most_recent_instance.state,
                    commit_sha: .most_recent_instance.commit_sha,
                    message: .most_recent_instance.message.text,
                    location: .most_recent_instance.location,
                    classifications: .most_recent_instance.classifications
                  }
                }
            ]
          ' alerts.raw.json > alerts.json
          count="$(jq 'length' alerts.json)"
          test "${count}" -gt 0
          echo "CODEQL_PR319_OPEN_ALERT_COUNT=${count}"
      - name: Upload bounded alert metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr319-codeql-alert-metadata
          path: alerts.json
          if-no-files-found: error
          retention-days: 1
