name: PR319 analyzer readback

on:
  push:
    branches:
      - agent-support/pr319-codeql-readback-20260925-v2

permissions:
  contents: read
  checks: read
  security-events: read

jobs:
  readback:
    runs-on: ubuntu-latest
    steps:
      - name: Read sanitized analyzer annotations for PR 319
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          checks = {
              "codeql": 108060962674,
              "sonar": 108060903877,
              "codacy": 108061106787,
          }

          def api(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "gnostoa-pr319-analyzer-readback",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          result = {}
          for name, check_id in checks.items():
              rows = api(
                  f"https://api.github.com/repos/{repo}/check-runs/{check_id}/annotations?per_page=100"
              )
              safe = []
              for row in rows:
                  safe.append(
                      {
                          "path": row.get("path"),
                          "start_line": row.get("start_line"),
                          "end_line": row.get("end_line"),
                          "annotation_level": row.get("annotation_level"),
                          "title": row.get("title"),
                          "message": row.get("message"),
                      }
                  )
              result[name] = safe

          out = Path(os.environ["RUNNER_TEMP"]) / "pr319-analyzer-annotations.json"
          out.write_text(json.dumps(result, sort_keys=True, indent=2) + "\n")
          print(" ".join(f"{k}={len(v)}" for k, v in sorted(result.items())))
          PY
      - name: Upload sanitized analyzer metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr319-analyzer-annotations
          path: ${{ runner.temp }}/pr319-analyzer-annotations.json
          if-no-files-found: error
          retention-days: 1
