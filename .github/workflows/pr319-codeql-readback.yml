name: PR319 CodeQL alert readback

on:
  push:
    branches:
      - agent-support/pr319-codeql-readback-20260925-v2

permissions:
  contents: read
  security-events: read

jobs:
  readback:
    runs-on: ubuntu-latest
    steps:
      - name: Read sanitized open alerts for PR 319
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          url = f"https://api.github.com/repos/{repo}/code-scanning/alerts?state=open&pr=319&per_page=100"
          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "gnostoa-pr319-readback",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              alerts = json.load(response)

          safe = []
          for alert in alerts:
              rule = alert.get("rule") or {}
              instance = alert.get("most_recent_instance") or {}
              location = instance.get("location") or {}
              tool = alert.get("tool") or {}
              safe.append(
                  {
                      "number": alert.get("number"),
                      "state": alert.get("state"),
                      "rule_id": rule.get("id"),
                      "rule_name": rule.get("name"),
                      "security_severity": rule.get("security_severity_level"),
                      "severity": rule.get("severity"),
                      "description": rule.get("description"),
                      "tool": tool.get("name"),
                      "path": location.get("path"),
                      "start_line": location.get("start_line"),
                      "end_line": location.get("end_line"),
                      "message": instance.get("message", {}).get("text") if isinstance(instance.get("message"), dict) else None,
                      "ref": instance.get("ref"),
                      "analysis_key": instance.get("analysis_key"),
                      "created_at": alert.get("created_at"),
                      "updated_at": alert.get("updated_at"),
                      "html_url": alert.get("html_url"),
                  }
              )
          out = Path(os.environ["RUNNER_TEMP"]) / "pr319-codeql-alerts.json"
          out.write_text(json.dumps(safe, sort_keys=True, indent=2) + "\n")
          print(f"sanitized_alerts={len(safe)}")
          PY
      - name: Upload sanitized alert metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr319-codeql-alerts
          path: ${{ runner.temp }}/pr319-codeql-alerts.json
          if-no-files-found: error
          retention-days: 1
