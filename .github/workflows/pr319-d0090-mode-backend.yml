name: PR319 D0090 retained-mode and backend identity

on:
  push:
    branches:
      - agent-support/pr319-d0090-mode-backend-8413198f-20260926

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout support candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: support
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout exact parent
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 8413198f86a8576fea1a2047b2e59c5ea3ce2d84
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install exact development dependencies
        working-directory: candidate
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements/development.lock
      - name: Apply bounded candidate delta
        env:
          PARENT: 8413198f86a8576fea1a2047b2e59c5ea3ce2d84
          PARENT_TREE: e98b82c07bdba99a2d3168fed8180ee2e8c765d1
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$PARENT"
          test "$(git -C candidate rev-parse HEAD^{tree})" = "$PARENT_TREE"
          test -z "$(git -C candidate status --porcelain)"
          git -C candidate fsck --full
          git -C support diff --binary --full-index "$PARENT" HEAD -- \
            knowledge/assessments/15-vf0-entrance-and-execution-plan.md \
            tests/test_vf0_contract.py \
            tests/test_vf0_execution.py \
            tools/vf0_contract.py \
            tools/vf0_execution.py > "$RUNNER_TEMP/input.patch"
          test -s "$RUNNER_TEMP/input.patch"
          git -C candidate apply --check "$RUNNER_TEMP/input.patch"
          git -C candidate apply "$RUNNER_TEMP/input.patch"
          git -C candidate diff --name-only "$PARENT" | sort > "$RUNNER_TEMP/actual-paths.txt"
          cat > "$RUNNER_TEMP/expected-paths.txt" <<'EOF'
          knowledge/assessments/15-vf0-entrance-and-execution-plan.md
          tests/test_vf0_contract.py
          tests/test_vf0_execution.py
          tools/vf0_contract.py
          tools/vf0_execution.py
          EOF
          sort -o "$RUNNER_TEMP/expected-paths.txt" "$RUNNER_TEMP/expected-paths.txt"
          cmp "$RUNNER_TEMP/expected-paths.txt" "$RUNNER_TEMP/actual-paths.txt"
          git -C candidate diff --check "$PARENT"
          sha256sum "$RUNNER_TEMP/input.patch" > "$RUNNER_TEMP/input-patch.sha256"
      - name: Run focused exact-head corpus normally and optimized
        working-directory: candidate
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m unittest tests.test_vf0_contract tests.test_vf0_execution -v
          PYTHONPATH=. python -O -m unittest tests.test_vf0_contract tests.test_vf0_execution -v
      - name: Run parent-owned ordinary D0090 prepare and verify
        env:
          PARENT: 8413198f86a8576fea1a2047b2e59c5ea3ce2d84
        working-directory: candidate
        run: |
          set -euo pipefail
          git show "$PARENT:ci/prepare-candidate" > "$RUNNER_TEMP/prepare-candidate"
          chmod 500 "$RUNNER_TEMP/prepare-candidate"
          TRUSTED_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          sh "$RUNNER_TEMP/prepare-candidate" prepare \
            --parent "$PARENT" \
            --receipt "$RUNNER_TEMP/receipt.json" \
            --focused-profile fast \
            --trusted-python "$TRUSTED_PYTHON" \
            | tee "$RUNNER_TEMP/prepare.stdout"
          python - "$RUNNER_TEMP/receipt.json" "$RUNNER_TEMP/receipt-env" <<'PY'
          import json, pathlib, sys
          doc=json.loads(pathlib.Path(sys.argv[1]).read_text())
          pathlib.Path(sys.argv[2]).write_text(
              "RECEIPT_SHA=" + doc["receipt_sha256"] + "\n"
              + "PREPARED_TREE=" + doc["prepared_tree"] + "\n"
              + "PREPARED_DIFF_SHA=" + doc["prepared_diff_sha256"] + "\n"
          )
          expected=[
              "knowledge/assessments/15-vf0-entrance-and-execution-plan.md",
              "tests/test_vf0_contract.py",
              "tests/test_vf0_execution.py",
              "tools/vf0_contract.py",
              "tools/vf0_execution.py",
          ]
          if sorted(doc["changed_paths"]) != expected:
              raise SystemExit("RECEIPT_PATH_SET_MISMATCH")
          if doc.get("focused_profile") != "fast":
              raise SystemExit("RECEIPT_PROFILE_MISMATCH")
          PY
          . "$RUNNER_TEMP/receipt-env"
          sh "$RUNNER_TEMP/prepare-candidate" verify \
            --parent "$PARENT" \
            --tree "$PREPARED_TREE" \
            --receipt "$RUNNER_TEMP/receipt.json" \
            --receipt-sha256 "$RECEIPT_SHA" \
            | tee "$RUNNER_TEMP/verify.stdout"
          git diff --binary --full-index "$PARENT" "$PREPARED_TREE" > "$RUNNER_TEMP/prepared.patch"
          ACTUAL_DIFF_SHA="sha256:$(sha256sum "$RUNNER_TEMP/prepared.patch" | awk '{print $1}')"
          test "$ACTUAL_DIFF_SHA" = "$PREPARED_DIFF_SHA"
          sha256sum "$RUNNER_TEMP/receipt.json" > "$RUNNER_TEMP/receipt-file.sha256"
          sha256sum "$RUNNER_TEMP/prepared.patch" > "$RUNNER_TEMP/prepared-patch.sha256"
      - name: Upload bounded preparation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr319-d0090-mode-backend
          path: |
            ${{ runner.temp }}/receipt.json
            ${{ runner.temp }}/prepare.stdout
            ${{ runner.temp }}/verify.stdout
            ${{ runner.temp }}/prepared.patch
            ${{ runner.temp }}/receipt-file.sha256
            ${{ runner.temp }}/prepared-patch.sha256
            ${{ runner.temp }}/input.patch
            ${{ runner.temp }}/input-patch.sha256
          if-no-files-found: error
          retention-days: 7
