name: PR319 provider-side D0090 preparation

on:
  push:
    branches:
      - agent-support/pr319-prepare-35373e5d-20260925

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 35373e5d58335bfbc55cfda9dd2754d8af0df716
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/development.lock
      - name: Install exact development dependencies
        run: |
          set -euo pipefail
          python -m pip install --only-binary=:all: --require-hashes -r requirements/development.lock
      - name: Reconstruct immutable candidate patch
        env:
          PATCH_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 -d > "$RUNNER_TEMP/candidate.patch"
          echo '068662a169c60c2dcb4bfd4d5394ecb8913a900fa0f1845b0fd5a994714be273  '"$RUNNER_TEMP/candidate.patch" | sha256sum --check
          git apply --check "$RUNNER_TEMP/candidate.patch"
          git apply "$RUNNER_TEMP/candidate.patch"
          test "$(git diff --name-only)" = "tests/test_vf0_execution.py"
          git diff --check
          test "$(git rev-parse HEAD)" = "35373e5d58335bfbc55cfda9dd2754d8af0df716"
          test "$(git rev-parse HEAD^{tree})" = "11e20f58210467f77e94750f56bbed77928bf1f4"
      - name: Parent-owned prepare and fresh verify
        run: |
          set -euo pipefail
          parent='35373e5d58335bfbc55cfda9dd2754d8af0df716'
          trusted_python="$(command -v python)"
          wrapper="$RUNNER_TEMP/prepare-wrapper"
          git -c core.hooksPath=/dev/null show "$parent:ci/prepare-candidate" > "$wrapper"
          sh "$wrapper" prepare             --parent "$parent"             --receipt "$RUNNER_TEMP/receipt.json"             --focused-profile fast             --trusted-python "$trusted_python"             > "$RUNNER_TEMP/prepare.log"
          tree="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["prepared_tree"])' "$RUNNER_TEMP/receipt.json")"
          receipt_sha="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["receipt_sha256"])' "$RUNNER_TEMP/receipt.json")"
          raw_sha="$(sha256sum "$RUNNER_TEMP/receipt.json" | cut -d' ' -f1)"
          printf '%s\n' "$tree" > "$RUNNER_TEMP/prepared-tree.txt"
          printf '%s\n' "$receipt_sha" > "$RUNNER_TEMP/receipt-protocol-sha256.txt"
          printf '%s\n' "$raw_sha" > "$RUNNER_TEMP/receipt-file-sha256.txt"
          sh "$wrapper" verify             --parent "$parent"             --tree "$tree"             --receipt "$RUNNER_TEMP/receipt.json"             --receipt-sha256 "$receipt_sha"             --trusted-python "$trusted_python"             > "$RUNNER_TEMP/verify.log"
          git diff --binary "$parent" "$tree" > "$RUNNER_TEMP/prepared.patch"
          test "$(git diff --name-only "$parent" "$tree")" = "tests/test_vf0_execution.py"
          sha256sum "$RUNNER_TEMP/prepared.patch" > "$RUNNER_TEMP/prepared.patch.sha256"
          git show "$tree:tests/test_vf0_execution.py" > "$RUNNER_TEMP/prepared-test_vf0_execution.py"
          sha256sum "$RUNNER_TEMP/prepared-test_vf0_execution.py" > "$RUNNER_TEMP/prepared-test_vf0_execution.py.sha256"
          cat "$RUNNER_TEMP/prepare.log"
          cat "$RUNNER_TEMP/verify.log"
      - name: Upload non-secret preparation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr319-d0090-35373e5d
          path: |
            ${{ runner.temp }}/candidate.patch
            ${{ runner.temp }}/prepared.patch
            ${{ runner.temp }}/prepared.patch.sha256
            ${{ runner.temp }}/prepared-test_vf0_execution.py
            ${{ runner.temp }}/prepared-test_vf0_execution.py.sha256
            ${{ runner.temp }}/receipt.json
            ${{ runner.temp }}/receipt-protocol-sha256.txt
            ${{ runner.temp }}/receipt-file-sha256.txt
            ${{ runner.temp }}/prepared-tree.txt
            ${{ runner.temp }}/prepare.log
            ${{ runner.temp }}/verify.log
          if-no-files-found: error
          retention-days: 1
