name: PR319 publish exact prepared review batch

on:
  push:
    branches:
      - agent-support/pr319-publish-4cf-batch-20260926

permissions:
  contents: write

jobs:
  transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout support payload
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent-support/pr319-publish-4cf-batch-20260926
          path: support
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout exact candidate parent
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 4cf86acb854d48f458cee8173ee49e12a1aafe7d
          path: candidate
          fetch-depth: 0
          persist-credentials: true
      - name: Reconstruct prepared tree and publish support commit
        working-directory: candidate
        env:
          PARENT: 4cf86acb854d48f458cee8173ee49e12a1aafe7d
          PARENT_TREE: a5afe5d1c88040cf3ade5f0519bfcacaa2849b20
          EXPECTED_TREE: 1416e107b3a3edbc62a7b1bc55b342a280007168
          EXPECTED_GZIP_SHA256: 8703c7248a82255ed25b389ee33a97d0dbef148170b43d4f811fc667faa69741
          EXPECTED_PATCH_SHA256: 5aa55934c15392abccf9c78d5b79c99b68b75d310c4baf99b10495908bd80ba4
          TARGET_BRANCH: agent-support/pr319-prepared-4cf-batch-20260926
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PARENT"
          test "$(git rev-parse HEAD^{tree})" = "$PARENT_TREE"
          test -z "$(git status --porcelain)"
          base64 -d ../support/.github/support/pr319-batch.patch.gz.b64 > "$RUNNER_TEMP/candidate.patch.gz"
          printf '%s  %s\n' "$EXPECTED_GZIP_SHA256" "$RUNNER_TEMP/candidate.patch.gz" | sha256sum -c -
          gzip -dc "$RUNNER_TEMP/candidate.patch.gz" > "$RUNNER_TEMP/candidate.patch"
          printf '%s  %s\n' "$EXPECTED_PATCH_SHA256" "$RUNNER_TEMP/candidate.patch" | sha256sum -c -
          git apply --index --whitespace=nowarn "$RUNNER_TEMP/candidate.patch"
          git diff --cached --check
          expected_paths="$(cat <<'EOF'
knowledge/assessments/15-vf0-entrance-and-execution-plan.md
knowledge/assessments/319-review-convergence-admission-interpretation-drift-rca.md
tests/test_vf0_contract.py
tests/test_vf0_execution.py
tests/vf0_execution_oci_smoke.py
tools/vf0_execution.py
EOF
)"
          test "$(git diff --cached --name-only)" = "$expected_paths"
          tree="$(git write-tree)"
          test "$tree" = "$EXPECTED_TREE"
          export GIT_AUTHOR_NAME='gnostoa-agent'
          export GIT_AUTHOR_EMAIL='gnostoa-agent@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          export GIT_AUTHOR_DATE='2026-09-26T00:00:00+03:00'
          export GIT_COMMITTER_DATE="$GIT_AUTHOR_DATE"
          commit="$(printf '%s\n' 'fix: converge VF0 bounded execution review findings (#15)' | git commit-tree "$tree" -p "$PARENT")"
          test "$(git rev-parse "$commit^{tree}")" = "$EXPECTED_TREE"
          test "$(git rev-parse "$commit^")" = "$PARENT"
          git push origin "$commit:refs/heads/$TARGET_BRANCH"
          printf 'commit=%s\ntree=%s\nparent=%s\n' "$commit" "$tree" "$PARENT" | tee "$RUNNER_TEMP/result.txt"
      - name: Upload transport result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr319-prepared-4cf-batch-transport
          path: ${{ runner.temp }}/result.txt
          if-no-files-found: error
          retention-days: 1
