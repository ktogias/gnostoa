name: PR319 exact 9df source export

on:
  push:
    branches:
      - agent-support/pr319-source-9df-20260925

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 9df1bd05b3fc2d4d8ce6aa2066c18a90281f95fc
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact source and create bundle
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "9df1bd05b3fc2d4d8ce6aa2066c18a90281f95fc"
          test "$(git rev-parse HEAD^{tree})" = "e6389215ba6298d20e88915b1f05b9b1ac3fde9b"
          test "$(git rev-parse --is-shallow-repository)" = "false"
          test -z "$(git status --porcelain)"
          git fsck --full
          git update-ref refs/heads/pr319-source-export 9df1bd05b3fc2d4d8ce6aa2066c18a90281f95fc
          git bundle create "$RUNNER_TEMP/source.bundle" refs/heads/pr319-source-export
          git bundle verify "$RUNNER_TEMP/source.bundle"
          sha256sum "$RUNNER_TEMP/source.bundle" > "$RUNNER_TEMP/source.bundle.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr319-source-9df
          path: |
            ${{ runner.temp }}/source.bundle
            ${{ runner.temp }}/source.bundle.sha256
          if-no-files-found: error
          retention-days: 1
