name: PR319 exact source export 518e4e8d

on:
  push:
    branches:
      - agent-support/pr319-source-518e4e8d-20260925

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 518e4e8ddaa731eb9635715033d34282e47e5542
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact source and create bundle
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "518e4e8ddaa731eb9635715033d34282e47e5542"
          test "$(git rev-parse HEAD^{tree})" = "7f768c5b88ca4c4ecdcf156c517af95ef8870918"
          test "$(git rev-parse --is-shallow-repository)" = "false"
          test -z "$(git status --porcelain)"
          git fsck --full
          git update-ref refs/heads/pr319-source-export 518e4e8ddaa731eb9635715033d34282e47e5542
          git bundle create "$RUNNER_TEMP/source.bundle" refs/heads/pr319-source-export
          git bundle verify "$RUNNER_TEMP/source.bundle"
          sha256sum "$RUNNER_TEMP/source.bundle" > "$RUNNER_TEMP/source.bundle.sha256"
          printf '%s\n' '518e4e8ddaa731eb9635715033d34282e47e5542' > "$RUNNER_TEMP/head.txt"
          printf '%s\n' '7f768c5b88ca4c4ecdcf156c517af95ef8870918' > "$RUNNER_TEMP/tree.txt"
      - name: Upload exact source bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr319-source-518e4e8d
          path: |
            ${{ runner.temp }}/source.bundle
            ${{ runner.temp }}/source.bundle.sha256
            ${{ runner.temp }}/head.txt
            ${{ runner.temp }}/tree.txt
          if-no-files-found: error
          retention-days: 1
