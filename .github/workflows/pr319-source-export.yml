name: PR319 exact source export b2d4f99d

on:
  push:
    branches:
      - agent-support/pr319-source-b2d4f99d-20260926

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: b2d4f99d29a457d1b8a55fb4b5e4cd6224afe2a6
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact source and create bundle
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "b2d4f99d29a457d1b8a55fb4b5e4cd6224afe2a6"
          test "$(git rev-parse HEAD^{tree})" = "20f2d50193d7117305c0d2c6d59e2aa0d95357ba"
          test "$(git rev-parse --is-shallow-repository)" = "false"
          test -z "$(git status --porcelain)"
          git fsck --full
          git update-ref refs/heads/pr319-source-export b2d4f99d29a457d1b8a55fb4b5e4cd6224afe2a6
          git bundle create "$RUNNER_TEMP/source.bundle" refs/heads/pr319-source-export
          git bundle verify "$RUNNER_TEMP/source.bundle"
          sha256sum "$RUNNER_TEMP/source.bundle" > "$RUNNER_TEMP/source.bundle.sha256"
          printf '%s\n' 'b2d4f99d29a457d1b8a55fb4b5e4cd6224afe2a6' > "$RUNNER_TEMP/head.txt"
          printf '%s\n' '20f2d50193d7117305c0d2c6d59e2aa0d95357ba' > "$RUNNER_TEMP/tree.txt"
      - name: Upload exact source bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr319-source-b2d4f99d
          path: |
            ${{ runner.temp }}/source.bundle
            ${{ runner.temp }}/source.bundle.sha256
            ${{ runner.temp }}/head.txt
            ${{ runner.temp }}/tree.txt
          if-no-files-found: error
          retention-days: 1
