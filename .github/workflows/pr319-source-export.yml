name: PR319 exact source export 55119472

on:
  push:
    branches:
      - agent-support/pr319-source-55119472-20260925

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 551194720c74a2325ad6843d3ac68b33b196fd91
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact source and create bundle
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "551194720c74a2325ad6843d3ac68b33b196fd91"
          test "$(git rev-parse HEAD^{tree})" = "c6e1fb5cdd787a2f454f11555b7d3344d3ee5de5"
          test "$(git rev-parse --is-shallow-repository)" = "false"
          test -z "$(git status --porcelain)"
          git fsck --full
          git update-ref refs/heads/pr319-source-export 551194720c74a2325ad6843d3ac68b33b196fd91
          git bundle create "$RUNNER_TEMP/source.bundle" refs/heads/pr319-source-export
          git bundle verify "$RUNNER_TEMP/source.bundle"
          sha256sum "$RUNNER_TEMP/source.bundle" > "$RUNNER_TEMP/source.bundle.sha256"
          printf '%s\n' '551194720c74a2325ad6843d3ac68b33b196fd91' > "$RUNNER_TEMP/head.txt"
          printf '%s\n' 'c6e1fb5cdd787a2f454f11555b7d3344d3ee5de5' > "$RUNNER_TEMP/tree.txt"
      - name: Upload exact source bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr319-source-55119472
          path: |
            ${{ runner.temp }}/source.bundle
            ${{ runner.temp }}/source.bundle.sha256
            ${{ runner.temp }}/head.txt
            ${{ runner.temp }}/tree.txt
          if-no-files-found: error
          retention-days: 1
