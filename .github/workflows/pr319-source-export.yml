name: PR319 exact source export bc9199f3

on:
  push:
    branches:
      - agent-support/pr319-source-bc9199f3-20260925

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: bc9199f3ff9cae269e3d45ca6d231300aa2b8421
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact source and create bundle
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "bc9199f3ff9cae269e3d45ca6d231300aa2b8421"
          test "$(git rev-parse HEAD^{tree})" = "2f6d9720e13ba48b0da81b914f6cf931c63e0e07"
          test "$(git rev-parse --is-shallow-repository)" = "false"
          test -z "$(git status --porcelain)"
          git fsck --full
          git update-ref refs/heads/pr319-source-export bc9199f3ff9cae269e3d45ca6d231300aa2b8421
          git bundle create "$RUNNER_TEMP/source.bundle" refs/heads/pr319-source-export
          git bundle verify "$RUNNER_TEMP/source.bundle"
          sha256sum "$RUNNER_TEMP/source.bundle" > "$RUNNER_TEMP/source.bundle.sha256"
          printf '%s\n' 'bc9199f3ff9cae269e3d45ca6d231300aa2b8421' > "$RUNNER_TEMP/head.txt"
          printf '%s\n' '2f6d9720e13ba48b0da81b914f6cf931c63e0e07' > "$RUNNER_TEMP/tree.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr319-source-bc9199f3
          path: |
            ${{ runner.temp }}/source.bundle
            ${{ runner.temp }}/source.bundle.sha256
            ${{ runner.temp }}/head.txt
            ${{ runner.temp }}/tree.txt
          if-no-files-found: error
          retention-days: 1
