name: PR319 exact source export b690cbcc

on:
  push:
    branches:
      - agent-support/pr319-source-b690cbcc-20260925

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: b690cbcc25dda953df6d06beede9c6fd13299e1d
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact source and create bundle
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "b690cbcc25dda953df6d06beede9c6fd13299e1d"
          test "$(git rev-parse HEAD^{tree})" = "74d4fdaed7666192d43246d32d04fbe5e98f6949"
          test "$(git rev-parse --is-shallow-repository)" = "false"
          test -z "$(git status --porcelain)"
          git fsck --full
          git update-ref refs/heads/pr319-source-export b690cbcc25dda953df6d06beede9c6fd13299e1d
          git bundle create "$RUNNER_TEMP/source.bundle" refs/heads/pr319-source-export
          git bundle verify "$RUNNER_TEMP/source.bundle"
          sha256sum "$RUNNER_TEMP/source.bundle" > "$RUNNER_TEMP/source.bundle.sha256"
          printf '%s\n' 'b690cbcc25dda953df6d06beede9c6fd13299e1d' > "$RUNNER_TEMP/head.txt"
          printf '%s\n' '74d4fdaed7666192d43246d32d04fbe5e98f6949' > "$RUNNER_TEMP/tree.txt"
      - name: Upload exact source bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr319-source-b690cbcc
          path: |
            ${{ runner.temp }}/source.bundle
            ${{ runner.temp }}/source.bundle.sha256
            ${{ runner.temp }}/head.txt
            ${{ runner.temp }}/tree.txt
          if-no-files-found: error
          retention-days: 1
