name: PR319 exact source export d2b1a1e6

on:
  push:
    branches:
      - agent-support/pr319-source-d2b1a1e6-20260925

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: d2b1a1e6c1e6a7d6cda479dd7fc1a8752c653793
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact source and create bundle
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "d2b1a1e6c1e6a7d6cda479dd7fc1a8752c653793"
          test "$(git rev-parse HEAD^{tree})" = "8ff237528f3dc6b7aa6d2600666ce545acd29bf9"
          test "$(git rev-parse --is-shallow-repository)" = "false"
          test -z "$(git status --porcelain)"
          git fsck --full
          git update-ref refs/heads/pr319-source-export d2b1a1e6c1e6a7d6cda479dd7fc1a8752c653793
          git bundle create "$RUNNER_TEMP/source.bundle" refs/heads/pr319-source-export
          git bundle verify "$RUNNER_TEMP/source.bundle"
          sha256sum "$RUNNER_TEMP/source.bundle" > "$RUNNER_TEMP/source.bundle.sha256"
          printf '%s\n' 'd2b1a1e6c1e6a7d6cda479dd7fc1a8752c653793' > "$RUNNER_TEMP/head.txt"
          printf '%s\n' '8ff237528f3dc6b7aa6d2600666ce545acd29bf9' > "$RUNNER_TEMP/tree.txt"
      - name: Upload exact source bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr319-source-d2b1a1e6
          path: |
            ${{ runner.temp }}/source.bundle
            ${{ runner.temp }}/source.bundle.sha256
            ${{ runner.temp }}/head.txt
            ${{ runner.temp }}/tree.txt
          if-no-files-found: error
          retention-days: 1
