name: PR319 exact source export fa2cf1cd

on:
  push:
    branches:
      - agent-support/pr319-source-fa2cf1cd-20260925

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fa2cf1cdc5028e4bf8c442dcc2530ef8496aa96f
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact source and create bundle
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "fa2cf1cdc5028e4bf8c442dcc2530ef8496aa96f"
          test "$(git rev-parse HEAD^{tree})" = "77a6f71eb86faf0b02b19b4d59ef5ca99a1d3cf6"
          test "$(git rev-parse --is-shallow-repository)" = "false"
          test -z "$(git status --porcelain)"
          git fsck --full
          git update-ref refs/heads/pr319-source-export fa2cf1cdc5028e4bf8c442dcc2530ef8496aa96f
          git bundle create "$RUNNER_TEMP/source.bundle" refs/heads/pr319-source-export
          git bundle verify "$RUNNER_TEMP/source.bundle"
          sha256sum "$RUNNER_TEMP/source.bundle" > "$RUNNER_TEMP/source.bundle.sha256"
          printf '%s\n' 'fa2cf1cdc5028e4bf8c442dcc2530ef8496aa96f' > "$RUNNER_TEMP/head.txt"
          printf '%s\n' '77a6f71eb86faf0b02b19b4d59ef5ca99a1d3cf6' > "$RUNNER_TEMP/tree.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr319-source-fa2cf1cd
          path: |
            ${{ runner.temp }}/source.bundle
            ${{ runner.temp }}/source.bundle.sha256
            ${{ runner.temp }}/head.txt
            ${{ runner.temp }}/tree.txt
          if-no-files-found: error
          retention-days: 1
