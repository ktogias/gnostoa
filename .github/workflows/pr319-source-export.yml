name: PR319 exact source export 1b07b02b

on:
  push:
    branches:
      - agent-support/pr319-source-1b07b02b-20260925

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 1b07b02b4e866ce5b24bea8a74b766b368552078
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact source and create bundle
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "1b07b02b4e866ce5b24bea8a74b766b368552078"
          test "$(git rev-parse HEAD^{tree})" = "af5a88714ccc5f400ff90d01da5c05f4be440072"
          test "$(git rev-parse --is-shallow-repository)" = "false"
          test -z "$(git status --porcelain)"
          git fsck --full
          git update-ref refs/heads/pr319-source-export 1b07b02b4e866ce5b24bea8a74b766b368552078
          git bundle create "$RUNNER_TEMP/source.bundle" refs/heads/pr319-source-export
          git bundle verify "$RUNNER_TEMP/source.bundle"
          sha256sum "$RUNNER_TEMP/source.bundle" > "$RUNNER_TEMP/source.bundle.sha256"
          printf '%s\n' '1b07b02b4e866ce5b24bea8a74b766b368552078' > "$RUNNER_TEMP/head.txt"
          printf '%s\n' 'af5a88714ccc5f400ff90d01da5c05f4be440072' > "$RUNNER_TEMP/tree.txt"
      - name: Upload exact source bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr319-source-1b07b02b
          path: |
            ${{ runner.temp }}/source.bundle
            ${{ runner.temp }}/source.bundle.sha256
            ${{ runner.temp }}/head.txt
            ${{ runner.temp }}/tree.txt
          if-no-files-found: error
          retention-days: 1
