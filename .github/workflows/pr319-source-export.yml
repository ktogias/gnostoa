name: PR319 exact source export c350e81a

on:
  push:
    branches:
      - agent-support/pr319-source-c350e81a-20260925

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: c350e81a9cdda6f1f782431e51b97fb667a665ac
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact source and create bundle
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "c350e81a9cdda6f1f782431e51b97fb667a665ac"
          test "$(git rev-parse HEAD^{tree})" = "bec108566e716eed037b4841f98c43735f490031"
          test "$(git rev-parse --is-shallow-repository)" = "false"
          test -z "$(git status --porcelain)"
          git fsck --full
          git update-ref refs/heads/pr319-source-export c350e81a9cdda6f1f782431e51b97fb667a665ac
          git bundle create "$RUNNER_TEMP/source.bundle" refs/heads/pr319-source-export
          git bundle verify "$RUNNER_TEMP/source.bundle"
          sha256sum "$RUNNER_TEMP/source.bundle" > "$RUNNER_TEMP/source.bundle.sha256"
          printf '%s\n' 'c350e81a9cdda6f1f782431e51b97fb667a665ac' > "$RUNNER_TEMP/head.txt"
          printf '%s\n' 'bec108566e716eed037b4841f98c43735f490031' > "$RUNNER_TEMP/tree.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr319-source-c350e81a
          path: |
            ${{ runner.temp }}/source.bundle
            ${{ runner.temp }}/source.bundle.sha256
            ${{ runner.temp }}/head.txt
            ${{ runner.temp }}/tree.txt
          if-no-files-found: error
          retention-days: 1
