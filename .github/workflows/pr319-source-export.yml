name: PR319 exact source export 35373e5d

on:
  push:
    branches:
      - agent-support/pr319-source-35373e5d-20260925

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 35373e5d58335bfbc55cfda9dd2754d8af0df716
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact source and create bundle
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "35373e5d58335bfbc55cfda9dd2754d8af0df716"
          test "$(git rev-parse HEAD^{tree})" = "11e20f58210467f77e94750f56bbed77928bf1f4"
          test "$(git rev-parse --is-shallow-repository)" = "false"
          test -z "$(git status --porcelain)"
          git fsck --full
          git update-ref refs/heads/pr319-source-export 35373e5d58335bfbc55cfda9dd2754d8af0df716
          git bundle create "$RUNNER_TEMP/source.bundle" refs/heads/pr319-source-export
          git bundle verify "$RUNNER_TEMP/source.bundle"
          sha256sum "$RUNNER_TEMP/source.bundle" > "$RUNNER_TEMP/source.bundle.sha256"
          printf '%s\n' '35373e5d58335bfbc55cfda9dd2754d8af0df716' > "$RUNNER_TEMP/head.txt"
          printf '%s\n' '11e20f58210467f77e94750f56bbed77928bf1f4' > "$RUNNER_TEMP/tree.txt"
      - name: Upload exact source bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr319-source-35373e5d
          path: |
            ${{ runner.temp }}/source.bundle
            ${{ runner.temp }}/source.bundle.sha256
            ${{ runner.temp }}/head.txt
            ${{ runner.temp }}/tree.txt
          if-no-files-found: error
          retention-days: 1
