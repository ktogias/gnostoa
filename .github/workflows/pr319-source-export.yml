name: PR319 exact source export da05e976

on:
  push:
    branches:
      - agent-support/pr319-source-da05e976-20260925

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: da05e97699a475f0bb8b7c649f77083ace1c45d3
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact source and create bundle
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "da05e97699a475f0bb8b7c649f77083ace1c45d3"
          test "$(git rev-parse HEAD^{tree})" = "938b14b9eff5ddcebd1200d4695897062e32cc87"
          test "$(git rev-parse --is-shallow-repository)" = "false"
          test -z "$(git status --porcelain)"
          git fsck --full
          git update-ref refs/heads/pr319-source-export da05e97699a475f0bb8b7c649f77083ace1c45d3
          git bundle create "$RUNNER_TEMP/source.bundle" refs/heads/pr319-source-export
          git bundle verify "$RUNNER_TEMP/source.bundle"
          sha256sum "$RUNNER_TEMP/source.bundle" > "$RUNNER_TEMP/source.bundle.sha256"
          printf '%s\n' 'da05e97699a475f0bb8b7c649f77083ace1c45d3' > "$RUNNER_TEMP/head.txt"
          printf '%s\n' '938b14b9eff5ddcebd1200d4695897062e32cc87' > "$RUNNER_TEMP/tree.txt"
      - name: Upload exact source bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr319-source-da05e976
          path: |
            ${{ runner.temp }}/source.bundle
            ${{ runner.temp }}/source.bundle.sha256
            ${{ runner.temp }}/head.txt
            ${{ runner.temp }}/tree.txt
          if-no-files-found: error
          retention-days: 1
