name: PR319 exact source export 6c0bfeee

on:
  push:
    branches:
      - agent-support/pr319-source-6c0bfeee-20260926

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 6c0bfeee0405a6bbdae8b812f5e15fc4f16f6d55
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact source and create bundle
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "6c0bfeee0405a6bbdae8b812f5e15fc4f16f6d55"
          test "$(git rev-parse HEAD^{tree})" = "7cd22e831853633143a93e54dcb7f0fa6a871748"
          test "$(git rev-parse --is-shallow-repository)" = "false"
          test -z "$(git status --porcelain)"
          git fsck --full
          git update-ref refs/heads/pr319-source-export 6c0bfeee0405a6bbdae8b812f5e15fc4f16f6d55
          git bundle create "$RUNNER_TEMP/source.bundle" refs/heads/pr319-source-export
          git bundle verify "$RUNNER_TEMP/source.bundle"
          sha256sum "$RUNNER_TEMP/source.bundle" > "$RUNNER_TEMP/source.bundle.sha256"
          printf '%s\n' '6c0bfeee0405a6bbdae8b812f5e15fc4f16f6d55' > "$RUNNER_TEMP/head.txt"
          printf '%s\n' '7cd22e831853633143a93e54dcb7f0fa6a871748' > "$RUNNER_TEMP/tree.txt"
      - name: Upload exact source bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr319-source-6c0bfeee
          path: |
            ${{ runner.temp }}/source.bundle
            ${{ runner.temp }}/source.bundle.sha256
            ${{ runner.temp }}/head.txt
            ${{ runner.temp }}/tree.txt
          if-no-files-found: error
          retention-days: 1
