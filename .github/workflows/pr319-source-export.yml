name: PR319 exact source export 29900529

on:
  push:
    branches:
      - agent-support/pr319-source-29900529-20260926

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 29900529b2b8802f66ce6100cd86d96ba42e26d2
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact source and create bundle
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "29900529b2b8802f66ce6100cd86d96ba42e26d2"
          test "$(git rev-parse HEAD^{tree})" = "8d146428d5debfdff7910efd0944072c00296309"
          test "$(git rev-parse --is-shallow-repository)" = "false"
          test -z "$(git status --porcelain)"
          git fsck --full
          git update-ref refs/heads/pr319-source-export 29900529b2b8802f66ce6100cd86d96ba42e26d2
          git bundle create "$RUNNER_TEMP/source.bundle" refs/heads/pr319-source-export
          git bundle verify "$RUNNER_TEMP/source.bundle"
          sha256sum "$RUNNER_TEMP/source.bundle" > "$RUNNER_TEMP/source.bundle.sha256"
          printf '%s\n' '29900529b2b8802f66ce6100cd86d96ba42e26d2' > "$RUNNER_TEMP/head.txt"
          printf '%s\n' '8d146428d5debfdff7910efd0944072c00296309' > "$RUNNER_TEMP/tree.txt"
      - name: Upload exact source bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr319-source-29900529
          path: |
            ${{ runner.temp }}/source.bundle
            ${{ runner.temp }}/source.bundle.sha256
            ${{ runner.temp }}/head.txt
            ${{ runner.temp }}/tree.txt
          if-no-files-found: error
          retention-days: 1
