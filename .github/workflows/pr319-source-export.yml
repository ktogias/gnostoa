name: PR319 exact source export 87c408ad

on:
  push:
    branches:
      - agent-support/pr319-source-87c408ad-20260926

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 87c408ad708388e5a3a6594f9aadd7f83ec182c3
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact source and create bundle
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "87c408ad708388e5a3a6594f9aadd7f83ec182c3"
          test "$(git rev-parse HEAD^{tree})" = "0d2336b60d8a66734316ee68d64d6e5b93555886"
          test "$(git rev-parse --is-shallow-repository)" = "false"
          test -z "$(git status --porcelain)"
          git fsck --full
          git update-ref refs/heads/pr319-source-export 87c408ad708388e5a3a6594f9aadd7f83ec182c3
          git bundle create "$RUNNER_TEMP/source.bundle" refs/heads/pr319-source-export
          git bundle verify "$RUNNER_TEMP/source.bundle"
          sha256sum "$RUNNER_TEMP/source.bundle" > "$RUNNER_TEMP/source.bundle.sha256"
          printf '%s\n' '87c408ad708388e5a3a6594f9aadd7f83ec182c3' > "$RUNNER_TEMP/head.txt"
          printf '%s\n' '0d2336b60d8a66734316ee68d64d6e5b93555886' > "$RUNNER_TEMP/tree.txt"
      - name: Upload exact source bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr319-source-87c408ad
          path: |
            ${{ runner.temp }}/source.bundle
            ${{ runner.temp }}/source.bundle.sha256
            ${{ runner.temp }}/head.txt
            ${{ runner.temp }}/tree.txt
          if-no-files-found: error
          retention-days: 1
