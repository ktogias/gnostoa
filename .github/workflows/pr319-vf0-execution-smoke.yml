name: PR319 exact-head VF0 execution smoke 33fd38b9

on:
  push:
    branches:
      - agent-support/pr319-oci-smoke-33fd38b9-20260925

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 33fd38b966fd3f8707bc468b8e7f0adb841e691a
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact source
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "33fd38b966fd3f8707bc468b8e7f0adb841e691a"
          test "$(git rev-parse HEAD^{tree})" = "ac27d9e45c58c9941f4dc320716ec4df95ae575e"
          test "$(git rev-parse --is-shallow-repository)" = "false"
          test -z "$(git status --porcelain)"
          git fsck --full
          sha256sum tools/vf0_execution.py tests/test_vf0_execution.py tests/vf0_execution_oci_smoke.py > "$RUNNER_TEMP/source.sha256"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Pull fixed image and run live component smoke
        working-directory: candidate
        run: |
          set -euo pipefail
          IMAGE='ghcr.io/ktogias/gnostoa@sha256:f89bf32c0c4b86bac71fa008579b2385e6ae39bf4822f685479c4f2cc22bfca4'
          docker pull "$IMAGE"
          PYTHONPATH=. python tests/vf0_execution_oci_smoke.py --image "$IMAGE" --output "$RUNNER_TEMP/result.json"
          test -s "$RUNNER_TEMP/result.json"
          python - "$RUNNER_TEMP/result.json" "33fd38b966fd3f8707bc468b8e7f0adb841e691a" "ac27d9e45c58c9941f4dc320716ec4df95ae575e" <<'PY'
          import json, pathlib, sys
          path, head, tree = sys.argv[1:]
          doc=json.loads(pathlib.Path(path).read_text())
          assert doc["status"]=="PASS"
          assert doc["scope"]=="COMPONENT_CONFORMANCE_ONLY"
          assert doc["production_receipt_issued"] is False
          assert doc["producer_admitted"] is False
          assert doc["compliance_established"] is False
          assert doc["vf0_active"] is False
          meta={"subject_head":head,"subject_tree":tree,"result":doc}
          pathlib.Path(path).write_text(json.dumps(meta,sort_keys=True,separators=(",",":"))+"\n")
          PY
          sha256sum "$RUNNER_TEMP/result.json" > "$RUNNER_TEMP/result.sha256"
      - name: Upload bounded result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr319-vf0-execution-smoke-33fd38b9
          path: |
            ${{ runner.temp }}/result.json
            ${{ runner.temp }}/result.sha256
            ${{ runner.temp }}/source.sha256
          if-no-files-found: error
          retention-days: 7
