name: PR319 exact-head VF0 isolation diagnostic 22812485

on:
  push:
    branches:
      - agent-support/pr319-oci-smoke-22812485-20260926

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 22812485f8fb9d296e49020bbb234c2e8a721f20
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Diagnose exact isolation outcome
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "22812485f8fb9d296e49020bbb234c2e8a721f20"
          test "$(git rev-parse HEAD^{tree})" = "7783c317a8246375a7a647fd79fbca8232d59888"
          IMAGE='ghcr.io/ktogias/gnostoa@sha256:f89bf32c0c4b86bac71fa008579b2385e6ae39bf4822f685479c4f2cc22bfca4'
          docker pull "$IMAGE" >/dev/null
          IMAGE="$IMAGE" PYTHONPATH=. python - <<'PY'
          import json, os, runpy, tempfile
          from pathlib import Path
          ns=runpy.run_path("tests/vf0_execution_oci_smoke.py")
          image=os.environ["IMAGE"]
          probe=ns["_probe_read_only_behavior"](image)
          backend=ns["DockerBackend"](image)
          limits=ns["ExecutionLimits"](timeout_seconds=5.0,output_bytes=65_536)
          evidence=ns["EvidenceFile"](ns["EVIDENCE_PATH"],ns["EVIDENCE"])
          command=(
              "/usr/local/bin/python3","-I","-S","-c",
              ns["_ISOLATED_SUBJECT_BOOTSTRAP"],
              "/workspace/"+ns["EVIDENCE_PATH"],
          )
          with tempfile.TemporaryDirectory(prefix="vf0-execution-diag-") as td:
              repo=Path(td)/"fixture"; repo.mkdir(mode=0o755)
              ns["_git"](repo,"init","--quiet")
              ns["_commit"](repo,"one")
              subject=ns["_commit"](repo,"two")
              obs=ns["execute"](repo,subject,[evidence],[*command,"isolation"],backend,limits)
              result={
                  "probe":probe,
                  "termination":obs.capture.termination,
                  "exit_code":obs.capture.exit_code,
                  "stdout":obs.capture.stdout.decode("utf-8","replace"),
                  "stderr":obs.capture.stderr.decode("utf-8","replace"),
                  "subject_unchanged":obs.subject_unchanged,
                  "before_after_equal":obs.before_manifest_sha256==obs.after_manifest_sha256,
              }
              print(json.dumps(result,sort_keys=True))
              Path(os.environ["RUNNER_TEMP"]).joinpath("diagnostic.json").write_text(json.dumps(result,sort_keys=True)+"\n")
          PY
      - name: Upload bounded diagnostic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr319-isolation-diagnostic-22812485
          path: ${{ runner.temp }}/diagnostic.json
          if-no-files-found: error
          retention-days: 1
