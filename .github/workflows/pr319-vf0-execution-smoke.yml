name: PR319 exact-head VF0 execution smoke 518e4e8d
on:
  push:
    branches: [agent-support/pr319-oci-smoke-518e4e8d-20260925]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 518e4e8ddaa731eb9635715033d34282e47e5542
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Bind exact source and run live smoke
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "518e4e8ddaa731eb9635715033d34282e47e5542"
          test "$(git rev-parse HEAD^{tree})" = "7f768c5b88ca4c4ecdcf156c517af95ef8870918"
          test "$(git rev-parse --is-shallow-repository)" = "false"
          test -z "$(git status --porcelain)"
          git fsck --full
          IMAGE='ghcr.io/ktogias/gnostoa@sha256:f89bf32c0c4b86bac71fa008579b2385e6ae39bf4822f685479c4f2cc22bfca4'
          docker pull "$IMAGE"
          PYTHONPATH=. python tests/vf0_execution_oci_smoke.py --image "$IMAGE" --output "$RUNNER_TEMP/result.json"
          test -s "$RUNNER_TEMP/result.json"
          python - "$RUNNER_TEMP/result.json" "518e4e8ddaa731eb9635715033d34282e47e5542" "7f768c5b88ca4c4ecdcf156c517af95ef8870918" <<'PY'
          import json, pathlib, sys
          path, head, tree = sys.argv[1:]
          doc=json.loads(pathlib.Path(path).read_text())
          assert doc["status"]=="PASS"
          assert doc["scope"]=="COMPONENT_CONFORMANCE_ONLY"
          assert doc["production_receipt_issued"] is False
          assert doc["producer_admitted"] is False
          assert doc["compliance_established"] is False
          assert doc["vf0_active"] is False
          pathlib.Path(path).write_text(json.dumps({"subject_head":head,"subject_tree":tree,"result":doc},sort_keys=True,separators=(",",":"))+"\n")
          PY
          sha256sum "$RUNNER_TEMP/result.json" > "$RUNNER_TEMP/result.sha256"
          sha256sum tools/vf0_execution.py tests/test_vf0_execution.py tests/vf0_execution_oci_smoke.py > "$RUNNER_TEMP/source.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr319-vf0-execution-smoke-518e4e8d
          path: |
            ${{ runner.temp }}/result.json
            ${{ runner.temp }}/result.sha256
            ${{ runner.temp }}/source.sha256
          if-no-files-found: error
          retention-days: 7
