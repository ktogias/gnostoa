# S1 probe core: the four merge-admission jobs' dependency shape (subjects; invalidate and readback per subject; admit after
# both), each a timed sleep that prints its own start and end. No checkout, no token use.
name: Probe S1 core
on:
  workflow_call:
    inputs:
      hold:
        type: number
        required: true
permissions: {}
jobs:
  subjects:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: date -u +%FT%TZ; sleep "${{ inputs.hold }}"; date -u +%FT%TZ
  invalidate:
    needs: subjects
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: date -u +%FT%TZ; sleep "${{ inputs.hold }}"; date -u +%FT%TZ
  readback:
    needs: [subjects, invalidate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: date -u +%FT%TZ; sleep "${{ inputs.hold }}"; date -u +%FT%TZ
  admit:
    needs: [subjects, invalidate, readback]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: date -u +%FT%TZ; sleep "${{ inputs.hold }}"; date -u +%FT%TZ
