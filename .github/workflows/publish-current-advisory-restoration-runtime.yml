name: Publish qualified current-advisory restoration runtime by digest

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-current-advisory-restoration-runtime.yml"

permissions: {}

concurrency:
  group: gnostoa-current-advisory-restoration-r3-oci
  cancel-in-progress: false

env:
  KIT_VERSION: "0.2.0"
  IMAGE_NAME: ghcr.io/ktogias/gnostoa
  SOURCE_COMMIT: 315487e7a67635ebf3ec3f70f666ef41646102e1 # pragma: allowlist secret -- public qualified source revision
  SOURCE_TREE: ea3fdebc6afa9bf5a4c2d0691199beca4dcece81 # pragma: allowlist secret -- public qualified source tree
  EXPECTED_PUBLIC_SURFACE_DIGEST: sha256:45bc59ce177ab53ddb5925279166b5ede91bbb6c43ef31fb056de56b6ddabca2 # pragma: allowlist secret -- public measured surface digest
  AUTHORIZED_BEFORE_COMMIT: b80a4d8246e48d1e922c1732c37201e3e2b92c47 # pragma: allowlist secret -- protected-main predecessor
  AUTHORIZED_PR_NUMBER: "281"
  AUTHORIZED_PR_HEAD_REF: restoration/275-publish-current-advisory-runtime

jobs:
  authorize:
    name: authorize exact protected-main R3 publication transition
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    env:
      EVENT_BEFORE: ${{ github.event.before }}
    steps:
      - name: Refuse any context outside the admitted one-shot R3 boundary
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "ktogias/gnostoa"
          test "${GITHUB_EVENT_NAME}" = "push"
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${GITHUB_REF_TYPE}" = "branch"
          test "${GITHUB_REF_NAME}" = "main"
          test "${GITHUB_ACTOR}" = "ktogias"
          test "${GITHUB_TRIGGERING_ACTOR}" = "ktogias"
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          test "${EVENT_BEFORE}" = "${AUTHORIZED_BEFORE_COMMIT}"
          test "${GITHUB_WORKFLOW_REF}" = "${GITHUB_REPOSITORY}/.github/workflows/publish-current-advisory-restoration-runtime.yml@refs/heads/main"

      - name: Bind the pushed commit to merged PR 281
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! pr_json="$(
            set -o pipefail
            timeout --kill-after=5s 30s gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/pulls/${AUTHORIZED_PR_NUMBER}" \
              2>&1 | head -c 65537
          )"; then
            echo "unable to read the authorized R3 PR binding" >&2
            exit 1
          fi
          test "$(printf '%s' "${pr_json}" | wc -c)" -le 65536
          PR_JSON="${pr_json}" python - \
            "${AUTHORIZED_PR_NUMBER}" \
            "${AUTHORIZED_PR_HEAD_REF}" \
            "${GITHUB_REPOSITORY}" \
            "${GITHUB_SHA}" <<'PY'
          import json
          import os
          import sys

          expected_number, expected_head_ref, expected_repo, expected_merge_sha = sys.argv[1:]
          pr = json.loads(os.environ["PR_JSON"])
          checks = (
              (str(pr.get("number")) == expected_number, "PR number"),
              (pr.get("state") == "closed", "PR state"),
              (pr.get("merged_at") is not None, "merged_at"),
              (pr.get("merge_commit_sha") == expected_merge_sha, "merge_commit_sha"),
              (pr.get("base", {}).get("ref") == "main", "base ref"),
              (
                  pr.get("head", {}).get("repo", {}).get("full_name") == expected_repo,
                  "head repository",
              ),
              (pr.get("head", {}).get("ref") == expected_head_ref, "head ref"),
          )
          for ok, label in checks:
              if not ok:
                  raise SystemExit(f"unauthorized R3 PR landing identity: {label}")
          PY

  publish:
    name: publish exact qualified restoration runtime by digest
    needs: authorize
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      EVENT_BEFORE: ${{ github.event.before }}
    steps:
      - name: Refuse rerun at the effect-capable R3 publication job
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          test "${EVENT_BEFORE}" = "${AUTHORIZED_BEFORE_COMMIT}"
          test "${GITHUB_EVENT_NAME}" = "push"
          test "${GITHUB_REF}" = "refs/heads/main"

      - name: Check out the authorized R3 publisher landing
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Check out the exact qualified runtime source separately
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ env.SOURCE_COMMIT }}
          path: restoration-source

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: restoration-source/requirements/runtime.lock

      - name: Install exact qualified-source runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install \
            --only-binary=:all: \
            --require-hashes \
            -r restoration-source/requirements/runtime.lock

      - name: Verify exact qualified source identity and derive bound metadata
        id: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          cd restoration-source
          test "$(git rev-parse HEAD)" = "${SOURCE_COMMIT}"
          test "$(git rev-parse "HEAD^{tree}")" = "${SOURCE_TREE}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" = "${KIT_VERSION}"
          grep -Fx 'ARG KIT_VERSION=0.2.0' Dockerfile
          grep -Fx 'ARG DOCKER_CLI_VERSION=26.1.5+dfsg1-9+deb13u1' Dockerfile
          test -f requirements/runtime.lock
          source_epoch="$(git show -s --format=%ct "${SOURCE_COMMIT}")"
          build_date="$(date -u -d "@${source_epoch}" '+%Y-%m-%dT%H:%M:%SZ')"
          printf 'build_date=%s\n' "${build_date}" >> "${GITHUB_OUTPUT}"

      - name: Build and verify exact qualified runtime before any registry effect
        id: local
        shell: bash
        timeout-minutes: 35
        env:
          BUILD_DATE: ${{ steps.source.outputs.build_date }}
        run: |
          set -euo pipefail
          local_image="gnostoa-current-advisory-r3-verify:${SOURCE_COMMIT}"
          cleanup_local_image() {
            local prior_status=$?
            local cleanup_status=0
            trap - EXIT
            if docker image inspect "${local_image}" >/dev/null 2>&1; then
              docker image rm "${local_image}" >/dev/null 2>&1 || cleanup_status=1
            fi
            if docker image inspect "${local_image}" >/dev/null 2>&1; then
              cleanup_status=1
            fi
            if [ "${prior_status}" -ne 0 ]; then
              exit "${prior_status}"
            fi
            if [ "${cleanup_status}" -ne 0 ]; then
              echo "local R3 verification image cleanup failed" >&2
              exit "${cleanup_status}"
            fi
          }
          trap cleanup_local_image EXIT

          (
            cd restoration-source
            GNOSTOA_CANDIDATE_REF="${SOURCE_COMMIT}" \
            GNOSTOA_KIT_VERSION="${KIT_VERSION}" \
              timeout --kill-after=5s 1200s ./ci/build-runtime \
                --tag "${local_image}" \
                --platform linux/amd64 \
                --pull \
                --no-cache \
                --provenance=false \
                --sbom=false \
                --load \
                --build-arg BUILD_DATE="${BUILD_DATE}"
          )

          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "${local_image}")" = "linux/amd64"
          test "$(docker image inspect --format '{{.Config.User}}' "${local_image}")" = "kit"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "${local_image}")" = "${KIT_VERSION}"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "${local_image}")" = "${SOURCE_COMMIT}"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.created"}}' "${local_image}")" = "${BUILD_DATE}"
          test "$(docker run --rm --entrypoint id "${local_image}" -u)" = "10001"
          test "$(docker run --rm --entrypoint id "${local_image}" -g)" = "10001"
          public_digest="$(
            docker run --rm \
              --network none \
              --read-only \
              --cap-drop ALL \
              --security-opt no-new-privileges \
              --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m \
              --entrypoint python \
              "${local_image}" \
              -m tools.cli surface-digest --root /opt/gnostoa
          )"
          test "${public_digest}" = "${EXPECTED_PUBLIC_SURFACE_DIGEST}"
          printf 'public_digest=%s\n' "${public_digest}" >> "${GITHUB_OUTPUT}"

          docker run --rm --entrypoint sh "${local_image}" -ec \
            'test -f /opt/gnostoa/tools/review_current.py; test -f /opt/gnostoa/tools/review_outer.py; test -f /opt/gnostoa/tools/review_live.py; test -f /opt/gnostoa/tools/review_live_entrypoint.py; grep -Fx "tools/review_current.py" /opt/gnostoa/.gnostoa-source-files >/dev/null; grep -Fx "tools/review_outer.py" /opt/gnostoa/.gnostoa-source-files >/dev/null; grep -Fx "tools/review_live.py" /opt/gnostoa/.gnostoa-source-files >/dev/null; grep -Fx "tools/review_live_entrypoint.py" /opt/gnostoa/.gnostoa-source-files >/dev/null; grep -Fx "knowledge/decisions/0082-eliminate-host-persistence-for-protected-review-payloads-and-route-security-gates.md" /opt/gnostoa/.gnostoa-source-files >/dev/null'
          docker run --rm "${local_image}" self-check

          local_image_id="$(docker image inspect --format '{{.Id}}' "${local_image}")"
          [[ "${local_image_id}" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'local_image_id=%s\n' "${local_image_id}" >> "${GITHUB_OUTPUT}"

          PYTHONPATH=restoration-source \
          GNOSTOA_R2A_CANDIDATE_IMAGE="${local_image}" \
          GNOSTOA_R2_EXPECTED_SOURCE_REVISION="${SOURCE_COMMIT}" \
          GNOSTOA_R2_EXPECTED_SOURCE_TREE="${SOURCE_TREE}" \
          GNOSTOA_R2_EXPECTED_IMAGE_ID="${local_image_id}" \
          GNOSTOA_R2_EXPECTED_PUBLIC_SURFACE_DIGEST="${EXPECTED_PUBLIC_SURFACE_DIGEST}" \
          GNOSTOA_R2_EXPECTED_PROTECTED_MAIN="${GITHUB_SHA}" \
            python ci/review_current_advisory_restoration_smoke.py

          cleanup_local_image
          trap - EXIT

      - name: Authenticate to GHCR for the single R3 digest-only effect
        id: authenticate
        shell: bash
        timeout-minutes: 1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Clean GHCR authentication state after failed login
        if: ${{ always() && steps.authenticate.outcome == 'failure' }}
        shell: bash
        timeout-minutes: 1
        run: |
          set -euo pipefail
          timeout --kill-after=5s 30s docker logout ghcr.io >/dev/null 2>&1

      - name: Publish exact qualified runtime without a remote tag and read back digest
        id: publish
        shell: bash
        timeout-minutes: 35
        env:
          BUILD_DATE: ${{ steps.source.outputs.build_date }}
        run: |
          set -euo pipefail
          builder="gnostoa-current-advisory-r3-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          metadata_file="${RUNNER_TEMP}/current-advisory-r3-build-metadata.json"
          test ! -e "${metadata_file}"
          cleanup_builder() {
            local prior_status=$?
            trap - EXIT
            if ! timeout --kill-after=5s 30s docker buildx rm "${builder}" >/dev/null 2>&1; then
              if [ "${prior_status}" -ne 0 ]; then
                exit "${prior_status}"
              fi
              echo "R3 BuildKit builder cleanup failed" >&2
              exit 1
            fi
            exit "${prior_status}"
          }
          trap cleanup_builder EXIT
          timeout --kill-after=5s 120s docker buildx create \
            --name "${builder}" --driver docker-container --use >/dev/null

          (
            cd restoration-source
            GNOSTOA_CANDIDATE_REF="${SOURCE_COMMIT}" \
            GNOSTOA_KIT_VERSION="${KIT_VERSION}" \
              timeout --kill-after=5s 1200s ./ci/build-runtime \
                --push-by-digest "${IMAGE_NAME}" \
                --metadata-file "${metadata_file}" \
                --platform linux/amd64 \
                --pull \
                --no-cache \
                --provenance=false \
                --sbom=false \
                --build-arg BUILD_DATE="${BUILD_DATE}"
          )

          registry_digest="$(python - "${metadata_file}" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          if not path.is_file() or path.is_symlink() or path.stat().st_size > 65536:
              raise SystemExit("invalid bounded BuildKit metadata file")
          metadata = json.loads(path.read_text(encoding="utf-8"))
          digest = metadata.get("containerimage.digest") if isinstance(metadata, dict) else None
          if not isinstance(digest, str) or re.fullmatch(r"sha256:[0-9a-f]{64}", digest) is None:
              raise SystemExit("invalid containerimage.digest")
          print(digest)
          PY
          )"
          printf 'registry_digest=%s\n' "${registry_digest}" >> "${GITHUB_OUTPUT}"

          digest_ref="${IMAGE_NAME}@${registry_digest}"
          timeout --kill-after=5s 120s docker pull --quiet "${digest_ref}" >/dev/null
          test "$(timeout --kill-after=5s 30s docker buildx imagetools inspect "${digest_ref}" --format '{{.Manifest.Digest}}')" = "${registry_digest}"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "${digest_ref}")" = "linux/amd64"
          test "$(docker image inspect --format '{{.Config.User}}' "${digest_ref}")" = "kit"
          test "$(docker run --rm --entrypoint id "${digest_ref}" -u)" = "10001"
          test "$(docker run --rm --entrypoint id "${digest_ref}" -g)" = "10001"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "${digest_ref}")" = "${SOURCE_COMMIT}"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.created"}}' "${digest_ref}")" = "${BUILD_DATE}"
          test "$(docker run --rm --entrypoint python "${digest_ref}" -m tools.cli surface-digest --root /opt/gnostoa)" = "${EXPECTED_PUBLIC_SURFACE_DIGEST}"
          docker run --rm "${digest_ref}" self-check

      - name: Attest the exact digest-only restoration manifest
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        timeout-minutes: 5
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.registry_digest }}
          push-to-registry: true

      - name: Verify attestation, anonymously reacquire, and replay restoration smoke
        shell: bash
        timeout-minutes: 35
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_DIGEST: ${{ steps.publish.outputs.registry_digest }}
          BUILD_DATE: ${{ steps.source.outputs.build_date }}
          ATTESTATION_ID: ${{ steps.attest.outputs.attestation-id }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
        run: |
          set -euo pipefail
          [[ "${REGISTRY_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          test -n "${ATTESTATION_ID}"
          test -n "${ATTESTATION_URL}"
          digest_ref="${IMAGE_NAME}@${REGISTRY_DIGEST}"
          test "$(timeout --kill-after=5s 30s docker buildx imagetools inspect "${digest_ref}" --format '{{.Manifest.Digest}}')" = "${REGISTRY_DIGEST}"
          timeout --kill-after=5s 30s gh attestation verify \
            "oci://${digest_ref}" --repo "${GITHUB_REPOSITORY}" >/dev/null

          timeout --kill-after=5s 30s docker logout ghcr.io >/dev/null 2>&1
          docker image rm "${digest_ref}" >/dev/null
          if docker image inspect "${digest_ref}" >/dev/null 2>&1; then
            echo "digest image remained cached before R3 anonymous reacquisition" >&2
            exit 1
          fi

          anonymous_config="$(mktemp -d)"
          cleanup_anonymous() {
            local prior_status=$?
            trap - EXIT
            rm -rf "${anonymous_config}"
            exit "${prior_status}"
          }
          trap cleanup_anonymous EXIT

          timeout --kill-after=5s 120s env DOCKER_CONFIG="${anonymous_config}" \
            docker pull --quiet "${digest_ref}" >/dev/null
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "${digest_ref}")" = "linux/amd64"
          test "$(docker image inspect --format '{{.Config.User}}' "${digest_ref}")" = "kit"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "${digest_ref}")" = "${SOURCE_COMMIT}"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.created"}}' "${digest_ref}")" = "${BUILD_DATE}"
          test "$(docker run --rm --entrypoint id "${digest_ref}" -u)" = "10001"
          test "$(docker run --rm --entrypoint id "${digest_ref}" -g)" = "10001"
          test "$(docker run --rm --entrypoint python "${digest_ref}" -m tools.cli surface-digest --root /opt/gnostoa)" = "${EXPECTED_PUBLIC_SURFACE_DIGEST}"
          docker run --rm "${digest_ref}" self-check

          published_image_id="$(docker image inspect --format '{{.Id}}' "${digest_ref}")"
          [[ "${published_image_id}" =~ ^sha256:[0-9a-f]{64}$ ]]
          PYTHONPATH=restoration-source \
          GNOSTOA_R2A_CANDIDATE_IMAGE="${digest_ref}" \
          GNOSTOA_R2_EXPECTED_SOURCE_REVISION="${SOURCE_COMMIT}" \
          GNOSTOA_R2_EXPECTED_SOURCE_TREE="${SOURCE_TREE}" \
          GNOSTOA_R2_EXPECTED_IMAGE_ID="${published_image_id}" \
          GNOSTOA_R2_EXPECTED_PUBLIC_SURFACE_DIGEST="${EXPECTED_PUBLIC_SURFACE_DIGEST}" \
          GNOSTOA_R2_EXPECTED_PROTECTED_MAIN="${GITHUB_SHA}" \
            python ci/review_current_advisory_restoration_smoke.py

          {
            echo "### R3 immutable current-advisory restoration runtime"
            echo
            echo "This is an immutable restoration materialization, not a release or authority promotion."
            printf -- '- source commit: %s\n' "${SOURCE_COMMIT}"
            printf -- '- source tree: %s\n' "${SOURCE_TREE}"
            printf -- '- public-surface digest: %s\n' "${EXPECTED_PUBLIC_SURFACE_DIGEST}"
            printf -- '- OCI image: %s\n' "${digest_ref}"
            printf -- '- workflow run: %s\n' "${GITHUB_RUN_ID}"
            printf -- '- attestation id: %s\n' "${ATTESTATION_ID}"
            printf -- '- attestation url: %s\n' "${ATTESTATION_URL}"
            echo "- authority promotion: **NOT PERFORMED**"
          } >> "${GITHUB_STEP_SUMMARY}"
          printf 'current_advisory_r3.image=%s\n' "${digest_ref}"

      - name: Reconcile and clean post-publication state
        if: ${{ always() && steps.publish.outcome != 'skipped' }}
        shell: bash
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_DIGEST: ${{ steps.publish.outputs.registry_digest }}
          METADATA_FILE: ${{ runner.temp }}/current-advisory-r3-build-metadata.json
          BUILD_DATE: ${{ steps.source.outputs.build_date }}
        run: |
          set -euo pipefail
          registry_digest="${REGISTRY_DIGEST}"
          if [ -z "${registry_digest}" ] && [ -f "${METADATA_FILE}" ]; then
            registry_digest="$(python - "${METADATA_FILE}" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          if path.is_symlink() or path.stat().st_size > 65536:
              raise SystemExit("invalid bounded BuildKit metadata file")
          metadata = json.loads(path.read_text(encoding="utf-8"))
          digest = metadata.get("containerimage.digest") if isinstance(metadata, dict) else None
          if not isinstance(digest, str) or re.fullmatch(r"sha256:[0-9a-f]{64}", digest) is None:
              raise SystemExit("invalid containerimage.digest")
          print(digest)
          PY
            )"
          fi
          if [[ ! "${registry_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "post-write outcome is ambiguous and no exact digest is available; do not rerun blindly" >&2
            exit 1
          fi

          digest_ref="${IMAGE_NAME}@${registry_digest}"
          test "$(timeout --kill-after=5s 30s docker buildx imagetools inspect "${digest_ref}" --format '{{.Manifest.Digest}}')" = "${registry_digest}"
          timeout --kill-after=5s 30s gh attestation verify \
            "oci://${digest_ref}" --repo "${GITHUB_REPOSITORY}" >/dev/null

          reconcile_config="$(mktemp -d)"
          cleanup_reconciliation() {
            local prior_status=$?
            local cleanup_status=0
            trap - EXIT
            if docker image inspect "${digest_ref}" >/dev/null 2>&1; then
              docker image rm "${digest_ref}" >/dev/null 2>&1 || cleanup_status=1
            fi
            rm -rf "${reconcile_config}" || cleanup_status=1
            if [ "${prior_status}" -ne 0 ]; then
              exit "${prior_status}"
            fi
            exit "${cleanup_status}"
          }
          trap cleanup_reconciliation EXIT

          timeout --kill-after=5s 30s docker logout ghcr.io >/dev/null 2>&1 || true
          if docker image inspect "${digest_ref}" >/dev/null 2>&1; then
            docker image rm "${digest_ref}" >/dev/null
          fi
          if docker image inspect "${digest_ref}" >/dev/null 2>&1; then
            echo "digest image remained cached before R3 reconciliation reacquisition" >&2
            exit 1
          fi
          timeout --kill-after=5s 120s env DOCKER_CONFIG="${reconcile_config}" \
            docker pull --quiet "${digest_ref}" >/dev/null
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "${digest_ref}")" = "${SOURCE_COMMIT}"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.created"}}' "${digest_ref}")" = "${BUILD_DATE}"
          test "$(docker run --rm --entrypoint python "${digest_ref}" -m tools.cli surface-digest --root /opt/gnostoa)" = "${EXPECTED_PUBLIC_SURFACE_DIGEST}"
          docker run --rm "${digest_ref}" self-check
