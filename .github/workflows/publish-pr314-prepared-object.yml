name: Publish PR 314 prepared object

on:
  push:
    branches:
      - ops/analyzer-readback-source-export-314
    paths:
      - .github/workflows/publish-pr314-prepared-object.yml

permissions:
  contents: write

jobs:
  publish-prepared-object:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout control payload
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: control
          persist-credentials: false

      - name: Checkout exact implementation parent
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 099163e35bf0e4934b3e2c0d33baf88ac3802cf8
          path: source
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct and bind prepared candidate
        shell: bash
        env:
          EXPECTED_PARENT: 099163e35bf0e4934b3e2c0d33baf88ac3802cf8
          EXPECTED_PARENT_TREE: 1acb848bf4bf8ab276ad5fd0960ac41f9211073b
          EXPECTED_PREPARED_TREE: 63c7cd1b498e35e1facef2cf22db355945134e46
          EXPECTED_GZIP_SHA256: 147c408255bc4cfbe49146213537a0f681b0f0d7c214a8a0ff434a57d1c195cd
          EXPECTED_PATCH_SHA256: ace095621bdf0d501ae562a096fcd142ef6f716df6369c96de068d95373e6c7f
          IMPLEMENTATION_REF: refs/heads/analyzer-readback-309-313
          OBJECT_REF: refs/heads/ops/pr314-prepared-object
        run: |
          set -euo pipefail
          cd source

          test "$(git rev-parse HEAD)" = "${EXPECTED_PARENT}"
          test "$(git rev-parse 'HEAD^{tree}')" = "${EXPECTED_PARENT_TREE}"
          test -z "$(git status --porcelain)"

          remote_impl="$(git ls-remote origin "${IMPLEMENTATION_REF}" | awk '{print $1}')"
          test "${remote_impl}" = "${EXPECTED_PARENT}"

          cat ../control/ops/pr314-prepared-patch/part-*.b64 > "${RUNNER_TEMP}/candidate.patch.gz.b64"
          base64 --decode "${RUNNER_TEMP}/candidate.patch.gz.b64" > "${RUNNER_TEMP}/candidate.patch.gz"
          test "$(sha256sum "${RUNNER_TEMP}/candidate.patch.gz" | awk '{print $1}')" = "${EXPECTED_GZIP_SHA256}"
          gzip --decompress --stdout "${RUNNER_TEMP}/candidate.patch.gz" > "${RUNNER_TEMP}/candidate.patch"
          test "$(sha256sum "${RUNNER_TEMP}/candidate.patch" | awk '{print $1}')" = "${EXPECTED_PATCH_SHA256}"

          git apply --binary --index "${RUNNER_TEMP}/candidate.patch"
          test "$(git write-tree)" = "${EXPECTED_PREPARED_TREE}"
          git diff --cached --check "${EXPECTED_PARENT}"
          test "$(git diff --cached --name-only "${EXPECTED_PARENT}" | wc -l)" -eq 8

          git config user.name "Gnostoa preparation"
          git config user.email "noreply@invalid"
          prepared_commit="$(
            printf '%s\n\n%s\n' \
              'feat: add authenticated analyzer readback (#309 #313)' \
              'Refs #309, #313.' \
              | git commit-tree "${EXPECTED_PREPARED_TREE}" -p "${EXPECTED_PARENT}"
          )"

          test "$(git rev-parse "${prepared_commit}^{tree}")" = "${EXPECTED_PREPARED_TREE}"
          test "$(git rev-parse "${prepared_commit}^")" = "${EXPECTED_PARENT}"

          git push --force-with-lease="${OBJECT_REF}:0000000000000000000000000000000000000000" \
            origin "${prepared_commit}:${OBJECT_REF}"

          printf 'prepared_commit=%s\n' "${prepared_commit}"
          printf 'prepared_tree=%s\n' "${EXPECTED_PREPARED_TREE}"
