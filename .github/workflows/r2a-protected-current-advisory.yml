name: R2A protected current-advisory consumer verification

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/r2a-protected-current-advisory.yml"
      - ".github/workflows/publish-r2a-p2b-b16-oci.yml"
      - ".github/workflows/publish-r2a-p2b-oci.yml"
      - ".github/workflows/publish-current-advisory-restoration-runtime.yml"
      - "Dockerfile"
      - "ci/build-runtime"
      - "ci/review_b15_runtime_smoke.py"
      - "ci/review_b16_entrypoint_smoke.py"
      - "ci/review_live_smoke.py"
      - "ci/review_live_timeout_cleanup.py"
      - "ci/review_outer_smoke.py"
      - "ci/review_outer_containment_smoke.py"
      - "ci/review_current_advisory_promotion_smoke.py"
      - "knowledge/decisions/0070-protect-r2a-b1-outer-consumer-authority-separately.md"
      - "knowledge/decisions/0071-add-docker-client-to-r2a-b1-runtime.md"
      - "knowledge/decisions/0072-materialize-integrated-r2a-p2b-b15-consumer-by-digest.md"
      - "knowledge/decisions/0073-promote-r2a-b15-outer-consumer-authority.md"
      - "knowledge/decisions/0074-add-input-only-live-entrypoint-to-r2a-b15-runtime.md"
      - "knowledge/decisions/0075-materialize-integrated-r2a-p2b-b16-consumer-by-digest.md"
      - "knowledge/decisions/0076-promote-r2a-b16-outer-consumer-authority.md"
      - "knowledge/decisions/0077-activate-r2a-p2b-b2-through-prior-effective-b16.md"
      - "knowledge/decisions/0078-materialize-integrated-r2a-p2b-runtime-by-digest.md"
      - "knowledge/decisions/0079-promote-r2a-p2b-outer-consumer-authority.md"
      - "knowledge/decisions/0080-complete-r2a-p2b-rolling-trust-exit-by-negative-readback.md"
      - "knowledge/decisions/0084-publish-current-advisory-restoration-runtime-by-digest.md"
      - "knowledge/decisions/0085-promote-current-advisory-restoration-runtime.md"
      - "policy/guardrails.yaml"
      - "pyproject.toml"
      - "requirements/development.lock"
      - "requirements/runtime.lock"
      - "schemas/review-*.schema.json"
      - "tasks/issue-11-r2a-current-advisory.json"
      - "tasks/issue-11-r2a-current-advisory-consumer.json"
      - "tests/test_r2a_p2b_b16_cubic_followup_red.py"
      - "tests/test_r2a_p2b_b16_publication.py"
      - "tests/test_r2a_p2b_b16_reconciliation_fail_closed.py"
      - "tests/test_r2a_p2b_integrated_materialization.py"
      - "tests/test_current_advisory_restoration_publication.py"
      - "tests/test_current_advisory_restoration_promotion.py"
      - "tests/test_review_assurance_p2b_activation_red.py"
      - "tests/test_review_assurance_p2b_b2_activation_red.py"
      - "tests/test_review_assurance_p2b_b15_runtime_red.py"
      - "tests/test_review_assurance_p2b_b16_entrypoint_red.py"
      - "tests/test_review_assurance_p2b_b1_dormancy_red.py"
      - "tests/test_review_assurance_p2b_b1_error_paths_red.py"
      - "tests/test_review_assurance_p2b_consumer_authority_red.py"
      - "tests/test_review_assurance_p2b_exit_readback_red.py"
      - "tests/test_review_outer_socket_table_red.py"
      - "tests/test_review_outer_containment.py"
      - "tools/cli.py"
      - "tools/knowledge_common.py"
      - "tools/review_check.py"
      - "tools/review_current.py"
      - "tools/review_evaluate.py"
      - "tools/review_live.py"
      - "tools/review_live_entrypoint.py"
      - "tools/review_model.py"
      - "tools/review_outer.py"
      - "tools/review_policy.py"
      - "tools/review_protected.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r2a-protected-current-advisory-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GNOSTOA_R2A_CANDIDATE_IMAGE: gnostoa-r2a-b1:${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  protected-current-advisory-consumer:
    name: protected-current-advisory-consumer
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/development.lock

      - name: Build and self-check the exact candidate runtime
        run: |
          set -eu
          candidate_commit=$(git rev-parse HEAD)
          test "${candidate_commit}" = "${{ github.event.pull_request.head.sha || github.sha }}"
          GNOSTOA_CANDIDATE_REF="${candidate_commit}" \
          GNOSTOA_KIT_VERSION=0.2.0 \
            ./ci/build-runtime --tag "${GNOSTOA_R2A_CANDIDATE_IMAGE}"
          docker run --rm "${GNOSTOA_R2A_CANDIDATE_IMAGE}" self-check

      - name: Install exact development dependencies
        run: |
          python -m pip install \
            --only-binary=:all: \
            --require-hashes \
            -r requirements/development.lock

      - name: Verify protected consumer trust-domain sources
        run: |
          python -m ruff format --check \
            tools/review_check.py \
            tools/review_current.py \
            tools/review_live.py \
            tools/review_live_entrypoint.py \
            tools/review_outer.py \
            ci/review_b15_runtime_smoke.py \
            ci/review_b16_entrypoint_smoke.py \
            ci/review_live_smoke.py \
            ci/review_live_timeout_cleanup.py \
            ci/review_outer_smoke.py \
            ci/review_outer_containment_smoke.py \
            ci/review_current_advisory_promotion_smoke.py \
            tests/test_r2a_p2b_b16_cubic_followup_red.py \
            tests/test_r2a_p2b_b16_publication.py \
            tests/test_r2a_p2b_b16_reconciliation_fail_closed.py \
            tests/test_r2a_p2b_integrated_materialization.py \
            tests/test_current_advisory_restoration_publication.py \
            tests/test_current_advisory_restoration_promotion.py \
            tests/test_review_assurance_p2b_activation_red.py \
            tests/test_review_assurance_p2b_b2_activation_red.py \
            tests/test_review_assurance_p2b_b15_runtime_red.py \
            tests/test_review_assurance_p2b_b16_entrypoint_red.py \
            tests/test_review_assurance_p2b_b1_dormancy_red.py \
            tests/test_review_assurance_p2b_b1_error_paths_red.py \
            tests/test_review_assurance_p2b_consumer_authority_red.py \
            tests/test_review_assurance_p2b_exit_readback_red.py \
            tests/test_review_outer_socket_table_red.py \
            tests/test_review_outer_containment.py
          python -m ruff check \
            tools/review_check.py \
            tools/review_current.py \
            tools/review_live.py \
            tools/review_live_entrypoint.py \
            tools/review_outer.py \
            ci/review_b15_runtime_smoke.py \
            ci/review_b16_entrypoint_smoke.py \
            ci/review_live_smoke.py \
            ci/review_live_timeout_cleanup.py \
            ci/review_outer_smoke.py \
            ci/review_outer_containment_smoke.py \
            ci/review_current_advisory_promotion_smoke.py \
            tests/test_r2a_p2b_b16_cubic_followup_red.py \
            tests/test_r2a_p2b_b16_publication.py \
            tests/test_r2a_p2b_b16_reconciliation_fail_closed.py \
            tests/test_r2a_p2b_integrated_materialization.py \
            tests/test_current_advisory_restoration_publication.py \
            tests/test_current_advisory_restoration_promotion.py \
            tests/test_review_assurance_p2b_activation_red.py \
            tests/test_review_assurance_p2b_b2_activation_red.py \
            tests/test_review_assurance_p2b_b15_runtime_red.py \
            tests/test_review_assurance_p2b_b16_entrypoint_red.py \
            tests/test_review_assurance_p2b_b1_dormancy_red.py \
            tests/test_review_assurance_p2b_b1_error_paths_red.py \
            tests/test_review_assurance_p2b_consumer_authority_red.py \
            tests/test_review_assurance_p2b_exit_readback_red.py \
            tests/test_review_outer_socket_table_red.py \
            tests/test_review_outer_containment.py
          python -m mypy \
            tools/review_check.py \
            tools/review_current.py \
            tools/review_live.py \
            tools/review_live_entrypoint.py \
            tools/review_model.py \
            tools/review_outer.py \
            tools/review_policy.py \
            tools/review_protected.py \
            ci/review_b15_runtime_smoke.py \
            ci/review_b16_entrypoint_smoke.py \
            ci/review_outer_smoke.py \
            ci/review_outer_containment_smoke.py \
            ci/review_current_advisory_promotion_smoke.py

      # Native execution is an explicit fallback because these tests exercise the
      # host-side lifecycle orchestrator. Candidate bytes may create and clean the
      # isolated topology but the protected prior-effective outer runtime never
      # receives the host
      # Docker socket or a host-selected Docker executable.
      - name: Run protected current-advisory consumer contract tests via native orchestration fallback
        run: |
          PYTHONPATH=. python tests/test_r2a_p2b_b16_cubic_followup_red.py
          PYTHONPATH=. python tests/test_r2a_p2b_b16_publication.py
          PYTHONPATH=. python tests/test_r2a_p2b_b16_reconciliation_fail_closed.py
          PYTHONPATH=. python tests/test_r2a_p2b_integrated_materialization.py
          PYTHONPATH=. python tests/test_current_advisory_restoration_publication.py
          PYTHONPATH=. python tests/test_current_advisory_restoration_promotion.py
          PYTHONPATH=. python tests/test_review_assurance_p2b_activation_red.py
          PYTHONPATH=. python tests/test_review_assurance_p2b_b2_activation_red.py
          PYTHONPATH=. python tests/test_review_assurance_p2b_b15_runtime_red.py
          PYTHONPATH=. python tests/test_review_assurance_p2b_b16_entrypoint_red.py
          PYTHONPATH=. python tests/test_review_assurance_p2b_b1_dormancy_red.py
          PYTHONPATH=. python tests/test_review_assurance_p2b_b1_error_paths_red.py
          PYTHONPATH=. python tests/test_review_assurance_p2b_consumer_authority_red.py
          PYTHONPATH=. python tests/test_review_assurance_p2b_exit_readback_red.py
          PYTHONPATH=. python tests/test_review_outer_socket_table_red.py
          PYTHONPATH=. python tests/test_review_outer_containment.py

      - name: Verify inherited pinned Docker client in exact candidate runtime
        run: PYTHONPATH=. python ci/review_b15_runtime_smoke.py

      - name: Verify exact candidate input-only entrypoint fails closed without a nested daemon
        run: PYTHONPATH=. python ci/review_b16_entrypoint_smoke.py

      - name: Exercise protected live implementation against authority-bound OCI P2a
        run: PYTHONPATH=. python ci/review_live_smoke.py

      - name: Verify timed-out protected Docker run cleanup
        run: PYTHONPATH=. python ci/review_live_timeout_cleanup.py

      # Decision 0082 contains the incompatible immutable runtime. This proves
      # public refusal before Docker, not restored current-advisory evaluation.
      # ci/review_outer_smoke.py remains historical live/restoration evidence.
      - name: Verify protected transport containment with live evaluation NOT_RUN
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_PROTECTED_MAIN: ${{ github.event.pull_request.base.sha }}
        run: |
          PYTHONPATH=. python ci/review_outer_containment_smoke.py --expected-protected-main "${EXPECTED_PROTECTED_MAIN}"

      - name: Exercise candidate-side exact R4 promoted current-advisory path
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_PROTECTED_MAIN: ${{ github.event.pull_request.base.sha }}
        run: |
          PYTHONPATH=. python ci/review_current_advisory_promotion_smoke.py \
            --mode candidate \
            --expected-protected-main "${EXPECTED_PROTECTED_MAIN}"
