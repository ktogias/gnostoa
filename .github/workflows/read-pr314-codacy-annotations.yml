name: Read PR 314 Codacy annotations

on:
  push:
    branches:
      - ops/pr314-codacy-annotations

permissions:
  contents: read
  checks: read

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read exact Codacy annotations
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_RUN_ID: "107267422406"
          EXPECTED_HEAD: "abd968b47ddb74a0998b06d5b2f47834e979a0fa"
        run: |
          set -euo pipefail
          run_json="$(curl -fsSL             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer ${GH_TOKEN}"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/check-runs/${CHECK_RUN_ID}")"
          observed_head="$(printf '%s' "${run_json}" | python -c 'import json,sys; print(json.load(sys.stdin)["head_sha"])')"
          test "${observed_head}" = "${EXPECTED_HEAD}"
          curl -fsSL             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer ${GH_TOKEN}"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/check-runs/${CHECK_RUN_ID}/annotations?per_page=100"             | python -m json.tool
