name: Gnostoa current-state reconciliation

on:
  workflow_run:
    workflows: ["Gnostoa verification"]
    types: [completed]
  schedule:
    - cron: "23 * * * *"
  repository_dispatch:
    types: [gnostoa-review-current-state]

permissions: {}

concurrency:
  group: gnostoa-review-current-state
  cancel-in-progress: false
  queue: max

jobs:
  collect:
    name: collect
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      statuses: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/runtime.lock
      - name: Install exact runtime dependencies
        run: |
          python -m pip install \
            --only-binary=:all: \
            --require-hashes \
            -r requirements/runtime.lock
      - name: Reconcile current Pull Request state
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_RUN_PULLS_JSON: ${{ toJSON(github.event.workflow_run.pull_requests) }}
          DISPATCH_PULL: ${{ github.event.client_payload.pull_number }}
        run: |
          set -euo pipefail
          args=(
            --mode collect
            --repository "${GITHUB_REPOSITORY}"
            --output "${RUNNER_TEMP}/gnostoa-l1-publication.json"
            --run-id "${GITHUB_RUN_ID}"
            --run-attempt "${GITHUB_RUN_ATTEMPT}"
          )
          args+=(--workflow-run-pulls-json "${WORKFLOW_RUN_PULLS_JSON:-}")
          if [[ -n "${DISPATCH_PULL:-}" ]]; then
            args+=(--pull-number "${DISPATCH_PULL}")
          fi

          PYTHONPATH=. python ci/review_github_current_state.py "${args[@]}"

      - name: Upload bounded publication payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gnostoa-l1-publication
          path: ${{ runner.temp }}/gnostoa-l1-publication.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: publish
    needs: collect
    if: github.ref == 'refs/heads/main' && needs.collect.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1
      - name: Download bounded publication payload
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: gnostoa-l1-publication
          path: ${{ runner.temp }}/gnostoa-l1-transfer
      - name: Publish stale-safe non-canonical projection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PYTHONPATH=. python ci/review_github_current_state.py \
            --mode publish \
            --repository "${GITHUB_REPOSITORY}" \
            --payload "${RUNNER_TEMP}/gnostoa-l1-transfer/gnostoa-l1-publication.json"
