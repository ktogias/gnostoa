name: Gnostoa verification

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  merge_group:
    types: [checks_requested]
  push:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}

env:
  GNOSTOA_CI_IMAGE: gnostoa-ci:${{ github.sha }}

jobs:
  policy:
    name: policy
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Build the candidate runtime
        run: |
          docker build \
            --target runtime \
            --build-arg VCS_REF="${GITHUB_SHA}" \
            --tag "${GNOSTOA_CI_IMAGE}" \
            .
      - name: Run policy verification
        run: |
          docker run --rm \
            --entrypoint sh \
            --mount type=bind,source="${GITHUB_WORKSPACE}",target=/workspace,readonly \
            --workdir /workspace \
            "${GNOSTOA_CI_IMAGE}" \
            -ec './ci/verify policy'
      - name: Verify managed Pull Request context
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm \
            --entrypoint python \
            --mount type=bind,source="${GITHUB_WORKSPACE}",target=/workspace,readonly \
            --mount type=bind,source="${GITHUB_EVENT_PATH}",target=/tmp/github-event.json,readonly \
            --workdir /workspace \
            "${GNOSTOA_CI_IMAGE}" \
            .github/check_task_context.py \
            --event /tmp/github-event.json \
            --repository-root /workspace

  fast:
    name: fast
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Build the candidate runtime
        run: |
          docker build \
            --target runtime \
            --build-arg VCS_REF="${GITHUB_SHA}" \
            --tag "${GNOSTOA_CI_IMAGE}" \
            .
      - name: Run fast verification
        run: |
          docker run --rm \
            --entrypoint sh \
            --mount type=bind,source="${GITHUB_WORKSPACE}",target=/workspace,readonly \
            --workdir /workspace \
            "${GNOSTOA_CI_IMAGE}" \
            -ec './ci/verify fast'

  regression:
    name: regression
    needs: [policy, fast]
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Build the candidate runtime
        run: |
          docker build \
            --target runtime \
            --build-arg VCS_REF="${GITHUB_SHA}" \
            --tag "${GNOSTOA_CI_IMAGE}" \
            .
      - name: Run regression verification
        run: |
          docker run --rm \
            --entrypoint sh \
            --mount type=bind,source="${GITHUB_WORKSPACE}",target=/workspace,readonly \
            --workdir /workspace \
            "${GNOSTOA_CI_IMAGE}" \
            -ec './ci/verify regression'

  smoke:
    name: smoke
    needs: regression
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Build the candidate runtime
        run: |
          docker build \
            --target runtime \
            --build-arg VCS_REF="${GITHUB_SHA}" \
            --tag "${GNOSTOA_CI_IMAGE}" \
            .
      - name: Run smoke verification
        run: |
          docker run --rm \
            --entrypoint sh \
            --mount type=bind,source="${GITHUB_WORKSPACE}",target=/workspace,readonly \
            --workdir /workspace \
            "${GNOSTOA_CI_IMAGE}" \
            -ec './ci/verify smoke'

  extended:
    name: extended
    needs: policy
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Build the candidate development runtime
        run: |
          docker build \
            --target development \
            --build-arg VCS_REF="${GITHUB_SHA}" \
            --tag "${GNOSTOA_CI_IMAGE}" \
            .
      - name: Run extended verification
        run: |
          docker run --rm \
            --entrypoint sh \
            --mount type=bind,source="${GITHUB_WORKSPACE}",target=/workspace,readonly \
            --workdir /workspace \
            "${GNOSTOA_CI_IMAGE}" \
            -ec './ci/verify extended'
