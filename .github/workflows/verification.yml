name: Gnostoa verification

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}

env:
  GNOSTOA_CI_IMAGE: gnostoa-ci:${{ github.sha }}

jobs:
  policy:
    name: policy
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Build the candidate runtime
        run: |
          GNOSTOA_CANDIDATE_REF="${GITHUB_SHA}" \
            ./ci/build-runtime --tag "${GNOSTOA_CI_IMAGE}"
      - name: Run policy verification
        run: |
          docker run --rm \
            --entrypoint sh \
            --mount type=bind,source="${GITHUB_WORKSPACE}",target=/workspace,readonly \
            --workdir /workspace \
            "${GNOSTOA_CI_IMAGE}" \
            -ec './ci/verify policy'

  fast:
    name: fast
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Build the candidate runtime
        run: |
          GNOSTOA_CANDIDATE_REF="${GITHUB_SHA}" \
            ./ci/build-runtime --tag "${GNOSTOA_CI_IMAGE}"
      - name: Run fast verification
        run: |
          docker run --rm \
            --entrypoint sh \
            --mount type=bind,source="${GITHUB_WORKSPACE}",target=/workspace,readonly \
            --workdir /workspace \
            "${GNOSTOA_CI_IMAGE}" \
            -ec './ci/verify fast'

  python-compatibility:
    name: python-compatibility (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      # actions/checkout v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      # actions/setup-python v6.3.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/development.lock
      - name: Install the exact development dependencies
        run: |
          python -m pip install \
            --only-binary=:all: \
            --require-hashes \
            -r requirements/development.lock
      - name: Run the source compatibility suite
        run: ./ci/verify fast

  regression:
    name: regression
    needs: [policy, fast, python-compatibility]
    if: >-
      always() &&
      (github.event_name != 'push' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Assert successful prerequisites
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          FAST_RESULT: ${{ needs.fast.result }}
          PYTHON_COMPATIBILITY_RESULT: ${{ needs.python-compatibility.result }}
        run: |
          test "${POLICY_RESULT}" = success
          test "${FAST_RESULT}" = success
          test "${PYTHON_COMPATIBILITY_RESULT}" = success
      # actions/checkout v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Build the candidate runtime
        run: |
          GNOSTOA_CANDIDATE_REF="${GITHUB_SHA}" \
            ./ci/build-runtime --tag "${GNOSTOA_CI_IMAGE}"
      - name: Run regression verification
        run: |
          docker run --rm \
            --entrypoint sh \
            --mount type=bind,source="${GITHUB_WORKSPACE}",target=/workspace,readonly \
            --workdir /workspace \
            "${GNOSTOA_CI_IMAGE}" \
            -ec './ci/verify regression'

  smoke:
    name: smoke
    needs: regression
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Build the candidate runtime
        run: |
          GNOSTOA_CANDIDATE_REF="$(git rev-parse HEAD)" \
            ./ci/build-runtime --tag "${GNOSTOA_CI_IMAGE}"
      - name: Run smoke verification
        run: |
          docker run --rm \
            --entrypoint sh \
            --mount type=bind,source="${GITHUB_WORKSPACE}",target=/workspace,readonly \
            --workdir /workspace \
            "${GNOSTOA_CI_IMAGE}" \
            -ec './ci/verify smoke'
      - name: Bind the exact PR executable candidate
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu

          candidate_commit=$(git rev-parse HEAD)
          candidate_tree=$(git rev-parse 'HEAD^{tree}')
          test "${candidate_commit}" = "${{ github.event.pull_request.head.sha || github.sha }}"

          vendored_root=$(mktemp -d "${RUNNER_TEMP}/gnostoa-vendored.XXXXXX")
          sb2_root=$(mktemp -d "${RUNNER_TEMP}/gnostoa-sb2.XXXXXX")
          trap 'rm -rf "${vendored_root}" "${sb2_root}"' EXIT
          chmod 0755 "${vendored_root}"
          git archive "${candidate_commit}" | tar -x -C "${vendored_root}"

          source_digest=$(docker run --rm \
            --entrypoint python \
            --mount type=bind,source="${GITHUB_WORKSPACE}",target=/workspace,readonly \
            --workdir /workspace \
            "${GNOSTOA_CI_IMAGE}" \
            -m tools.cli surface-digest --root /workspace)
          runtime_digest=$(docker run --rm \
            --entrypoint python \
            "${GNOSTOA_CI_IMAGE}" \
            -m tools.cli surface-digest --root /opt/gnostoa)
          vendored_digest=$(docker run --rm \
            --entrypoint python \
            --mount type=bind,source="${vendored_root}",target=/vendored,readonly \
            --workdir /vendored \
            "${GNOSTOA_CI_IMAGE}" \
            -m tools.cli surface-digest --root /vendored)
          test "${source_digest}" = "${runtime_digest}"
          test "${source_digest}" = "${vendored_digest}"

          sb2_paths_file="${sb2_root}/paths"
          cat > "${sb2_paths_file}" <<'EOF'
          tools/adoption_assurance.py
          tools/adoption_check.py
          tools/build_context_pack.py
          tools/build_docs.py
          tools/check_change_policy.py
          tools/check_ci_policy.py
          tools/check_guardrails.py
          tools/check_runtime_lock.py
          tools/cli.py
          tools/knowledge_common.py
          tools/repository_scope.py
          tools/self_check.py
          tools/task_envelope.py
          tools/validate_bundle.py
          EOF
          test "$(wc -l < "${sb2_paths_file}")" -eq 14
          test "$(LC_ALL=C sort -u "${sb2_paths_file}" | wc -l)" -eq 14

          source_sb2_manifest="${sb2_root}/source.sha256"
          runtime_sb2_manifest="${sb2_root}/runtime.sha256"
          vendored_sb2_manifest="${sb2_root}/vendored.sha256"

          while IFS= read -r sb2_path; do
            test -n "${sb2_path}"
            sha256sum "${sb2_path}"
          done < "${sb2_paths_file}" > "${source_sb2_manifest}"

          docker run --rm \
            --entrypoint sh \
            --mount \
              type=bind,source="${sb2_paths_file}",target=/tmp/gnostoa-sb2-paths,readonly \
            "${GNOSTOA_CI_IMAGE}" \
            -ec '
              cd /opt/gnostoa
              while IFS= read -r sb2_path; do
                test -n "${sb2_path}"
                sha256sum "${sb2_path}"
              done < /tmp/gnostoa-sb2-paths
            ' > "${runtime_sb2_manifest}"

          (
            cd "${vendored_root}"
            while IFS= read -r sb2_path; do
              test -n "${sb2_path}"
              sha256sum "${sb2_path}"
            done < "${sb2_paths_file}"
          ) > "${vendored_sb2_manifest}"

          cmp "${source_sb2_manifest}" "${runtime_sb2_manifest}"
          cmp "${source_sb2_manifest}" "${vendored_sb2_manifest}"

          docker run --rm "${GNOSTOA_CI_IMAGE}" self-check

          printf 'candidate.commit=%s\n' "${candidate_commit}"
          printf 'candidate.tree=%s\n' "${candidate_tree}"
          printf 'candidate.base=%s\n' "${BASE_SHA}"
          printf 'candidate.changed_paths.begin\n'
          git diff --name-only "${BASE_SHA}" HEAD
          printf 'candidate.changed_paths.end\n'
          printf 'public_surface.source=%s\n' "${source_digest}"
          printf 'public_surface.runtime=%s\n' "${runtime_digest}"
          printf 'public_surface.vendored=%s\n' "${vendored_digest}"
          printf 'sb2.membership=14\n'
          printf 'sb2.source.begin\n'
          cat "${source_sb2_manifest}"
          printf 'sb2.source.end\n'
          printf 'sb2.runtime.begin\n'
          cat "${runtime_sb2_manifest}"
          printf 'sb2.runtime.end\n'
          printf 'sb2.vendored.begin\n'
          cat "${vendored_sb2_manifest}"
          printf 'sb2.vendored.end\n'
          printf 'source_binding.mechanism=candidate-generic-three-way\n'
          printf 'runtime.self_check=PASS\n'

  extended:
    name: extended
    needs: policy
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Build the candidate development runtime
        run: |
          docker build \
            --target development \
            --build-arg VCS_REF="${GITHUB_SHA}" \
            --tag "${GNOSTOA_CI_IMAGE}" \
            .
      - name: Prepare the evidence output
        run: mkdir -p "${RUNNER_TEMP}/gnostoa-quality-evidence"
      - name: Run extended verification
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --entrypoint sh \
            --env HOME=/tmp \
            --env GNOSTOA_QUALITY_OUTPUT=/evidence \
            --mount type=bind,source="${GITHUB_WORKSPACE}",target=/workspace,readonly \
            --mount type=bind,source="${RUNNER_TEMP}/gnostoa-quality-evidence",target=/evidence \
            --workdir /workspace \
            "${GNOSTOA_CI_IMAGE}" \
            -ec './ci/verify extended'
      - name: Upload bounded quality evidence
        if: ${{ always() }}
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gnostoa-quality-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/gnostoa-quality-evidence
          if-no-files-found: error
          retention-days: 14
