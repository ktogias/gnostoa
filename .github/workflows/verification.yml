name: Gnostoa verification

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}

env:
  GNOSTOA_CI_IMAGE: gnostoa-ci:${{ github.sha }}

jobs:
  policy:
    name: policy
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Build the candidate runtime
        run: |
          GNOSTOA_CANDIDATE_REF="${GITHUB_SHA}" \
            ./ci/build-runtime --tag "${GNOSTOA_CI_IMAGE}"
      - name: Run policy verification
        run: |
          docker run --rm \
            --entrypoint sh \
            --mount type=bind,source="${GITHUB_WORKSPACE}",target=/workspace,readonly \
            --workdir /workspace \
            "${GNOSTOA_CI_IMAGE}" \
            -ec './ci/verify policy'

  fast:
    name: fast
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Build the candidate runtime
        run: |
          GNOSTOA_CANDIDATE_REF="${GITHUB_SHA}" \
            ./ci/build-runtime --tag "${GNOSTOA_CI_IMAGE}"
      - name: Run fast verification
        run: |
          docker run --rm \
            --entrypoint sh \
            --mount type=bind,source="${GITHUB_WORKSPACE}",target=/workspace,readonly \
            --workdir /workspace \
            "${GNOSTOA_CI_IMAGE}" \
            -ec './ci/verify fast'

  python-compatibility:
    name: python-compatibility (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      # actions/checkout v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      # actions/setup-python v6.3.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/development.lock
      - name: Install the exact development dependencies
        run: |
          python -m pip install \
            --only-binary=:all: \
            --require-hashes \
            -r requirements/development.lock
      - name: Run the source compatibility suite
        run: ./ci/verify fast

  regression:
    name: regression
    needs: [policy, fast, python-compatibility]
    if: >-
      always() &&
      (github.event_name != 'push' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Assert successful prerequisites
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          FAST_RESULT: ${{ needs.fast.result }}
          PYTHON_COMPATIBILITY_RESULT: ${{ needs.python-compatibility.result }}
        run: |
          test "${POLICY_RESULT}" = success
          test "${FAST_RESULT}" = success
          test "${PYTHON_COMPATIBILITY_RESULT}" = success
      # actions/checkout v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Build the candidate runtime
        run: |
          GNOSTOA_CANDIDATE_REF="${GITHUB_SHA}" \
            ./ci/build-runtime --tag "${GNOSTOA_CI_IMAGE}"
      - name: Run regression verification
        run: |
          docker run --rm \
            --entrypoint sh \
            --mount type=bind,source="${GITHUB_WORKSPACE}",target=/workspace,readonly \
            --workdir /workspace \
            "${GNOSTOA_CI_IMAGE}" \
            -ec './ci/verify regression'

  smoke:
    name: smoke
    needs: regression
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Build the candidate runtime
        run: |
          GNOSTOA_CANDIDATE_REF="$(git rev-parse HEAD)" \
            ./ci/build-runtime --tag "${GNOSTOA_CI_IMAGE}"
      - name: Run smoke verification
        run: |
          docker run --rm \
            --entrypoint sh \
            --mount type=bind,source="${GITHUB_WORKSPACE}",target=/workspace,readonly \
            --workdir /workspace \
            "${GNOSTOA_CI_IMAGE}" \
            -ec './ci/verify smoke'
      - name: Bind the exact PR executable candidate
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu

          candidate_commit=$(git rev-parse HEAD)
          candidate_tree=$(git rev-parse 'HEAD^{tree}')
          test "${candidate_commit}" = "${{ github.event.pull_request.head.sha || github.sha }}"

          test -z "$(git diff --name-only "${BASE_SHA}" HEAD -- \
            ci/build-runtime tools/repository_scope.py)"
          version_delta=$(git diff --unified=0 "${BASE_SHA}" HEAD -- Dockerfile \
            | grep '^[+-]ARG KIT_VERSION=')
          expected_version_delta=$(printf '%s\n%s' \
            '-ARG KIT_VERSION=0.1.1' '+ARG KIT_VERSION=0.1.2')
          test "${version_delta}" = "${expected_version_delta}"

          vendored_root=$(mktemp -d "${RUNNER_TEMP}/gnostoa-vendored.XXXXXX")
          trap 'rm -rf "${vendored_root}"' EXIT
          chmod 0755 "${vendored_root}"
          git archive "${candidate_commit}" | tar -x -C "${vendored_root}"

          source_digest=$(docker run --rm \
            --entrypoint python \
            --mount type=bind,source="${GITHUB_WORKSPACE}",target=/workspace,readonly \
            --workdir /workspace \
            "${GNOSTOA_CI_IMAGE}" \
            -m tools.cli surface-digest --root /workspace)
          runtime_digest=$(docker run --rm \
            --entrypoint python \
            "${GNOSTOA_CI_IMAGE}" \
            -m tools.cli surface-digest --root /opt/gnostoa)
          vendored_digest=$(docker run --rm \
            --entrypoint python \
            --mount type=bind,source="${vendored_root}",target=/vendored,readonly \
            --workdir /vendored \
            "${GNOSTOA_CI_IMAGE}" \
            -m tools.cli surface-digest --root /vendored)
          test "${source_digest}" = "${runtime_digest}"
          test "${source_digest}" = "${vendored_digest}"

          source_sb2=$(sha256sum tools/knowledge_common.py | cut -d' ' -f1)
          runtime_sb2=$(docker run --rm \
            --entrypoint sha256sum \
            "${GNOSTOA_CI_IMAGE}" \
            /opt/gnostoa/tools/knowledge_common.py | cut -d' ' -f1)
          vendored_sb2=$(sha256sum \
            "${vendored_root}/tools/knowledge_common.py" | cut -d' ' -f1)
          test "${source_sb2}" = "${runtime_sb2}"
          test "${source_sb2}" = "${vendored_sb2}"

          docker run --rm "${GNOSTOA_CI_IMAGE}" self-check

          printf 'candidate.commit=%s\n' "${candidate_commit}"
          printf 'candidate.tree=%s\n' "${candidate_tree}"
          printf 'candidate.base=%s\n' "${BASE_SHA}"
          printf 'candidate.changed_paths.begin\n'
          git diff --name-only "${BASE_SHA}" HEAD
          printf 'candidate.changed_paths.end\n'
          printf 'public_surface.source=%s\n' "${source_digest}"
          printf 'public_surface.runtime=%s\n' "${runtime_digest}"
          printf 'public_surface.vendored=%s\n' "${vendored_digest}"
          printf 'sb2.tools_knowledge_common.source=%s\n' "${source_sb2}"
          printf 'sb2.tools_knowledge_common.runtime=%s\n' "${runtime_sb2}"
          printf 'sb2.tools_knowledge_common.vendored=%s\n' "${vendored_sb2}"
          printf 'source_binding.mechanism=unchanged\n'
          printf 'runtime.self_check=PASS\n'

  extended:
    name: extended
    needs: policy
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Build the candidate development runtime
        run: |
          docker build \
            --target development \
            --build-arg VCS_REF="${GITHUB_SHA}" \
            --tag "${GNOSTOA_CI_IMAGE}" \
            .
      - name: Prepare the evidence output
        run: mkdir -p "${RUNNER_TEMP}/gnostoa-quality-evidence"
      - name: Run extended verification
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --entrypoint sh \
            --env HOME=/tmp \
            --env GNOSTOA_QUALITY_OUTPUT=/evidence \
            --mount type=bind,source="${GITHUB_WORKSPACE}",target=/workspace,readonly \
            --mount type=bind,source="${RUNNER_TEMP}/gnostoa-quality-evidence",target=/evidence \
            --workdir /workspace \
            "${GNOSTOA_CI_IMAGE}" \
            -ec './ci/verify extended'
      - name: Upload bounded quality evidence
        if: ${{ always() }}
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gnostoa-quality-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/gnostoa-quality-evidence
          if-no-files-found: error
          retention-days: 14
