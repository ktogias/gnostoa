name: VF0 A6 post-approval read-only reconciliation
on:
  push:
    branches: [agent-support/vf0-a6-postapproval-20260924]
    paths: [.github/workflows/vf0-a6-postapproval.yml]
permissions:
  contents: read
  actions: read
jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reacquire original A6 approval and current protections
        shell: bash
        env:
          A6_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/a6-readback.py" <<'PY'
          """A6 follow-up GET-only diagnostic, never production admission."""
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import ssl
          import time
          import urllib.request
          from datetime import datetime, timezone

          REPO = "ktogias/gnostoa"
          REPO_ID = 1317045725
          RUN = 36050075543
          SOURCE = "8735142ed4a1dc8d624aa513f005057912f980fa"
          SOURCE_DIGEST = "b3be39e7526a6fe75ceb03b3c7b9ac2f6bdc7b9c638210e09917a77640ce03a7"
          MAIN = "63fb3e7bf7a929c755250e6112f5a43a2b3db5c7"
          BRANCH = "agent-support/vf0-admission-a6-20260924"
          WORKFLOW = ".github/workflows/vf0-admission-a6.yml"
          ENV_NAME = "vf0-admission"
          ENV_ID = 22685212653
          OWNER = 532328
          MANIFEST = "82293a94cccb0d7e8978a1907092a29b8894ec9e198878a1c4effd81f09fadc4"
          APPROVAL = f"VF0-A6 approve run={RUN} attempt=1 manifest-sha256={MANIFEST}"
          API = "https://api.github.com/repos/" + REPO
          PATHS = {
              "environment": "/environments/vf0-admission",
              "branch_rules": "/environments/vf0-admission/deployment-branch-policies?per_page=100",
              "run": f"/actions/runs/{RUN}",
              "jobs": f"/actions/runs/{RUN}/attempts/1/jobs?per_page=100",
              "approvals": f"/actions/runs/{RUN}/approvals",
              "pending": f"/actions/runs/{RUN}/pending_deployments",
              "artifacts": f"/actions/runs/{RUN}/artifacts?per_page=100",
              "main": "/git/ref/heads/main",
              "source": "/contents/" + WORKFLOW + "?ref=" + SOURCE,
              "agent_comment": "/issues/comments/5821441768",
          }

          class Rejected(Exception):
              pass

          def need(value, reason):
              if not value:
                  raise Rejected(reason)

          def canonical(value):
              return (json.dumps(value,sort_keys=True,separators=(",",":"),ensure_ascii=True,allow_nan=False)+"\n").encode("ascii")

          def strict_json(raw):
              def pairs(items):
                  out={}
                  for key,value in items:
                      need(key not in out,"DUPLICATE_KEY")
                      out[key]=value
                  return out
              def constant(value):
                  raise Rejected("NONFINITE_JSON")
              return json.loads(raw,object_pairs_hook=pairs,parse_constant=constant)

          def environment_view(env, rules):
              need(type(env.get("id")) is int and env["id"] == ENV_ID and
                   env.get("name") == ENV_NAME, "ENVIRONMENT_IDENTITY")
              need(env.get("can_admins_bypass") is False, "ADMIN_BYPASS")
              policy = env.get("deployment_branch_policy")
              need(type(policy) is dict and policy.get("custom_branch_policies") is True and
                   policy.get("protected_branches") is False, "BRANCH_POLICY_MODE")
              protections = env.get("protection_rules")
              need(type(protections) is list and len(protections) == 2 and
                   {p.get("type") for p in protections} == {"required_reviewers", "branch_policy"},
                   "PROTECTION_RULE_SET")
              reviewer_rule = next(p for p in protections if p["type"] == "required_reviewers")
              branch_rule = next(p for p in protections if p["type"] == "branch_policy")
              need(type(reviewer_rule.get("id")) is int and reviewer_rule["id"] == 66621037 and
                   type(branch_rule.get("id")) is int and branch_rule["id"] == 66621127,
                   "PROTECTION_IDENTITY")
              need(reviewer_rule.get("prevent_self_review") is False, "SELF_REVIEW_CHANGED")
              actors = reviewer_rule.get("reviewers")
              need(type(actors) is list and len(actors) == 1, "REVIEWER_COUNT")
              user = actors[0].get("reviewer", {})
              need(actors[0].get("type") == "User" and user.get("type") == "User" and
                   type(user.get("id")) is int and user["id"] == OWNER and
                   user.get("login") == "ktogias", "REVIEWER_IDENTITY")
              branches = rules.get("branch_policies")
              need(type(rules.get("total_count")) is int and rules["total_count"] == 1 and
                   type(branches) is list and len(branches) == 1, "BRANCH_COVERAGE")
              rule = branches[0]
              need(type(rule.get("id")) is int and rule["id"] == 60943109 and
                   rule.get("type") == "branch" and rule.get("name") == BRANCH, "BRANCH_RESTRICTION")
              return dict(environment_id=ENV_ID, environment_name=ENV_NAME, reviewer_id=OWNER,
                          can_admins_bypass=False, prevent_self_review=False,
                          required_reviewers_rule=66621037, branch_protection_rule=66621127,
                          branch_rule_id=60943109, branch=BRANCH, tags_allowed=False)

          def evaluate(records):
              protection = environment_view(records["environment"], records["branch_rules"])
              run = records["run"]
              for key, value in [("id", RUN), ("run_attempt", 1)]:
                  need(type(run.get(key)) is int and run[key] == value, "RUN_IDENTITY")
              need(run.get("head_sha") == SOURCE and run.get("head_branch") == BRANCH and
                   run.get("path") == WORKFLOW and run.get("event") == "push", "RUN_SOURCE")
              for key in ["repository", "head_repository"]:
                  need(type(run.get(key, {}).get("id")) is int and run[key]["id"] == REPO_ID, "REPOSITORY")
              need(run.get("status") == "completed" and run.get("conclusion") == "success", "RUN_INCOMPLETE")
              need(records["main"].get("object", {}).get("sha") == MAIN, "MAIN_MOVED")
              approvals = records["approvals"]
              need(type(approvals) is list and len(approvals) == 1, "APPROVAL_COVERAGE")
              approval = approvals[0]
              need(approval.get("state") == "approved" and approval.get("comment") == APPROVAL, "APPROVAL_BINDING")
              actor = approval.get("user", {})
              need(type(actor.get("id")) is int and actor["id"] == OWNER and actor.get("type") == "User", "APPROVER")
              envs = approval.get("environments")
              need(type(envs) is list and len(envs) == 1 and type(envs[0].get("id")) is int and
                   envs[0]["id"] == ENV_ID and envs[0].get("name") == ENV_NAME, "APPROVAL_ENVIRONMENT")
              need(records["pending"] == [], "PENDING_STATE")
              jobs = records["jobs"]
              expected = {107803143748: "Freeze and publish diagnostic request",
                          107803225502: "Owner checkpoint - no production deployment"}
              need(type(jobs.get("total_count")) is int and jobs["total_count"] == 2 and
                   type(jobs.get("jobs")) is list and len(jobs["jobs"]) == 2, "JOB_COVERAGE")
              actual = jobs["jobs"]
              need(all(type(j.get("id")) is int for j in actual) and {j["id"] for j in actual} == set(expected), "JOB_IDENTITIES")
              for job in actual:
                  need(job.get("name") == expected[job["id"]] and type(job.get("run_id")) is int and
                       job["run_id"] == RUN and type(job.get("run_attempt")) is int and
                       job["run_attempt"] == 1 and job.get("head_sha") == SOURCE, "JOB_SUBJECT")
                  need(job.get("status") == "completed" and job.get("conclusion") == "success", "JOB_INCOMPLETE")
              listing = records["artifacts"]
              need(type(listing.get("total_count")) is int and listing["total_count"] == 1 and
                   type(listing.get("artifacts")) is list and len(listing["artifacts"]) == 1, "ARTIFACT_COVERAGE")
              artifact = listing["artifacts"][0]
              need(type(artifact.get("id")) is int and artifact["id"] == 10830560153 and
                   artifact.get("name") == f"vf0-a6-request-{RUN}-1" and
                   artifact.get("digest") == "sha256:b1451c3ace8a95012949bdf0135851ceacd639fd807a0b12344e8088c2ad9117" and
                   artifact.get("expired") is False, "ARTIFACT_IDENTITY")
              source = records["source"]
              need(source.get("path") == WORKFLOW and source.get("encoding") == "base64", "SOURCE_METADATA")
              raw = base64.b64decode("".join(source["content"].split()), validate=True)
              need(hashlib.sha256(raw).hexdigest() == SOURCE_DIGEST and
                   hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest() == source.get("sha"), "SOURCE_IDENTITY")
              return protection

          def unchanged(before, after):
              need(before == after, "READBACK_DRIFT")

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          class Reader:
              def __init__(self):
                  self.token = os.environ.pop("A6_READ_TOKEN")
                  need(self.token and all("!" <= c <= "~" for c in self.token), "TOKEN_FORMAT")
                  context = ssl.create_default_context()
                  need(context.check_hostname and context.verify_mode == ssl.CERT_REQUIRED, "TLS_REQUIRED")
                  self.opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect(),
                                 urllib.request.HTTPSHandler(context=context))
                  self.deadline = time.monotonic() + 240
              def read(self, path):
                  need(path in PATHS.values(), "UNDECLARED_ENDPOINT")
                  need(time.monotonic() < self.deadline, "READ_DEADLINE")
                  req = urllib.request.Request(API + path, method="GET", headers={
                      "Authorization": "Bearer " + self.token, "Accept": "application/vnd.github+json",
                      "User-Agent": "gnostoa-a6-post-approval-diagnostic", "X-GitHub-Api-Version": "2022-11-28"})
                  with self.opener.open(req, timeout=15) as response:
                      need(response.status == 200 and response.headers.get("Link") is None, "INCOMPLETE_HTTP")
                      raw = response.read(2 * 1024 * 1024 + 1)
                  need(len(raw) <= 2 * 1024 * 1024, "HTTP_BOUND")
                  return strict_json(raw)

          def main():
              need(os.environ.get("GITHUB_REPOSITORY") == REPO and
                   os.environ.get("GITHUB_RUN_ATTEMPT") == "1", "DIAGNOSTIC_CONTEXT")
              reader = Reader()
              before = {name: reader.read(path) for name, path in PATHS.items()}
              protection = evaluate(before)
              after = {name: reader.read(path) for name, path in PATHS.items()}
              evaluate(after)
              unchanged(before, after)
              app = before["agent_comment"].get("performed_via_github_app")
              app_summary = None if not app else {key: app.get(key) for key in ["id", "slug", "permissions"]}
              result = dict(schema="vf0-a6-post-approval-diagnostic/v1", status="PASS",
                            observed_at=datetime.now(timezone.utc).isoformat(), subject_run=RUN, subject_attempt=1,
                            subject_source=SOURCE, approved_manifest_sha256=MANIFEST,
                            protection=protection, advertised_originating_app=app_summary,
                            protection_interval_unchanged_proven=False, effective_credential_grants_audited=False,
                            credential_separation="UNKNOWN", production_admission=False,
                            vf0_active=False, approval_writes=0, environment_writes=0,
                            archive_bytes_reacquired=False, request_expiry="2026-09-25T19:43:32Z",
                            interpretation="Current configuration and original diagnostic approval reobserved; not production authorization.")
              out = Path(os.environ["RUNNER_TEMP"]) / "vf0-a6-post-approval"
              out.mkdir(mode=0o700, exist_ok=False)
              (out/"readback-before.json").write_bytes(canonical(before))
              (out/"readback-after.json").write_bytes(canonical(after))
              (out/"result.json").write_bytes(canonical(result))
              (out/"diagnostic.py").write_bytes(Path(__file__).read_bytes())
              print("VF0_A6_POST_APPROVAL_READBACK " + canonical(result).decode().strip())

          if __name__ == "__main__":
              try:
                  main()
              except Exception as exc:
                  print("VF0_A6_READBACK_REJECT " + (str(exc) if isinstance(exc,Rejected) else type(exc).__name__))
                  raise SystemExit(1) from None
          PY
          /usr/bin/python3 -I "$RUNNER_TEMP/a6-readback.py"
      - name: Retain non-secret diagnostic readbacks
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vf0-a6-postapproval-${{ github.run_id }}
          path: ${{ runner.temp }}/vf0-a6-post-approval/
          if-no-files-found: error
          retention-days: 7
