# Agent-authored: ChatGPT (agent:chatgpt). Diagnostic only; not human approval.
name: VF0 A6 native owner approval pilot
on:
  push:
    branches: [agent-support/vf0-admission-a6-20260924]
permissions: {}
jobs:
  preflight:
    name: Freeze and publish diagnostic request
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - name: Reacquire protections and freeze exact request
        id: request
        env:
          A6_READ_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I - <<'A6PY'
          """A6 request-only diagnostic. No approval writes or production receipt."""
          from __future__ import annotations
          import base64
          from datetime import datetime, timedelta, timezone
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import ssl
          import urllib.request

          REPO = "ktogias/gnostoa"
          REPO_ID = 1317045725
          PR_HEAD = "7d72c1444712842d70a68d03a6a3d8e48c32f83e"
          MAIN = "63fb3e7bf7a929c755250e6112f5a43a2b3db5c7"
          MAIN_TREE = "fa4cb2db0ea072897391efd77deda95ac7e1f9a4"
          BRANCH = "agent-support/vf0-admission-a6-20260924"
          WORKFLOW = ".github/workflows/vf0-admission-a6.yml"
          ENV_NAME = "vf0-admission"
          ENV_ID = 22685212653
          OWNER = 532328
          API = "https://api.github.com/repos/" + REPO

          class Rejected(Exception):
              """Stable diagnostic reason without credential/transport values."""

          def need(condition, reason):
              if not condition:
                  raise Rejected(reason)

          def canonical(value):
              return (json.dumps(value, sort_keys=True, separators=(",", ":"),
                                 ensure_ascii=True, allow_nan=False)+"\n").encode("ascii")

          def strict_json(raw):
              def pairs(items):
                  out = {}
                  for key, value in items:
                      need(key not in out, "DUPLICATE_JSON_KEY")
                      out[key] = value
                  return out
              def constant(_):
                  raise Rejected("NONFINITE_JSON")
              try:
                  return json.loads(raw, object_pairs_hook=pairs, parse_constant=constant)
              except (ValueError, UnicodeError, RecursionError):
                  raise Rejected("INVALID_JSON") from None

          def environment_view(env, rules):
              need(type(env.get("id")) is int and env["id"] == ENV_ID and
                   env.get("name") == ENV_NAME, "ENVIRONMENT_IDENTITY")
              need(env.get("can_admins_bypass") is False, "ADMIN_BYPASS")
              policy = env.get("deployment_branch_policy")
              need(type(policy) is dict and policy.get("custom_branch_policies") is True and
                   policy.get("protected_branches") is False, "BRANCH_POLICY_MODE")
              protections = env.get("protection_rules")
              need(type(protections) is list and len(protections) == 2 and
                   {p.get("type") for p in protections} == {"required_reviewers", "branch_policy"},
                   "PROTECTION_RULE_SET")
              reviewer_rule = next(p for p in protections if p["type"] == "required_reviewers")
              branch_rule = next(p for p in protections if p["type"] == "branch_policy")
              need(type(reviewer_rule.get("id")) is int and reviewer_rule["id"] == 66621037 and
                   type(branch_rule.get("id")) is int and branch_rule["id"] == 66621127,
                   "PROTECTION_IDENTITY")
              need(reviewer_rule.get("prevent_self_review") is False, "SELF_REVIEW_CHANGED")
              actors = reviewer_rule.get("reviewers")
              need(type(actors) is list and len(actors) == 1, "REVIEWER_COUNT")
              user = actors[0].get("reviewer", {})
              need(actors[0].get("type") == "User" and user.get("type") == "User" and
                   type(user.get("id")) is int and user["id"] == OWNER and
                   user.get("login") == "ktogias", "REVIEWER_IDENTITY")
              branches = rules.get("branch_policies")
              need(type(rules.get("total_count")) is int and rules["total_count"] == 1 and
                   type(branches) is list and len(branches) == 1, "BRANCH_COVERAGE")
              rule = branches[0]
              need(type(rule.get("id")) is int and rule["id"] == 60943109 and
                   rule.get("type") == "branch" and rule.get("name") == BRANCH, "BRANCH_RESTRICTION")
              return dict(environment_id=ENV_ID, environment_name=ENV_NAME, reviewer_id=OWNER,
                          can_admins_bypass=False, prevent_self_review=False,
                          required_reviewers_rule=66621037, branch_protection_rule=66621127,
                          branch_rule_id=60943109, branch=BRANCH, tags_allowed=False)

          def bind_run(run, source, run_id):
              need(type(run.get("id")) is int and run["id"] == run_id, "RUN_IDENTITY")
              need(type(run.get("run_attempt")) is int and run["run_attempt"] == 1,
                   "RERUN_NOT_ADMITTED")
              need(run.get("head_sha") == source and run.get("head_branch") == BRANCH and
                   run.get("path") == WORKFLOW and run.get("event") == "push", "RUN_SOURCE")
              for key in ("repository", "head_repository"):
                  need(type(run.get(key, {}).get("id")) is int and run[key]["id"] == REPO_ID,
                       "RUN_REPOSITORY")

          def bind_start(main, pr):
              need(main.get("object", {}).get("sha") == MAIN, "MAIN_MOVED")
              need(type(pr.get("number")) is int and pr["number"] == 319 and pr.get("state") == "open" and
                   pr.get("draft") is True and pr.get("head", {}).get("sha") == PR_HEAD and
                   pr.get("base", {}).get("sha") == MAIN, "PR_MOVED")

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          class Reader:
              """Bounded fixed-origin GET only; no proxy or redirect credential handoff."""
              def __init__(self):
                  self.token = os.environ.pop("A6_READ_TOKEN")
                  need(self.token and all("!" <= c <= "~" for c in self.token), "TOKEN_FORMAT")
                  context = ssl.create_default_context()
                  need(context.check_hostname and context.verify_mode == ssl.CERT_REQUIRED, "TLS_REQUIRED")
                  self.opener = urllib.request.build_opener(urllib.request.ProxyHandler({}),
                                NoRedirect(), urllib.request.HTTPSHandler(context=context))
              def get(self, path):
                  allowed = ("/environments/vf0-admission", "/git/ref/heads/", "/git/commits/",
                             "/pulls/319", "/contents/", "/actions/runs/")
                  need(path.startswith(allowed) and ".." not in path and "#" not in path and
                       "/secrets" not in path and all(33 <= ord(c) <= 126 for c in path), "UNSAFE_API_PATH")
                  req = urllib.request.Request(API+path, method="GET", headers={
                      "Authorization":"Bearer "+self.token, "Accept":"application/vnd.github+json",
                      "User-Agent":"gnostoa-a6-diagnostic", "X-GitHub-Api-Version":"2022-11-28"})
                  with self.opener.open(req, timeout=20) as response:
                      need(response.status == 200 and response.headers.get("Link") is None, "INCOMPLETE_HTTP")
                      raw = response.read(2*1024*1024+1)
                  need(len(raw) <= 2*1024*1024, "HTTP_BODY_BOUND")
                  return strict_json(raw)

          def file_bytes(reader, path, ref):
              result = reader.get("/contents/"+path+"?ref="+ref)
              need(result.get("type") == "file" and result.get("path") == path and
                   result.get("encoding") == "base64", "SOURCE_METADATA")
              try:
                  raw = base64.b64decode("".join(result["content"].split()), validate=True)
              except (ValueError, TypeError):
                  raise Rejected("SOURCE_ENCODING") from None
              oid = hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()
              need(result.get("sha") == oid and result.get("size") == len(raw), "SOURCE_BLOB")
              return raw

          def main():
              need(os.environ.get("GITHUB_REPOSITORY") == REPO and
                   os.environ.get("GITHUB_REF") == "refs/heads/"+BRANCH and
                   os.environ.get("GITHUB_EVENT_NAME") == "push" and
                   os.environ.get("GITHUB_RUN_ATTEMPT") == "1", "RUNTIME_CONTEXT")
              source, run_text = os.environ["GITHUB_SHA"], os.environ["GITHUB_RUN_ID"]
              need(re.fullmatch(r"[0-9a-f]{40}", source) is not None, "SOURCE_ID")
              need(re.fullmatch(r"[1-9][0-9]{0,19}", run_text) is not None, "RUN_ID_TYPE")
              run_id = int(run_text)
              reader = Reader()
              env_path = "/environments/"+ENV_NAME
              policy_path = env_path+"/deployment-branch-policies?per_page=100"
              env, branches = reader.get(env_path), reader.get(policy_path)
              protection = environment_view(env, branches)
              bind_start(reader.get("/git/ref/heads/main"), reader.get("/pulls/319"))
              source_commit = reader.get("/git/commits/"+source)
              need([p.get("sha") for p in source_commit.get("parents", [])] == [PR_HEAD], "SOURCE_PARENT_MOVED")
              need(reader.get("/git/ref/heads/"+BRANCH).get("object", {}).get("sha") == source, "PILOT_BRANCH_MOVED")
              run = reader.get(f"/actions/runs/{run_id}")
              bind_run(run, source, run_id)
              need(reader.get(f"/actions/runs/{run_id}/approvals") == [], "PREEXISTING_APPROVAL")
              workflow = file_bytes(reader, WORKFLOW, source)
              documents = {}
              for path, ref in [("policy/change-control.yaml", MAIN), ("core/change-control.yaml", MAIN),
                  ("knowledge/decisions/0092-bind-verification-first-evidence-to-parent-owned-preparation.md", PR_HEAD)]:
                  raw = file_bytes(reader, path, ref)
                  documents[path] = dict(revision=ref, raw_sha256=hashlib.sha256(raw).hexdigest())
              created = datetime.fromisoformat(run["created_at"].replace("Z", "+00:00"))
              need(created.tzinfo is not None and timedelta(0) <= datetime.now(timezone.utc)-created < timedelta(hours=1), "RUN_AGE")
              manifest = dict(schema="gnostoa-vf0-a6-native-gate-diagnostic/v1",
                  request_id=f"vf0-a6-run-{run_id}", repository=REPO, repository_id=REPO_ID,
                  work_item=15, pull_request=319, parent_commit=MAIN, parent_tree=MAIN_TREE,
                  knowledge_head=PR_HEAD, run_id=run_id, run_attempt=1, source_commit=source,
                  workflow_path=WORKFLOW, workflow_sha256=hashlib.sha256(workflow).hexdigest(),
                  environment=protection, bound_documents=documents,
                  requested_effect="OBSERVE_NATIVE_ENVIRONMENT_APPROVAL_ONLY",
                  aggregate_vf0_classification="critical", production_change_admitted=False,
                  production_evidence_mode=None, production_evidence_delta=[],
                  chronology="PROVIDER_GATE_CHARACTERIZATION_NOT_PRODUCTION_COMPLIANCE",
                  candidate_or_test_code_executed=False,
                  runtime_permissions={"preflight":{"actions":"read","contents":"read","pull-requests":"read"}, "owner_gate":{}},
                  forbidden_effects=["approval_api_write","environment_change","secret_access",
                                    "production_deployment","merge","vf0_activation"],
                  oracle="Native job stays blocked until review; independent pending/approval read-back remains required.",
                  expires_at=(created+timedelta(hours=24)).isoformat().replace("+00:00","Z"),
                  authorship="agent:chatgpt", human_approval=False,
                  assurance="REQUEST_ONLY_NO_APPROVAL_OR_COMPLIANCE_RECEIPT")
              raw = canonical(manifest)
              digest = hashlib.sha256(raw).hexdigest()
              comment = f"VF0-A6 approve run={run_id} attempt=1 manifest-sha256={digest}"
              env2, branches2 = reader.get(env_path), reader.get(policy_path)
              need(environment_view(env2, branches2) == protection and env2 == env and branches2 == branches,
                   "ENVIRONMENT_CHANGED_DURING_READ")
              bind_start(reader.get("/git/ref/heads/main"), reader.get("/pulls/319"))
              bind_run(reader.get(f"/actions/runs/{run_id}"), source, run_id)
              need(reader.get(f"/actions/runs/{run_id}/approvals") == [], "APPROVAL_RACE")
              out = Path(os.environ["RUNNER_TEMP"])/"vf0-a6-request"
              out.mkdir(mode=0o700, exist_ok=False)
              for name, payload in [("manifest.json", raw), ("environment.json", canonical(env)),
                  ("branch-policies.json",canonical(branches)), ("run-before-gate.json",canonical(run)),
                  ("workflow.yml",workflow), ("approval-comment.txt",(comment+"\n").encode())]:
                  (out/name).write_bytes(payload)
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="ascii") as stream:
                  stream.write("manifest_sha256="+digest+"\n")
              summary = f"""# VF0-A6 — human approval request, diagnostic only

          Agent-authored · ChatGPT (`agent:chatgpt`) · Not human approval.

          Run `{run_id}`, attempt1; source `{source}`.
          Environment `{ENV_NAME}` (`{ENV_ID}`); manifest SHA-256 `{digest}`.

          Only the native gate is exercised. The gated job merely prints a diagnostic.
          No production deployment, candidate/test execution, merge, VF0 activation or
          future implementation admission is authorized. Green status is not a receipt.

          **Do not approve until the source, manifest and actual pending state have been
          independently checked.** The later exact deployment-review comment is:

          ```text
          {comment}
          ```

          Request expiry: `{manifest['expires_at']}`. Expiry is checked at independent
          read-back, not enforced by a custom native protection rule in this diagnostic.
          Keep the owner's approving session outside all agent/workflow access.
          This single-owner pilot is not independent code review.

          <details><summary>Complete request</summary>

          ```json
          {json.dumps(manifest, indent=2, sort_keys=True)}
          ```

          </details>
          """
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
                  stream.write(summary)
              print("VF0_A6_REQUEST_READY "+digest)
              print("VF0_A6_NO_HUMAN_APPROVAL_OBSERVED")

          if __name__ == "__main__":
              try:
                  main()
              except Exception as exc:
                  print("VF0_A6_PREFLIGHT_REJECT "+(str(exc) if isinstance(exc,Rejected) else type(exc).__name__))
                  raise SystemExit(1) from None
          A6PY
      - name: Retain request before approval
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vf0-a6-request-${{ github.run_id }}-1
          path: ${{ runner.temp }}/vf0-a6-request/
          if-no-files-found: error
          overwrite: false
          retention-days: 7
  owner_gate:
    name: Owner checkpoint - no production deployment
    needs: preflight
    if: github.run_attempt == 1 && needs.preflight.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    environment:
      name: vf0-admission
    steps:
      - name: Record native release without granting compliance
        shell: bash
        run: |
          printf '%s\n' 'VF0_A6_NATIVE_GATE_RELEASED_DIAGNOSTIC_ONLY'
          printf '%s\n' 'No deployment, merge, production admission or VF0 activation performed.'
          printf '%s\n' 'Independent source, pending-state and deployment-review read-back remains required.'
