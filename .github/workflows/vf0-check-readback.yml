name: VF0 exact-check annotation readback
on:
  push:
    branches: [agent-support/vf0-check-readback-20260925]
    paths: [.github/workflows/vf0-check-readback.yml]
permissions:
  contents: read
  checks: read
  pull-requests: read
jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: b13655f133747dbc93e028d55c474a0e8a92aff7
          fetch-depth: 0
          persist-credentials: false
      - name: Read exact check annotations and missing source objects only
        env:
          READ_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I - <<'PY'
          import hashlib, json, os, pathlib, ssl, subprocess, time, urllib.request
          HEAD = 'b13655f133747dbc93e028d55c474a0e8a92aff7'
          PREVIOUS = '2d79b41e08ed39d6f222897159250a0d3f214820'
          BASE = '4ef62a31424bf9d58e49bb4e591f1a827a89a506'
          MAIN = '63fb3e7bf7a929c755250e6112f5a43a2b3db5c7'
          CHECK = 107883693351
          PATHS = {
              'knowledge/assessments/15-vf0-entrance-and-execution-plan.md',
              'knowledge/decisions/0092-bind-verification-first-evidence-to-parent-owned-preparation.md',
              'knowledge/runbooks/invoke-external-reviewers.md', 'policy/guardrails.yaml',
              'tests/test_vf0_contract.py', 'tools/vf0_contract.py',
          }
          API = 'https://api.github.com/repos/ktogias/gnostoa'
          token = os.environ.pop('READ_TOKEN')
          assert token and all('!' <= c <= '~' for c in token)
          deadline = time.monotonic() + 180
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect(),
                       urllib.request.HTTPSHandler(context=ssl.create_default_context()))
          def read(path):
              assert path in ['/pulls/319', '/git/ref/heads/main', f'/check-runs/{CHECK}'] or path in [
                  f'/check-runs/{CHECK}/annotations?per_page=100&page={p}' for p in range(1, 5)]
              assert time.monotonic() < deadline
              req = urllib.request.Request(API + path, method='GET', headers={
                  'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'vf0-bounded-check-readback'})
              with opener.open(req, timeout=15) as response:
                  assert response.status == 200
                  raw = response.read(2_000_001)
                  assert len(raw) <= 2_000_000
                  return json.loads(raw), response.headers.get('Link', '')
          def bound_check(value):
              assert value['id'] == CHECK and value['head_sha'] == HEAD
              assert value['app']['id'] == 56611 and value['name'] == 'Codacy Static Code Analysis'
              assert value['status'] == 'completed'
          def bound_pr(value):
              assert value['number'] == 319 and value['state'] == 'open' and value['draft'] is True
              assert value['head']['sha'] == HEAD and value['head']['repo']['id'] == 1317045725
              assert value['base']['sha'] == MAIN
          before, _ = read(f'/check-runs/{CHECK}')
          bound_check(before)
          pr, _ = read('/pulls/319')
          bound_pr(pr)
          main, _ = read('/git/ref/heads/main')
          assert main['object']['sha'] == MAIN
          annotations = []
          for page in range(1, 5):
              items, link = read(f'/check-runs/{CHECK}/annotations?per_page=100&page={page}')
              assert isinstance(items, list) and len(items) <= 100
              annotations.extend(items)
              if 'rel="next"' not in link:
                  break
          else:
              raise ValueError('ANNOTATION_COVERAGE_LIMIT')
          assert len(annotations) == before['output']['annotations_count']
          after, _ = read(f'/check-runs/{CHECK}')
          bound_check(after)
          assert before == after
          pr_after, _ = read('/pulls/319')
          bound_pr(pr_after)
          assert pr['head']['sha'] == pr_after['head']['sha']
          env = {'PATH': '/usr/bin:/bin', 'GIT_CONFIG_NOSYSTEM': '1',
                 'GIT_CONFIG_GLOBAL': '/dev/null', 'GIT_NO_REPLACE_OBJECTS': '1'}
          def git(*args):
              result = subprocess.run(['/usr/bin/git', '-c', 'core.hooksPath=/dev/null', *args],
                  env=env, stdin=subprocess.DEVNULL, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                  timeout=20, check=True)
              assert len(result.stdout) <= 1_000_000
              return result.stdout
          assert git('rev-parse', 'HEAD').decode().strip() == HEAD
          assert not git('status', '--porcelain')
          assert git('rev-parse', '--is-shallow-repository').strip() == b'false'
          assert set(git('diff', '--name-only', BASE, HEAD).decode().splitlines()) == PATHS
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'vf0-check-readback'
          out.mkdir(mode=0o700)
          (out/'blobs').mkdir()
          (out/'commits').mkdir()
          material = []
          for commit in (PREVIOUS, HEAD):
              raw = git('cat-file', 'commit', commit)
              assert hashlib.sha1(b'commit '+str(len(raw)).encode()+b'\0'+raw).hexdigest() == commit
              (out/'commits'/commit).write_bytes(raw)
              files = {}
              for path in sorted(PATHS):
                  oid = git('rev-parse', commit+':'+path).decode().strip()
                  payload = git('cat-file', 'blob', oid)
                  assert hashlib.sha1(b'blob '+str(len(payload)).encode()+b'\0'+payload).hexdigest() == oid
                  (out/'blobs'/oid).write_bytes(payload)
                  files[path] = {'blob': oid, 'mode': '100644', 'sha256': hashlib.sha256(payload).hexdigest()}
              material.append({'commit': commit, 'tree': git('rev-parse', commit+'^{tree}').decode().strip(), 'files': files})
          result = {'schema': 'vf0-check-readback/v1', 'head': HEAD, 'check_id': CHECK,
                    'check_before': before, 'check_after': after, 'annotations': annotations,
                    'source_base': BASE, 'source_material': material, 'provider_writes': 0,
                    'candidate_executed': False, 'vf0_active': False}
          (out/'readback.json').write_text(json.dumps(result, sort_keys=True, indent=2)+'\n')
          print('VF0_CHECK_READBACK_COMPLETE', CHECK, 'annotations', len(annotations))
          PY
      - name: Retain bounded readback
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vf0-check-readback-${{ github.run_id }}
          path: ${{ runner.temp }}/vf0-check-readback/
          if-no-files-found: error
          retention-days: 7
