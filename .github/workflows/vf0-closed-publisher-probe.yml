name: VF0 closed publisher experiment
on:
  push:
    branches: [agent-support/vf0-closed-publisher-20260924-1710]
    paths: [.github/workflows/vf0-closed-publisher-probe.yml]
permissions:
  contents: read
  actions: read
jobs:
  noise:
    name: VF0 untrusted-channel noise
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 3
    steps:
      - name: Emit a forged publication line in the wrong job
        shell: bash
        run: |
          python3 -I - <<'PY'
          import json, os
          record = {
              "schema": "vf0-publication-experiment/v1",
              "repository_id": int(os.environ["GITHUB_REPOSITORY_ID"]),
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "source_commit": os.environ["GITHUB_SHA"],
              "publisher_role": "publisher", "publisher_job_id": 1,
              "artifact_id": 1, "archive_sha256": "a" * 64,
              "observation_sha256": "b" * 64, "input_sha256": "c" * 64,
          }
          print("GNOSTOA_VF0_" + "PUBLICATION_V1 " + json.dumps(record, sort_keys=True, separators=(",", ":")))
          PY
  publisher:
    name: VF0 closed publisher
    needs: noise
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create fixed diagnostic observation without candidate inputs
        shell: bash
        run: |
          python3 -I - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "vf0-closed"
          root.mkdir(mode=0o700)
          observation = {
              "schema": "vf0-observation-diagnostic/v1",
              "input_sha256": hashlib.sha256(b"VF0-E4-fixed-diagnostic-input\n").hexdigest(),
              "repository_id": int(os.environ["GITHUB_REPOSITORY_ID"]),
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "source_commit": os.environ["GITHUB_SHA"],
              "production_producer_admitted": False,
          }
          (root / "observation.json").write_text(json.dumps(observation, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          PY
      - name: Upload diagnostic observation
        id: archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vf0-closed-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vf0-closed/observation.json
          if-no-files-found: error
          retention-days: 7
          overwrite: false
      - name: Emit closed publication record
        shell: bash
        env:
          VF0_API_TOKEN: ${{ github.token }}
          VF0_ARTIFACT_ID: ${{ steps.archive.outputs.artifact-id }}
          VF0_ARCHIVE_SHA256: ${{ steps.archive.outputs.artifact-digest }}
        run: |
          python3 -I - <<'PY'
          import hashlib, json, os, re, urllib.request
          from pathlib import Path
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          def closed_pairs(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError("duplicate JSON key")
                  result[key] = value
              return result
          run = int(os.environ["GITHUB_RUN_ID"])
          attempt = int(os.environ["GITHUB_RUN_ATTEMPT"])
          source = os.environ["GITHUB_SHA"]
          assert re.fullmatch(r"[0-9a-f]{40}", source)
          assert re.fullmatch(r"[1-9][0-9]*", os.environ["VF0_ARTIFACT_ID"])
          assert re.fullmatch(r"[0-9a-f]{64}", os.environ["VF0_ARCHIVE_SHA256"])
          url = f"https://api.github.com/repos/ktogias/gnostoa/actions/runs/{run}/attempts/{attempt}/jobs?per_page=100"
          req = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["VF0_API_TOKEN"], "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"})
          with urllib.request.build_opener(NoRedirect()).open(req, timeout=20) as response:
              raw = response.read(1048577)
          assert len(raw) <= 1048576
          jobs = json.loads(raw, object_pairs_hook=closed_pairs)
          assert type(jobs["total_count"]) is int and jobs["total_count"] == len(jobs["jobs"]) <= 3
          matches = [job for job in jobs["jobs"] if job["name"] == "VF0 closed publisher"]
          assert len(matches) == 1
          job = matches[0]
          assert type(job["id"]) is int and job["id"] > 0
          assert type(job["run_attempt"]) is int and job["run_attempt"] == attempt
          assert job["run_id"] == run and job["head_sha"] == source
          observation = (Path(os.environ["RUNNER_TEMP"]) / "vf0-closed" / "observation.json").read_bytes()
          record = {
              "schema": "vf0-publication-experiment/v1",
              "repository_id": int(os.environ["GITHUB_REPOSITORY_ID"]),
              "run_id": run, "run_attempt": attempt, "source_commit": source,
              "publisher_role": "publisher", "publisher_job_id": job["id"],
              "artifact_id": int(os.environ["VF0_ARTIFACT_ID"]),
              "archive_sha256": os.environ["VF0_ARCHIVE_SHA256"],
              "observation_sha256": hashlib.sha256(observation).hexdigest(),
              "input_sha256": hashlib.sha256(b"VF0-E4-fixed-diagnostic-input\n").hexdigest(),
          }
          print("GNOSTOA_VF0_" + "PUBLICATION_V1 " + json.dumps(record, sort_keys=True, separators=(",", ":")))
          PY
  source_transport:
    name: VF0 exact source transport only
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: cf83a184f436b0dcdee325c3ee97e3cf6e91325f
          fetch-depth: 0
          persist-credentials: false
      - name: Verify and export exact source without executing it
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = cf83a184f436b0dcdee325c3ee97e3cf6e91325f
          test "$(git rev-parse HEAD^{tree})" = 143375e2ca50f41cd4ca4104880a776b907cae5d
          test "$(git rev-parse --is-shallow-repository)" = false
          test -z "$(git status --porcelain)"
          git fsck --full
          git update-ref refs/heads/vf0-source-export HEAD
          git bundle create "$RUNNER_TEMP/vf0-source.bundle" refs/heads/vf0-source-export
          mkdir "$RUNNER_TEMP/vf0-bundle-check"
          git -C "$RUNNER_TEMP/vf0-bundle-check" init --quiet
          git -C "$RUNNER_TEMP/vf0-bundle-check" bundle verify "$RUNNER_TEMP/vf0-source.bundle"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vf0-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vf0-source.bundle
          if-no-files-found: error
          retention-days: 7
          overwrite: false
