name: VF0 execution fixed-fixture smoke b7b008b5

on:
  push:
    branches:
      - agent-support/vf0-execution-smoke-b7b008b5

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact published candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: b7b008b52fcfb053dc8b6c25893c4dcaf475dc28
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source identity
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          test "$(git rev-parse HEAD)" = "b7b008b52fcfb053dc8b6c25893c4dcaf475dc28"
          test "$(git rev-parse HEAD^{tree})" = "e436776d3a772544bf01cc718e5e4edc20194619"
          test -z "$(git status --porcelain)"
          sha256sum tools/vf0_execution.py tests/vf0_execution_oci_smoke.py tests/test_vf0_execution.py

      - name: Pull fixed public image
        shell: bash
        run: |
          set -euo pipefail
          docker pull 'ghcr.io/ktogias/gnostoa@sha256:f89bf32c0c4b86bac71fa008579b2385e6ae39bf4822f685479c4f2cc22bfca4'

      - name: Run fixed-fixture OCI smoke
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vf0-execution-smoke"
          sha256sum tools/vf0_execution.py tests/vf0_execution_oci_smoke.py tests/test_vf0_execution.py > "$RUNNER_TEMP/vf0-execution-smoke/source.sha256"
          PYTHONPATH="$PWD" python3 tests/vf0_execution_oci_smoke.py             --output "$RUNNER_TEMP/vf0-execution-smoke/result.json"             > "$RUNNER_TEMP/vf0-execution-smoke/controller.log"
          python3 - "$RUNNER_TEMP/vf0-execution-smoke/result.json" <<'PY'
          import json, pathlib, sys
          result = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert result["schema"] == "gnostoa-vf0-execution-oci-smoke/v1"
          assert result["status"] == "PASS"
          assert result["scope"] == "COMPONENT_CONFORMANCE_ONLY"
          assert result["production_receipt_issued"] is False
          assert result["producer_admitted"] is False
          assert result["compliance_established"] is False
          assert result["vf0_active"] is False
          assert result["wrong_tree"] == {
              "status": "REJECTED",
              "reason": "SUBJECT_TREE",
              "container_started": False,
          }
          expected = {
              "isolation": ("completed", 0),
              "spoof": ("completed", 0),
              "nonzero": ("completed", 17),
              "timeout": ("timeout", None),
              "overflow": ("output_limit", None),
              "subject_one": ("completed", 0),
              "subject_two": ("completed", 0),
          }
          for name, pair in expected.items():
              case = result["cases"][name]
              assert (case["termination"], case["exit_code"]) == pair
              assert case["subject_unchanged"] is True
              assert case["authority_effect"] is False
          PY
          sha256sum "$RUNNER_TEMP/vf0-execution-smoke/result.json" > "$RUNNER_TEMP/vf0-execution-smoke/result.sha256"

      - name: Retain smoke result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vf0-execution-smoke-b7b008b5
          path: ${{ runner.temp }}/vf0-execution-smoke
          if-no-files-found: warn
          retention-days: 7
