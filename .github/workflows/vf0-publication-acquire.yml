name: VF0 closed record acquisition experiment
on:
  push:
    branches: [agent-support/vf0-closed-publisher-20260924-1710]
    paths: [.github/workflows/vf0-publication-acquire.yml]
permissions:
  contents: read
  actions: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Materialize the exact diagnostic probe
        shell: bash
        run: |
          python3 -I - <<'PYCODE'
          import base64, gzip, hashlib, os
          from pathlib import Path
          payload = ""
          source = gzip.decompress(base64.b64decode(payload, validate=True))
          assert hashlib.sha256(source).hexdigest() == "455ce9e65a8973c5d5e0a94130145dcdf223c121f4f7735e5920b157e65169ba"
          compile(source, "probe.py", "exec")
          (Path(os.environ["RUNNER_TEMP"]) / "vf0-e4-probe.py").write_bytes(source)
          PYCODE
      - name: Acquire exact publisher records and exercise rejection controls
        shell: bash
        env:
          READ_TOKEN: ${{ github.token }}
        run: python3 -I "$RUNNER_TEMP/vf0-e4-probe.py"
      - name: Retain diagnostic sources and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vf0-e4-acquisition-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vf0-e4-result/
          if-no-files-found: error
          retention-days: 7
          overwrite: false
