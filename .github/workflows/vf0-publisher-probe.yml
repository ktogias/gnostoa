name: VF0 closed publisher experiment
on:
  push:
    branches: [agent-support/vf0-publisher-20260924-1644]
    paths: [.github/workflows/vf0-publisher-probe.yml]
permissions:
  contents: read
jobs:
  publisher:
    name: VF0 closed publisher
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create fixed diagnostic observation
        id: observation
        env:
          OBS_REPOSITORY: ${{ github.repository_id }}
          OBS_RUN: ${{ github.run_id }}
          OBS_ATTEMPT: ${{ github.run_attempt }}
          OBS_SOURCE: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I - <<'PY'
          import hashlib, json, os, pathlib, re
          def number(name):
              value = os.environ[name]
              assert re.fullmatch(r'[1-9][0-9]{0,19}', value)
              return int(value)
          source = os.environ['OBS_SOURCE']
          assert re.fullmatch(r'[0-9a-f]{40}', source)
          input_digest = hashlib.sha256(b'vf0-e4-no-input/v1\n').hexdigest()
          record = dict(schema='vf0-observation-experiment/v1',
                        repository_id=number('OBS_REPOSITORY'), run_id=number('OBS_RUN'),
                        run_attempt=number('OBS_ATTEMPT'), source_commit=source,
                        input_sha256=input_digest, production_producer_admitted=False)
          payload = (json.dumps(record, sort_keys=True, separators=(',', ':'))+'\n').encode('ascii')
          path = pathlib.Path(os.environ['RUNNER_TEMP'])/'vf0-e4-observation'
          path.mkdir(mode=0o700)
          (path/'observation.json').write_bytes(payload)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='ascii') as output:
              output.write('observation_sha256='+hashlib.sha256(payload).hexdigest()+'\n')
              output.write('input_sha256='+input_digest+'\n')
          PY
      - name: Upload fixed diagnostic
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vf0-e4-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vf0-e4-observation/observation.json
          if-no-files-found: error
          overwrite: false
          retention-days: 7
      - name: Emit closed publication record
        env:
          OBS_REPOSITORY: ${{ github.repository_id }}
          OBS_RUN: ${{ github.run_id }}
          OBS_ATTEMPT: ${{ github.run_attempt }}
          OBS_SOURCE: ${{ github.sha }}
          OBS_ARTIFACT: ${{ steps.upload.outputs.artifact-id }}
          OBS_ARCHIVE: ${{ steps.upload.outputs.artifact-digest }}
          OBS_PAYLOAD: ${{ steps.observation.outputs.observation_sha256 }}
          OBS_INPUT: ${{ steps.observation.outputs.input_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I - <<'PY'
          import json, os, re
          def number(name):
              value = os.environ[name]
              assert re.fullmatch(r'[1-9][0-9]{0,19}', value)
              return int(value)
          def digest(name):
              value = os.environ[name]
              assert re.fullmatch(r'[0-9a-f]{64}', value)
              return value
          source = os.environ['OBS_SOURCE']
          assert re.fullmatch(r'[0-9a-f]{40}', source)
          run, attempt = number('OBS_RUN'), number('OBS_ATTEMPT')
          record = dict(schema='vf0-publisher-experiment/v1',
                        repository_id=number('OBS_REPOSITORY'), run_id=run,
                        run_attempt=attempt, source_commit=source, job_role='publisher',
                        artifact_id=number('OBS_ARTIFACT'), artifact_name=f'vf0-e4-{run}-{attempt}',
                        archive_sha256=digest('OBS_ARCHIVE'), observation_sha256=digest('OBS_PAYLOAD'),
                        input_sha256=digest('OBS_INPUT'))
          print('VF0_PUBLISHER_V1 '+json.dumps(record, sort_keys=True, separators=(',', ':')))
          PY
  source_transport:
    if: github.run_attempt == 1
    name: Exact source transport only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: cf83a184f436b0dcdee325c3ee97e3cf6e91325f
          fetch-depth: 0
          persist-credentials: false
      - name: Export pinned source without execution
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = cf83a184f436b0dcdee325c3ee97e3cf6e91325f
          test "$(git rev-parse HEAD^{tree})" = 143375e2ca50f41cd4ca4104880a776b907cae5d
          test "$(git rev-parse --is-shallow-repository)" = false
          test -z "$(git status --porcelain)"
          git cat-file -e cf83a184f436b0dcdee325c3ee97e3cf6e91325f^{commit}
          git update-ref refs/heads/vf0-e4-export HEAD
          git bundle create "$RUNNER_TEMP/source.bundle" refs/heads/vf0-e4-export
          git bundle verify "$RUNNER_TEMP/source.bundle"
          sha256sum "$RUNNER_TEMP/source.bundle"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vf0-e4-source-${{ github.run_id }}
          path: ${{ runner.temp }}/source.bundle
          if-no-files-found: error
          retention-days: 7
