name: Knowledge validation using native fallback

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive
          persist-credentials: false
      # actions/setup-python v6.2.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - run: python -m pip install -r ./.knowledge-kit/requirements/runtime.lock
      - run: python -m pip install --no-deps -e ./.knowledge-kit
      - run: knowledge check-runtime --lock .knowledge/kit.lock.yaml
      - run: knowledge check-change-policy --policy .knowledge/change-control.yaml
      - run: knowledge check-ci-policy --policy .knowledge/continuous-integration.yaml --verification .knowledge/verification.yaml
      - run: knowledge validate --profile .knowledge/profile.yaml --bundle knowledge
