site_name: Gnostoa
site_description: Git-native project knowledge validation for people and agents
theme:
  name: material

# The builder stages canonical surfaces beside docs/. Keep all of them
# linkable while suppressing warnings for detail intentionally omitted from the
# first-reader navigation. MkDocs excludes templates/ by default; the explicit
# negation makes project templates inspectable from adoption guidance.
exclude_docs: |
  !templates/**
not_in_nav: |
  guidance/**
  knowledge/**
  policy/**
  schemas/**
  templates/**

nav:
  - Home: index.md
  - Evaluate:
      - Five-minute quick start: quick-start.md
      - Current status: status.md
  - Understand:
      - Architecture: core/architecture.md
      - Toolchain: core/toolchain.md
      - Profile authoring: profiles.md
      - Governance: core/governance.md
  - Adopt:
      - Adoption overview: core/adoption.md
      - Bootstrap a new project: guidance/workflows/bootstrap-new-project.md
      - Adopt an existing project: guidance/workflows/adopt-existing-project.md
      - Create a specialization: guidance/workflows/create-specialization.md
      - Configure CI: guidance/workflows/configure-continuous-integration.md
  - Reference:
      - Reusable guidance: guidance/index.md
      - Public inheritance contract: knowledge/contracts/public-inheritance-surface.md
      - Runtime and distribution: guidance/reference/runtime-and-distribution.md
      - Compatibility and upgrades: compatibility.md
      - Continuous-integration contract: guidance/reference/continuous-integration-contract.md
      - Non-negotiable guardrails: guidance/guardrails/non-negotiable.md
  - Project evidence:
      - Roadmap: roadmap.md
      - Project status: knowledge/project/gnostoa.md
      - Self-dogfood assessment: knowledge/assessments/gnostoa-self-dogfood-bootstrap-assessment.md
      - First-publication runbook: knowledge/runbooks/prepare-first-publication.md
  - Decisions:
      - OKF as canonical format: decisions/0001-okf-as-canonical-format.md
      - Profiles instead of copies: decisions/0002-profile-inheritance.md
      - Derived retrieval layers: decisions/0003-derived-retrieval-layers.md
      - Self-hosting surfaces: decisions/0004-self-hosting-surfaces.md
      - Container-first runtime: decisions/0005-container-first-runtime.md
      - Provider-neutral change governance: decisions/0006-provider-neutral-change-governance.md
      - Proportionate verification: decisions/0007-verification-first-development.md
      - Authoritative tiered CI: decisions/0008-authoritative-tiered-continuous-integration.md
      - Adopt the Gnostoa project name: decisions/0009-adopt-gnostoa-project-name.md
      - License Gnostoa under Apache-2.0: decisions/0010-license-gnostoa-under-apache-2.0.md
      - Record initial copyright ownership: decisions/0011-record-initial-copyright-ownership.md
      - Versioned public schema identifiers: decisions/0012-use-versioned-public-schema-identifiers.md
      - Deferred private-repository enforcement: decisions/0013-defer-provider-enforcement-while-private.md
      - Stricter Gnostoa self-governance: decisions/0014-strengthen-gnostoa-self-governance.md

markdown_extensions:
  - admonition
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
