discoveries:
  - summary: Durable problem, rationale, execution state and review evidence have different authorities.
    evidence: https://github.com/ktogias/gnostoa/issues/3
  - summary: A commit cannot safely contain its own immutable revision identifier.
    evidence: Candidate revision belongs in the generated Change Request projection and is checked against repository HEAD.
  - summary: Default Git porcelain collapses untracked directories and cannot support exact file-level checkpoint reconciliation.
    evidence: tests/test_task_context.py::TaskContextToolTests.test_repository_state_expands_untracked_directories_to_files
  - summary: Container-first repository reconciliation requires a Git client in the runtime, not only on the host.
    evidence: Dockerfile pins the runtime Git package and the runtime self-check exercises repository_state.
  - summary: A non-root container must trust only the explicitly selected bind-mounted repository, never a global safe-directory wildcard.
    evidence: tests/test_task_context.py::TaskContextToolTests.test_git_trust_is_scoped_to_the_selected_repository
  - summary: Volatile image revision metadata must not invalidate the pinned system-dependency layer.
    evidence: Dockerfile orders KIT_VERSION, VCS_REF and BUILD_DATE after the Git installation.
  - summary: Green CI proves the implemented subset but does not satisfy unresolved Work Item acceptance criteria.
    evidence: https://github.com/ktogias/gnostoa/pull/4#issuecomment-5131782400
  - summary: Instruction and skill adapters make orientation discoverable but cannot make pre-mutation admission unavoidable.
    evidence: https://github.com/ktogias/gnostoa/pull/4#issuecomment-5132026215
  - summary: A clean committed Execution Plan currently fails resume because the command implicitly requires the plan path to appear in changed worktree state.
    evidence: docker run --rm --mount type=bind,source=<repository>,target=/workspace,readonly --workdir /workspace gnostoa-task-context:runtime task resume --plan plans/issue-3-durable-task-context.yaml --repository-root /workspace

