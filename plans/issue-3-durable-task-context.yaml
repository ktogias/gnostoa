  current: Owner review found unresolved Issue 3 acceptance criteria and a clean-resume defect; the candidate is not review-ready while those findings are reconciled.
  remaining:
    - Reconcile the linked Work Item and live provider Change Request before mutation
    - Bind verification evidence to the exact immutable candidate and reject stale evidence
