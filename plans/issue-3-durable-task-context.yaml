scope:
  outcome: A person or software agent can safely resume, checkpoint and hand off a repository change from bounded canonical state.
  included:
    - Provider-neutral Execution Plan policy, schema, template and workflow
    - Shared validation, reconciliation and Change Request projection commands
    - Gnostoa self-policy and active-plan specialization
    - Cross-agent repository skill and thin GitHub and Copilot adapters
    - Automated drift, provenance and provider-metadata checks
  excluded:
    - Raw prompts, private reasoning and complete activity transcripts
    - A mandatory plan for every mechanical or short local change
    - A hosted knowledge graph, catalog or agent-memory dependency
    - Repository visibility, merge or protection-setting changes

