# The least privilege the agents' provider token may hold (Decision 0101, #362).
# `knowledge credential-check --repository ktogias/gnostoa` reports whether the token in
# use holds exactly this: no grant beyond `max`, none below `min`, of the declared kind,
# within the declared lifetime, and writable nowhere but `repositories`.
#
# Owner decisions, 2026-10-04 (#15 5979363503, 5979696409, 5979734602): agents need
# contents, issues, pull requests and workflows; Actions stays read-only; nothing that
# administers the repository, approves a deployment (channel C's essence), or reads
# secrets, keys or the owner's account. Reads of this public repository's data are
# open to anyone, so their `read` level holds whatever the grant.
id: gnostoa-agent-credentials
version: "1.0"
owner: team:gnostoa-maintainers
token_kind: fine-grained
max_lifetime_days: 31
resource_owner: ktogias
repositories:
  - ktogias/gnostoa
capabilities:
  contents: {min: write, max: write}
  issues: {min: write, max: write}
  pull_requests: {min: write, max: write}
  workflows: {min: write, max: write}
  actions: {min: read, max: read}
  statuses: {min: read, max: read}
  deployments: {min: none, max: none}
  administration: {min: none, max: none}
  environments: {min: none, max: none}
  secrets: {min: none, max: none}
  actions_variables: {min: none, max: none}
  repository_hooks: {min: none, max: none}
  dependabot_secrets: {min: none, max: none}
  security_events: {min: none, max: none}
  secret_scanning_alerts: {min: none, max: none}
  vulnerability_alerts: {min: none, max: none}
  gists: {min: none, max: none}
  keys: {min: none, max: none}
  git_signing_ssh_public_keys: {min: none, max: none}
  gpg_keys: {min: none, max: none}
  emails: {min: none, max: none}
