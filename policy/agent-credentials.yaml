# The least privilege the agents' provider token may hold (Decision 0101, #362).
# `knowledge credential-check --repository ktogias/gnostoa` reports whether the token in
# use holds exactly this: no grant beyond `max`, none below `min`, of the declared kind,
# within the declared lifetime, and writable nowhere but `repositories`.
#
# Owner decisions, 2026-10-04 (#15 5979363503, 5979696409, 5979734602): agents need
# contents, issues, pull requests and workflows; Actions stays read-only; nothing that
# administers the repository, approves a deployment (channel C's essence), or reads
# secrets, keys or the owner's account. Every permission GitHub documents for a
# user-owned token is declared, so `EXACT` covers what the provider can grant. Reads of
# this public repository's data are open to anyone, so their `read` level holds
# whatever the grant.
id: gnostoa-agent-credentials
version: "1.0"
owner: team:gnostoa-maintainers
credential_kind: fine-grained
max_lifetime_days: 31
resource_owner: ktogias
repositories:
  - ktogias/gnostoa
capabilities:
  # Repository permissions.
  contents: {min: write, max: write}
  issues: {min: write, max: write}
  pull_requests: {min: write, max: write}
  workflows: {min: write, max: write}
  actions: {min: read, max: read}
  statuses: {min: read, max: read}
  metadata: {min: read, max: read}
  administration: {min: none, max: none}
  agent_secrets: {min: none, max: none}
  agent_variables: {min: none, max: none}
  artifact_metadata: {min: none, max: none}
  attestations: {min: none, max: none}
  code_quality: {min: none, max: none}
  security_events: {min: none, max: none}
  codespaces_lifecycle_admin: {min: none, max: none}
  codespaces_metadata: {min: none, max: none}
  codespaces_secrets: {min: none, max: none}
  codespaces: {min: none, max: none}
  copilot_agent_settings: {min: none, max: none}
  repository_custom_properties: {min: none, max: none}
  vulnerability_alerts: {min: none, max: none}
  dependabot_secrets: {min: none, max: none}
  deployments: {min: none, max: none}
  environments: {min: none, max: none}
  installation_repositories: {min: none, max: none}
  pages: {min: none, max: none}
  repository_creation: {min: none, max: none}
  repository_advisories: {min: none, max: none}
  secret_scanning_alerts: {min: none, max: none}
  secrets: {min: none, max: none}
  actions_variables: {min: none, max: none}
  repository_hooks: {min: none, max: none}
  # User permissions.
  blocking: {min: none, max: none}
  codespaces_user_secrets: {min: none, max: none}
  emails: {min: none, max: none}
  followers: {min: none, max: none}
  gpg_keys: {min: none, max: none}
  gists: {min: none, max: none}
  keys: {min: none, max: none}
  interaction_limits: {min: none, max: none}
  plan: {min: none, max: none}
  private_repository_invitations: {min: none, max: none}
  profile: {min: none, max: none}
  git_signing_ssh_public_keys: {min: none, max: none}
  starring: {min: none, max: none}
  watching: {min: none, max: none}
# Levels no non-effecting probe can reach, accepted with the reason a grant there is
# tolerable. They rest on the token's configuration, which the owner set on 2026-10-04
# with none of these, not on a measurement: each is listed in every verdict, and an
# unanswered probe is never accepted away. Accepting one is the owner's decision.
accepted_unmeasurable:
  "installation_repositories:write": >-
    Its routes look up the app installation before the permission. A grant could add or
    remove a repository from an installed app's access, which shows in that app's
    repository list; it cannot change a repository's content, settings or secrets.
  "codespaces_lifecycle_admin:read": >-
    Its routes look up a named codespace before the permission. A grant reads the
    machine types and exports of the owner's codespaces.
  "codespaces_lifecycle_admin:write": >-
    As for read. A grant starts, stops or exports the owner's codespaces; it cannot
    change a repository's settings or secrets.
  "starring:write": >-
    Its routes look up the repository before the permission. Starring changes no
    repository content, setting or credential.
  "repository_custom_properties:write": >-
    Its one repository endpoint sets custom property values, which exist only on an
    organization's repositories; on this user's repository it answers 404 before the
    permission.
  "artifact_metadata:read": >-
    Every endpoint GitHub documents for it is an organization's, and this token's
    resource owner is a user, so a grant reaches nothing the token can address.
  "artifact_metadata:write": >-
    As for read.
  # These routes answer 200 without the grant, leaving the private part out rather
  # than refusing, so no probe can tell a grant apart (Codex on #364; calibrated
  # 2026-10-04). The proven selection is this public repository alone.
  "repository_advisories:read": >-
    A grant would read this repository's draft and triage advisories, which are
    filtered out of the answer rather than refused.
  "pages:read": >-
    A grant would read a Pages site's private parts; this repository has no Pages
    site (404).
  "starring:read": >-
    A grant would reveal which private repositories the owner starred: their names,
    not their content.
  "watching:read": >-
    A grant would reveal which private repositories the owner watches: their names,
    not their content.
  "attestations:read": >-
    Its route looks the digest up before the permission, and the user listing filters
    rather than refuses. A grant would read this repository's artifact attestations:
    signed build provenance, which it has none of.
