# The analyzer debt ledger M17 reads (#389, the M17 transition; Decision 0129).
#
# `knowledge merge-evidence` reads this from the protected target, never from the
# candidate. An entry names one finding of inherited debt: its item, rule, path and
# message as the readback lists it, the SHA-256 of its smallest enclosing function or
# class on the protected commit it was proved on, its severity there (or null), the
# run-bound configuration identity it was proved under, and the analyzer's identity
# when the finding names one. A finding whose readback states no configuration
# identity never matches. A finding that matches an entry exactly stays listed, as
# inherited, and M17 does not fail on it; any other finding counts. A security
# finding is never an entry. Its texts are quoted, so YAML keeps them as written.
# A change to it is a trust-root change (M15), approved by the owner. Without this
# file the analyzer debt is UNAVAILABLE, and every finding counts.
schema_version: "1.0"
id: gnostoa.analyzer-debt-ledger
version: "0.1.0"
entries: []
