id: gnostoa-change-control
version: "0.3.0"
owner: team:gnostoa-maintainers
extends:
  - ../core/change-control.yaml

change_classes:
  normal:
    work_item: required
    decision_record: true
    verification:
      evidence_timing: before-implementation
  normative:
    work_item: required
    decision_record: true
    verification:
      failing_evidence: required
      evidence_timing: before-implementation
  critical:
    work_item: required
    decision_record: true
    verification:
      failing_evidence: required
      evidence_timing: before-implementation
  emergency:
    decision_record: true
