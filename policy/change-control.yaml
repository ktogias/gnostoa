id: gnostoa-change-control
version: "0.1.0"
owner: team:gnostoa-maintainers
extends:
  - ../core/change-control.yaml

change_classes:
  mechanical:
    minimum_approvals: 1
    independent_approval: true
    human_approval: true
    auto_merge: false
  emergency:
    minimum_approvals: 1
    independent_approval: true
    human_approval: true
