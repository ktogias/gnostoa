# The diagnostic inventory's protected family profile (#389 A0-MP1; Decision 0117).
# The inventory reads it only from the producer tree, the kit root its own code runs
# from, never from the tree it analyzes. It decides, before any producer runs, which
# families run, with which selectors, on which files: each family's FULL scope, and its
# DIFF scope's changed files, whole; complexity acquires only the functions a change
# adds a line to. Nothing obtained is dropped afterwards.
#
# Unactivated: no assurance claim reads the inventory yet. These are the admitted
# contract's values (Router 6381924685 on #389), qualification hypotheses, not accepted
# losses, except protected access's FULL scope: the owner's N (#389 6405282317) accepts
# its loss. PLR6301 and SIM117 are not selected.
#
# v2 (#389 H-PYSEC-2; Decision 0122; owner admission 6508582845) adds the pinned tool families and
# the unsafe-calls family, each `active: false`: none is planned, run or rowed in production until
# a separate activation decision, so every effective obligation is unchanged. Their executables are
# the official release ones, pinned per machine by the SHA-256 of the executable itself; the
# inventory runs one only from its protected tool root and only after its bytes match.
schema: gnostoa-diagnostic-profile/v2
id: gnostoa.project-risk
scopes:
  all:
    exclude: []
  non-test:
    exclude:
      - tests/
families:
  - id: typing
    producer: mypy
    diff: all
    full: non-test
  - id: protected-access
    producer: ruff
    select: [SLF001]
    diff: all
    # No FULL scope: the owner's N (#389 6405282317), accepting that SLF001 on code a
    # change does not touch is not acquired. Every acquired finding still denies (M17).
    full: null
  - id: literal-secrets
    producer: ruff
    select: [S106]
    diff: all
    full: all
  - id: complexity
    producer: complexity
    reported_above: 15
    diff: all
    full: null
  # The pinned tool families and the narrow unsafe-calls family: inactive until activation.
  - id: shell-lint
    producer: shellcheck
    diff: all
    full: all
    active: false
  - id: dockerfile-lint
    producer: hadolint
    diff: all
    full: all
    active: false
  - id: workflow-lint
    producer: actionlint
    diff: all
    full: all
    active: false
  - id: gitlab-script
    producer: gitlab-shellcheck
    diff: all
    full: all
    active: false
  - id: secrets
    producer: secrets
    diff: all
    full: all
    active: false
  - id: unsafe-calls
    producer: ruff
    select: [S301, S307, S324, S602, S605, S608]
    diff: all
    full: all
    active: false
