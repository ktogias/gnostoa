      - tests/test_tools.py::ChangeControlTests.test_gnostoa_self_policy_requires_durable_context_and_test_first
      - tests/test_tools.py::ChangeControlTests.test_change_policy_cannot_weaken_parent
      - tests/test_tools.py::ChangeControlTests.test_verification_policy_cannot_weaken_parent

  - id: gnostoa-self-change-discipline
    title: Gnostoa requires durable context and test-first chronology above the public baseline
    applies_to: [kit]
    enforcement: hybrid
    owner: team:gnostoa-maintainers
    guidance: knowledge/decisions/0014-strengthen-gnostoa-self-governance.md#decision
