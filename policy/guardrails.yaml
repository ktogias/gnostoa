version: "1.0.0"
guardrails:
  - id: monotonic-profile-inheritance
    title: Child profiles do not weaken parent policy
    applies_to: [kit, adopting-projects]
    enforcement: automated
    owner: team:gnostoa-maintainers
    guidance: guidance/guardrails/non-negotiable.md#rule
    implementation:
      - tools/knowledge_common.py#_assert_monotonic
    tests:
      - tests/test_tools.py::ProfileTests.test_profile_cannot_weaken_parent

  - id: stable-human-verification
    title: Stable concepts require human verification
    applies_to: [kit, adopting-projects]
    enforcement: automated
    owner: team:gnostoa-maintainers
    guidance: guidance/guardrails/non-negotiable.md#rule
    implementation:
      - tools/validate_bundle.py#validate_bundle
      - knowledge/runbooks/review-publication-baseline.md
    tests:
      - tests/test_tools.py::BundleTests.test_stable_concept_requires_human_verifier
      - tests/test_tools.py::PublicationBaselineTests.test_publication_review_matrix_covers_every_canonical_concept

  - id: graph-integrity
    title: IDs are unique and links resolve
    applies_to: [kit, adopting-projects]
    enforcement: automated
    owner: team:gnostoa-maintainers
    guidance: guidance/guardrails/non-negotiable.md#rule
    implementation:
      - tools/validate_bundle.py#validate_bundle
    tests:
      - tests/test_tools.py::BundleTests.test_generic_example_is_valid
      - tests/test_tools.py::BundleTests.test_guidance_bundle_is_valid
      - tests/test_tools.py::BundleTests.test_self_knowledge_bundle_is_valid
      - tests/test_tools.py::DocumentationTests.test_repository_documentation_links_resolve

  - id: stable-public-schema-identity
    title: Public schemas use unique versioned identifiers under an owned namespace
    applies_to: [kit]
    enforcement: automated
    owner: team:gnostoa-maintainers
    guidance: knowledge/decisions/0012-use-versioned-public-schema-identifiers.md#decision
    implementation:
      - schemas/change-control.schema.json
      - schemas/continuous-integration.schema.json
      - schemas/execution-plan.schema.json
      - schemas/frontmatter.schema.json
      - schemas/guardrails.schema.json
      - schemas/profile.schema.json
      - schemas/toolkit-lock.schema.json
      - schemas/verification-manifest.schema.json
      - tools/build_docs.py#prepare_projection
    tests:
      - tests/test_tools.py::PublicationBaselineTests.test_schema_ids_use_the_versioned_gnostoa_namespace
      - tests/test_tools.py::DocumentationTests.test_docs_builder_stages_canonical_surfaces

  - id: generated-content-starts-draft
    title: Generated content starts as draft
    applies_to: [kit, adopting-projects]
    enforcement: review
    owner: team:gnostoa-maintainers
    guidance: guidance/guardrails/non-negotiable.md#rule

  - id: executable-artifacts-remain-canonical
    title: Native executable artifacts are linked rather than copied
    applies_to: [kit, adopting-projects]
    enforcement: review
    owner: team:gnostoa-maintainers
    guidance: guidance/practices/source-authority-and-lifecycle.md#rule

  - id: derived-views-are-noncanonical
    title: Derived views and context packs are replaceable
    applies_to: [kit, adopting-projects]
    enforcement: hybrid
    owner: team:gnostoa-maintainers
    guidance: guidance/guardrails/non-negotiable.md#rule
    implementation:
      - tools/build_context_pack.py#build_pack
      - tools/build_docs.py#build_docs
      - tools/build_docs.py#prepare_projection
    tests:
      - tests/test_tools.py::BundleTests.test_context_pack_traverses_project_relations
      - tests/test_tools.py::DocumentationTests.test_mkdocs_pages_are_explicit_projections
      - tests/test_tools.py::DocumentationTests.test_docs_builder_stages_canonical_surfaces

  - id: immutable-toolkit-version
    title: Adopting projects pin an immutable toolkit version
    applies_to: [adopting-projects]
    enforcement: review
    owner: team:adopting-project-maintainers
    guidance: guidance/reference/versioning-and-upgrades.md#content

  - id: justified-specialization
    title: Specializations add demonstrated rules or vocabulary
    applies_to: [kit, adopting-projects]
    enforcement: review
    owner: team:gnostoa-maintainers
    guidance: guidance/workflows/create-specialization.md#procedure

  - id: task-scoped-guidance
    title: Agents load guidance through a task-specific route
    applies_to: [kit, adopting-projects]
    enforcement: hybrid
    owner: team:gnostoa-maintainers
    guidance: guidance/patterns/policy-guidance-self-separation.md#pattern
    implementation:
      - AGENTS.md
      - templates/AGENTS.project.md
    tests:
      - tests/test_tools.py::GuardrailTests.test_project_agent_router_is_bounded
      - tests/test_tools.py::BundleTests.test_guidance_context_pack_excludes_toolkit_self_knowledge

  - id: bounded-change-continuity
    title: Durable live change state is bounded, validated and authority-aware
    applies_to: [kit, adopting-projects]
    enforcement: automated
    owner: team:gnostoa-maintainers
    guidance: guidance/workflows/resume-and-handoff-change.md#procedure
    implementation:
      - core/change-control.yaml
      - schemas/change-control.schema.json
      - schemas/execution-plan.schema.json
      - templates/execution-plan.project.yaml
      - tools/task_context.py#validate_execution_plan
      - tools/task_context.py#reconcile_execution_plan
    tests:
      - tests/test_task_context.py::TaskContextContractTests.test_generic_contract_and_routes_are_public
      - tests/test_task_context.py::TaskContextToolTests.test_active_gnostoa_plan_is_schema_valid
      - tests/test_task_context.py::TaskContextToolTests.test_reconciliation_detects_branch_and_worktree_drift
      - tests/test_task_context.py::TaskContextContractTests.test_container_first_task_commands_have_a_pinned_git_runtime

  - id: explicit-clean-handoff
    title: Unfinished work transfers through a clean committed checkpoint
    applies_to: [kit, adopting-projects]
    enforcement: hybrid
    owner: team:gnostoa-maintainers
    guidance: guidance/workflows/resume-and-handoff-change.md#procedure
    implementation:
      - templates/change-request.md
      - tools/task_context.py#render_change_request_context
      - tools/task_context.py#check_change_request_context
      - .github/check_task_context.py#check_event
      - .agents/skills/change-lifecycle/SKILL.md
    tests:
      - tests/test_task_context.py::TaskContextToolTests.test_change_request_projection_rejects_a_stale_revision
      - tests/test_task_context.py::TaskContextToolTests.test_handoff_requires_a_clean_committed_checkpoint
      - tests/test_task_context.py::TaskContextContractTests.test_cross_agent_skill_and_provider_adapters_are_bounded
      - tests/test_task_context.py::TaskContextContractTests.test_github_adapter_checks_the_pull_request_candidate

  - id: self-knowledge-boundary
    title: Adopting projects do not inherit toolkit self-knowledge
    applies_to: [kit, adopting-projects]
    enforcement: automated
    owner: team:gnostoa-maintainers
    guidance: guidance/patterns/policy-guidance-self-separation.md#pattern
    implementation:
      - knowledge/contracts/public-inheritance-surface.md#boundary
      - templates/AGENTS.project.md
      - templates/change-control.project.yaml
    tests:
      - tests/test_tools.py::GuardrailTests.test_public_profile_does_not_inherit_self_knowledge
      - tests/test_tools.py::GuardrailTests.test_public_change_control_does_not_inherit_gnostoa_self_policy
      - tests/test_tools.py::GuardrailTests.test_project_agent_router_is_bounded

  - id: generic-scope-isolation
    title: Gnostoa source contains no downstream specialization vocabulary
    applies_to: [kit]
    enforcement: automated
    owner: team:gnostoa-maintainers
    guidance: knowledge/contracts/public-inheritance-surface.md#invariants
    implementation:
      - knowledge/contracts/public-inheritance-surface.md#invariants
    tests:
      - tests/test_tools.py::PublicationBaselineTests.test_repository_contains_no_specialization_vocabulary

  - id: legacy-content-quarantine
    title: Unnormalized legacy Markdown remains outside the validated bundle
    applies_to: [adopting-projects]
    enforcement: review
    owner: team:adopting-project-maintainers
    guidance: guidance/workflows/adopt-existing-project.md#procedure

  - id: provenance-preserved
    title: Knowledge transformations preserve source authority and provenance
    applies_to: [kit, adopting-projects]
    enforcement: hybrid
    owner: team:gnostoa-maintainers
    guidance: guidance/practices/source-authority-and-lifecycle.md#rule
    implementation:
      - schemas/frontmatter.schema.json

  - id: accountable-review-ownership
    title: Canonical knowledge paths have accountable review ownership
    applies_to: [kit, adopting-projects]
    enforcement: hybrid
    owner: team:gnostoa-maintainers
    guidance: guidance/guardrails/non-negotiable.md#rule
    implementation:
      - .github/CODEOWNERS
      - templates/CODEOWNERS.project
      - templates/knowledge-change-checklist.md
    tests:
      - tests/test_tools.py::PublicationBaselineTests.test_github_provider_surface_is_active_and_owned

  - id: container-first-consumer-runtime
    title: Consumer and CI execution is container-first with native fallback
    applies_to: [kit, adopting-projects]
    enforcement: automated
    owner: team:gnostoa-maintainers
    guidance: guidance/reference/runtime-and-distribution.md#content
    implementation:
      - Dockerfile
      - requirements/runtime.lock
      - requirements/development.lock
      - .devcontainer/devcontainer.json
      - tools/cli.py#main
      - guidance/workflows/bootstrap-new-project.md#procedure
    tests:
      - tests/test_tools.py::RuntimeTests.test_runtime_image_contract_is_pinned_and_non_root
      - tests/test_tools.py::RuntimeTests.test_development_container_uses_development_target
      - tests/test_tools.py::RuntimeTests.test_unified_cli_exposes_supported_commands
      - tests/test_tools.py::RuntimeTests.test_bootstrap_is_container_first_with_native_fallback
      - tests/test_tools.py::RuntimeTests.test_consumer_ci_templates_use_pinned_runtime_image
      - tests/test_tools.py::RuntimeTests.test_native_ci_is_explicit_fallback

  - id: runtime-source-lockstep
    title: Runtime image and toolkit source/profile revisions match
    applies_to: [kit, adopting-projects]
    enforcement: automated
    owner: team:gnostoa-maintainers
    guidance: guidance/reference/runtime-and-distribution.md#content
    implementation:
      - schemas/toolkit-lock.schema.json
      - templates/knowledge-kit.lock.yaml
      - tools/check_runtime_lock.py#check_runtime_lock
      - tools/check_runtime_lock.py#public_surface_digest
    tests:
      - tests/test_tools.py::RuntimeTests.test_runtime_lock_accepts_matching_revisions
      - tests/test_tools.py::RuntimeTests.test_runtime_lock_rejects_image_revision_drift
      - tests/test_tools.py::RuntimeTests.test_runtime_lock_rejects_public_surface_drift

  - id: concrete-tools-are-specialized
    title: Concrete implementation and test products stay out of generic guidance
    applies_to: [kit, adopting-projects]
    enforcement: hybrid
    owner: team:gnostoa-maintainers
    guidance: guidance/reference/tool-selection.md#content
    implementation:
      - guidance/reference/tool-selection.md
    tests:
      - tests/test_tools.py::RuntimeTests.test_tool_selection_keeps_concrete_product_choices_specialized

  - id: protected-change-request-flow
    title: Integration uses protected branches and risk-classified Change Requests
    applies_to: [kit, adopting-projects]
    enforcement: hybrid
    owner: team:gnostoa-maintainers
    guidance: guidance/patterns/protected-short-lived-change-flow.md#pattern
