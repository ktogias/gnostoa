      - schemas/change-control.schema.json
      - templates/change-control.project.yaml
      - templates/change-request.md
      - templates/repository-settings-checklist.md
      - knowledge/decisions/0013-defer-provider-enforcement-while-private.md
    tests:
      - tests/test_tools.py::ChangeControlTests.test_generic_baseline_has_protected_change_flow

  - id: monotonic-change-control
    title: Child change-control policies do not weaken their parent
    applies_to: [kit, adopting-projects]
    enforcement: automated
