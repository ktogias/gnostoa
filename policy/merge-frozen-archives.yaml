# The frozen evidence archives M13 reads whole (#389; Decision 0134, which amends
# Decision 0112's M13).
#
# `knowledge merge-evidence` reads this from the protected target, never from the
# candidate. An entry names one archive by its path, its Git blob id and the
# SHA-256 of its bytes; its one format is a gzip tar, and `decision` is the Decision
# that chose it, as provenance. A changed file that the comparison lists without
# hunks, added or modified, at that path, with that blob and those bytes, is read
# whole within bounds: every marker in its members is listed as frozen evidence for
# the native approval, and none denies. Anything else at that path is read as
# before. Without this file no archive is declared. A change to it is a trust-root
# change (M15), approved by the owner entry by entry.
