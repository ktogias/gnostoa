  - id: path-confinement
    responsibility: >-
      Confining a path to a root. For a path argument and a root that an environment
      variable names, the owner exists. The other roots' copies converge on one owner
      under #376.
    owner: tools/agent_review_paths.py
    interface: [within]
    extend: >-
      Call within(); extend agent_review_paths for a new kind of root, rather than
      comparing paths yourself: with is_relative_to, with relative_to under except
      ValueError, with a common path, with a path's parents or with a prefix ending
      in the separator.
    decision: knowledge/decisions/0100-separate-the-agent-review-pipeline-into-a-neutral-core-and-adapters.md
    signatures:
      - id: path-relation
        pattern: 'is_relative_to\('
        means: a path confined outside the owner
      # Structural, for Python files: `relative_to` in a `try` whose handlers catch
      # ValueError. A line pattern cannot tell it from a relative path computed for
      # display (Codex on #369; the owner chose this signature on 2026-10-06).
      - id: path-relation-guarded
        structure: relative-to-under-value-error
        means: a path confined outside the owner, by relative_to under except ValueError
      # Structural, for Python files: a common path or prefix compared with a root, a
      # root among a path's parents, or a prefix ending in os.sep (Codex on #369).
      - id: path-prefix-compared
        structure: path-prefix-comparison
        means: a path confined outside the owner, by a common path, its parents or a separator prefix
    allowed:
      - path: tools/capsule/profiles.py
        signatures: [path-relation]
        reason: >-
          It checks whether two declared paths overlap; it confines no argument.
    debt:
      - path: tasks/gnostoa_orientation.py
        signatures: [path-relation-guarded]
        lines:
          - 'target.relative_to(root)'
        until: https://github.com/ktogias/gnostoa/issues/376
