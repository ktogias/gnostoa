        signatures: [disposable-metadata, executable-lookup, git-environment, git-execution]
        lines:
          - '_GIT = shutil.which("git")'
          - '"GIT_DIR",'
          - '"GIT_EXTERNAL_DIFF",'
          - '"GIT_TEMPLATE_DIR",'
