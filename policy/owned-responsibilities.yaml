  - id: github-rest-transport
    responsibility: >-
      Talking to the GitHub REST API: URL safety, bounded reads, classified errors,
      rate limits and pagination.
    owner: tools/github_rest.py
    interface: [GitHubRestClient, validate_url, next_url]
    extend: >-
      Extend GitHubRestClient and its tests in tests/test_github_rest.py
      (SharedClientOwnershipTests). Do not open a connection to the API elsewhere.
    decision: knowledge/decisions/0100-separate-the-agent-review-pipeline-into-a-neutral-core-and-adapters.md
    signatures:
      - id: http-request
        # A client named by its dotted module, or imported by name: `from http import
        # client`, `from urllib import request` (Codex on #369), or a third-party
        # client, whose import changes the lock but may already be installed.
        pattern: 'urllib\.request|urlopen\(|http\.client|from\s+http\s+import\s+\(?\s*(?:\w+(?:\s+as\s+\w+)?\s*,\s*)*client\b|from\s+urllib\s+import\s+\(?\s*(?:\w+(?:\s+as\s+\w+)?\s*,\s*)*request\b|^\s*(?:import|from)\s+(?:requests|httpx|urllib3|aiohttp)\b'
        means: an HTTP request made outside the shared client
      - id: http-request-indirect
        # `client` or `request` on a line of its own in a multi-line import, where
        # the line pattern cannot see it (Codex on #369).
        structure: http-request-indirect
        means: an HTTP request made outside the shared client, under a name the line hides
    allowed:
      - path: tools/analyzer_deepsource.py
        signatures: [http-request]
        reason: >-
          It talks to DeepSource's API, not GitHub's.
      - path: tools/analyzer_codacy.py
