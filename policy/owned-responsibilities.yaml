# The responsibilities the toolkit owns once (Decision 0102, #368, #365).
#
# Before writing a helper, find the responsibility here and extend its owner: never
# write it again. `knowledge reuse-check` runs in the `fast`, `regression` and
# `extended` profiles of `ci/verify`, so in the pre-commit and pre-push hooks and in
# provider CI. It fails on any signature below that appears in production, meaning
# every tracked file but tests, knowledge, guidance and Markdown other than
# `AGENTS.md`, outside its owner and the places allowed. A debt entry names the
# exact lines it owes: a matching line it does not name is a new copy, and a line it
# names that has gone must be removed, so debt can only shrink. Identical lines are
# interchangeable call sites (owner, 2026-10-06; Decision 0102, rule 4).
#
# The check guards against an agent re-implementing an owner by accident. It does not
# detect deliberate obfuscation, such as getattr or a name built at run time; review
# and the routing hooks cover that (Decision 0102, rule 4).
#
# A responsibility missing from this list is not therefore free to copy. Run the
# runbook's prior-art checkpoint, and add the new owner here when you create it.
id: gnostoa-owned-responsibilities
version: "1.0"
responsibilities:
  - id: trusted-execution
    responsibility: >-
      Resolving an executable to run; a Git environment free of the caller's routing
      and configuration; disposable Git metadata bound to an object store;
      materializing an exact tree, byte for byte, with none of the repository's own
      configuration, attributes or filter drivers applying, nor the tree's own
      .gitattributes: none of its files is left out or rewritten;
      and, with PR B of #368, running an authority commit's entrypoint.
    owner: tools/trusted_execution.py
    interface:
      - trusted_executable
      - trusted_path
      - operator_executable
      - git_executable
      - git_environment
      - without_git_variables
      - caller_git_environment
      - disposable_git_metadata
      - repository_objects
      - repository_format
      - repository_read
      - repository_files
      - extract_tree
      - run_git
      - GitFailure
    extend: >-
      Add the new need to tools/trusted_execution.py and its tests in
      tests/test_trusted_execution.py. Use trusted_executable() for an authority or
      judge path, and operator_executable() only for a tool the operator chooses. In a
      repository you do not trust, use repository_read() or repository_files() for a
      read of a shape the owner allows, or work under disposable_git_metadata(). Run no
      Git, build no Git environment and archive no tree yourself.
    decision: knowledge/decisions/0102-own-trusted-execution-in-one-hardened-module.md
    signatures:
      - id: git-environment
        pattern: 'GIT_CONFIG_(GLOBAL|SYSTEM|NOSYSTEM|PARAMETERS|COUNT)|startswith\(\s*["'']GIT_|GIT_EXEC_PATH|GIT_TRACE|\bunset\s+GIT_|["''$]\{?GIT_(?:DIR|WORK_TREE|INDEX_FILE|OBJECT_DIRECTORY|ALTERNATE_OBJECT_DIRECTORIES|COMMON_DIR|NAMESPACE|CEILING_DIRECTORIES|DISCOVERY_ACROSS_FILESYSTEM|TEMPLATE_DIR|EXTERNAL_DIFF|REPLACE_REF_BASE)\b|\bGIT_(?:DIR|WORK_TREE|INDEX_FILE|OBJECT_DIRECTORY|ALTERNATE_OBJECT_DIRECTORIES|COMMON_DIR|NAMESPACE|CEILING_DIRECTORIES|DISCOVERY_ACROSS_FILESYSTEM|TEMPLATE_DIR|EXTERNAL_DIFF|REPLACE_REF_BASE)\s*[=:]|^\s*ENV\s+GIT_(?:DIR|WORK_TREE|INDEX_FILE|OBJECT_DIRECTORY|ALTERNATE_OBJECT_DIRECTORIES|COMMON_DIR|NAMESPACE|CEILING_DIRECTORIES|DISCOVERY_ACROSS_FILESYSTEM|TEMPLATE_DIR|EXTERNAL_DIFF|REPLACE_REF_BASE)\s'
        # Among them `GIT_TEMPLATE_DIR`, `GIT_EXTERNAL_DIFF` and `GIT_REPLACE_REF_BASE`,
        # which run a template's hooks, run a program on diff and substitute
        # objects (Claude on #369).
        means: a Git environment built outside the owner
      - id: git-execution
        # A command line starts a line, follows `$(` or `;`, `&`, `|`, or starts the
        # string a call hands to a shell, as `os.system("git status")` does (Codex on
        # #369); a message that names a Git command is no call. `--version`, `--help`,
        # `-v` and `-h` run Git with no subcommand (Codex on #369). The command may be
        # an absolute path, such as `/usr/bin/git` (Codex on #369). Rounds 15 to 19
        # each found one more form, so the rest are listed at once: a workflow's
        # `run:`, a Dockerfile's `RUN`, a backtick substitution after `=`, `"` or `(`
        # but not inline code, `find -exec`, `sh -c '...'`,
        # wrappers such as `timeout`, `sudo` and `xargs`, also by an absolute path
        # and with an option that takes a word or a path, as `/usr/bin/env git`,
        # `sudo -u builder git` and `env -u GIT_DIR git`, and `env -S '...'`, which
        # splits a string into the command (Codex on #369), a leading shell
        # assignment, as `LC_ALL=C git status`, in any command position (Codex on
        # #369), a loop's condition after `while` or `until`, a brace group or a
        # subshell opening a line, Make's recipe prefixes `@`, `-` and `+`, its
        # `$(shell ...)` and a Make variable bound to Git, and a `case` arm's
        # commands after its `)` (Codex on #369),
        # `shlex.split` and
        # `pexpect.spawn` strings, an argv list headed by a name like `git_bin`, and
        # GitPython, which runs the git binary. In an explicit command context any
        # subcommand is a command, external ones such as `git lfs` too (Codex on
        # #369); at a bare line start, where `git and ...` is also prose, only Git's
        # own subcommands and well-known extensions are.
        # An option reads one way only: a bare `-C` or `-c` takes its argument, and a
        # word follows the dashes. Read two ways at each step, a run of options
        # backtracked exponentially (CodeAnt on #369).
        pattern: '\[\s*["'']git["'']|\[\s*(?:\w+\.)*(?:[A-Za-z]\w*_)?_?git(?:_\w+)?(?:\(\))?\s*,|git_executable\b|(?:\(|,)\s*(?:\w+\s*=\s*)?["'']git["'']\s*[,)]|["'']/(?:[\w.+-]+/)*git["'']|["'']git["'']\s*,|(?:^\s*[@+-]*(?:(?:(?:-\s+)?run:\s+|RUN\s+)(?:(?:if|then|elif|else|do|exec|while|until|!)\s+)*|(?:(?:if|then|elif|else|do|exec|while|until|!)\s+)+|\{\s+|\(\s*|(?=(?:/(?:[\w.+-]+/)*)?(?:env|command|timeout|nice|nohup|sudo|xargs|time|stdbuf|ionice|setsid|chrt|flock)\s|[A-Za-z_]\w*=\S*\s))|\$\(\s*|\$\(shell\s+|\)\s*|[="(]`\s*|[;&|]\s*|\s-exec(?:dir)?\s+|\b(?:ba|da|k|z)?sh\s+(?:-\w+\s+)*-\w*c\w*\s+["'']\s*|\benv\s+(?:-\S+\s+)*(?:-S|--split-string=?)\s*["'']\s*|(?:os\.(?:system|popen)|subprocess\.\w+|create_subprocess_shell|getoutput|shlex\.split|pexpect\.(?:spawn|run))\(\s*(?:\b[rbfRBF]{1,2})?["'']\s*)(?:(?:(?:/(?:[\w.+-]+/)*)?(?:env(?:\s+-\S+(?:\s+(?:[A-Za-z_][\w.@:-]*|/\S*))?)*|command(?:\s+-[pvV])*|(?:timeout|nice|nohup|sudo|xargs|time|stdbuf|ionice|setsid|chrt|flock)(?:\s+(?:-\S+(?:\s+[A-Za-z_][\w.@:-]*)?|\d\S*|/\S*))*)|[A-Za-z_]\w*=\S*)\s+)*(?:/(?:[\w.+-]+/)*)?git(?:\s+(?:-[Cc]\s+\S+|-(?![Cc]\s)-?\w[\w-]*(?:=\S+)?))*(?:\s+(?:--version|--help|--exec-path|--html-path|--man-path|--info-path|--list-cmds|-v|-h)(?![\w-])|\s+(?:\\\s*$|[a-z][a-z0-9-]*(?![\w-])))|^\s*[@+-]*(?:/(?:[\w.+-]+/)*)?git(?:\s+(?:-[Cc]\s+\S+|-(?![Cc]\s)-?\w[\w-]*(?:=\S+)?))*(?:\s+(?:--version|--help|--exec-path|--html-path|--man-path|--info-path|--list-cmds|-v|-h)(?![\w-])|\s+(?:\\\s*$|(?:add|am|annotate|apply|archive|backfill|bisect|blame|branch|bugreport|bundle|cat-file|check-attr|check-ignore|check-mailmap|check-ref-format|checkout|checkout--worker|checkout-index|cherry|cherry-pick|clean|clone|column|commit|commit-graph|commit-tree|config|contacts|count-objects|credential|credential-cache|credential-cache--daemon|credential-netrc|credential-store|daemon|describe|diagnose|diff|diff-files|diff-index|diff-pairs|diff-tree|difftool|difftool--helper|fast-export|fast-import|fetch|fetch-pack|filter-branch|fmt-merge-msg|for-each-ref|for-each-repo|format-patch|format-rev|fsck|fsck-objects|fsmonitor--daemon|gc|get-tar-commit-id|grep|hash-object|help|history|hook|http-backend|http-fetch|http-push|imap-send|index-pack|init|init-db|instaweb|interpret-trailers|last-modified|log|ls-files|ls-remote|ls-tree|mailinfo|mailsplit|maintenance|merge|merge-base|merge-file|merge-index|merge-octopus|merge-one-file|merge-ours|merge-recursive|merge-recursive-ours|merge-recursive-theirs|merge-resolve|merge-subtree|merge-tree|mergetool|mktag|mktree|multi-pack-index|mv|name-rev|notes|pack-objects|pack-redundant|pack-refs|patch-id|pickaxe|prune|prune-packed|pull|push|quiltimport|range-diff|read-tree|rebase|receive-pack|reflog|refs|remote|remote-ext|remote-fd|remote-ftp|remote-ftps|remote-http|remote-https|repack|replace|replay|repo|request-pull|rerere|reset|restore|rev-list|rev-parse|revert|rm|send-pack|sh-i18n--envsubst|shell|shortlog|show|show-branch|show-index|show-ref|sparse-checkout|stage|stash|status|stripspace|submodule|submodule--helper|subtree|switch|symbolic-ref|tag|unpack-file|unpack-objects|update-index|update-ref|update-server-info|upload-archive|upload-archive--writer|upload-pack|url-parse|var|verify-commit|verify-pack|verify-tag|version|web--browse|whatchanged|worktree|write-tree|lfs|annex|filter-repo|crypt|secret|secrets|flow|absorb|imerge|sizer|credential-manager|town|branchless|subrepo)(?![\w-])))|^\s*\w+\s*(?::[^=]+)?=\s*["'']git["'']\s*(?:#.*)?$|^\s*(?:(?:export|readonly|local|typeset|declare(?:\s+-\w+)*)\s+)?\w+=(?:/(?:[\w.+-]+/)*)?git\s*(?:[;#].*)?$|^\s*\w+\s*[:?+!]?=\s*(?:/(?:[\w.+-]+/)*)?git\s*(?:#.*)?$|^\s*alias\s+\w+=["'']?(?:/(?:[\w.+-]+/)*)?git\b|^\s*(?:import|from)\s+git(?:\.\w+)*(?:\s|$)'
        # The subcommands are Git's own list, `git --list-cmds=main` of Git 2.47 and
        # 2.55; tests/test_owned_responsibilities.py fails when a Git lists one more.
        # Its last forms bind a name to Git, for a later `[GIT, ...]` or `"$GIT"`:
        # the literal "git", as `GIT = "git"`, a shell assignment, unquoted and
        # perhaps an absolute path or a declaration, as `git_cmd=git`, and a shell
        # alias. A subscript, such as a data field, is no binding (Codex on #369).
        # Git's other bare options, such as `--exec-path`, run it with no subcommand
        # too (CodeAnt on #369).
        means: Git run outside the owner
      - id: executable-lookup
        # A module call, a name imported from shutil (Codex on #369), or the shell's.
        # An import is read as its list of names, not `[^#]*`, which rescanned the
        # line from each `from ... import`, quadratically (CodeAnt on #369).
        # The shell's own lookups, `$(which git)` and `$(type -P git)`, too (Codex on
        # #369).
        pattern: 'shutil\.which\(|command -v |(?:\$\(|`)\s*(?:which|type\s+-[Pp]a?)\s+|from\s+shutil\s+import\s+\(?\s*(?:\w+(?:\s+as\s+\w+)?\s*,\s*)*which\b'
        means: an executable resolved outside the owner
      - id: git-argv
        # An argument list headed by a name for git, as a tuple or split across
        # lines, where the line pattern cannot see it (CodeAnt on #369).
        structure: git-argv
        means: Git run outside the owner, by an argument list the line does not show
      - id: git-shell-command
        # A literal command handed to a shell helper named through an imported
        # name, a module alias, or on another line than the command, where no line
        # shows it, and the shell text of a script, a Dockerfile, a Makefile, a
        # workflow or an AGENTS.md. Each is judged by this entry's own line patterns,
        # as a line is, and by the shell command reader of Decision 0105, which
        # reads command positions with a tokenizer. New shell forms are the
        # reader's, never this file's patterns (the owner, 2026-10-07).
        structure: shell-command-indirect
        means: a command run outside the owner, handed to a shell where no line shows it
      - id: executable-lookup-indirect
        # `which` on a line of its own in a multi-line import, or called through an
        # alias of shutil, where the line pattern cannot see it (Codex on #369).
        structure: executable-lookup-indirect
        means: an executable resolved outside the owner, under a name the line hides
      - id: tree-archive
        # `archive` as an argument list's own word, with or without `--format`, as Git's
        # default format is tar (Codex on #369).
        pattern: '["'']archive["'']\s*[,\]]|git archive|archive --format'
        means: a tree archived outside the owner
      - id: disposable-metadata
        # The template as `--template=dir`, or as a word of its own (Codex on #369).
        pattern: '--template=|["'']--template["'']\s*[,\]]|--template\s+[^\s-]'
        means: Git metadata made outside the owner
    allowed:
      - path: tools/trusted_execution.py
        reason: the owner
      - path: ci/review_b15_runtime_smoke.py
        signatures: [executable-lookup]
        reason: >-
          Its `command -v` runs inside the runtime image, to prove what the image
          lacks; it resolves nothing for this process to run.
    debt:
      # The preparation authority and the repository's shell scripts move onto the
      # owner and its shell library by authority evolution: #368, PR B (Decision
      # 0102, rule 6).
