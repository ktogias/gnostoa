      under schemas/.
    owner: tools/schema_validation.py
    interface: [load_schema, schema_errors]
    extend: >-
      Call schema_errors(document, "<name>.schema.json"); add the schema under
      schemas/. Nine local helpers predate this owner and converge on it under #365.
    decision: knowledge/decisions/0102-own-trusted-execution-in-one-hardened-module.md
    signatures:
