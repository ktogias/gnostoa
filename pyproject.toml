[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gnostoa"
version = "0.2.0"
description = "Technology-neutral OKF profiles and validation tools for project knowledge"
authors = [
  { name = "Konstantinos Togias" },
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0,<7",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
docs = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.6,<10",
]

[project.scripts]
knowledge = "tools.cli:main"
knowledge-validate = "tools.validate_bundle:main"
knowledge-context-pack = "tools.build_context_pack:main"
knowledge-docs-build = "tools.build_docs:main"
knowledge-check-change-policy = "tools.check_change_policy:main"
knowledge-check-ci-policy = "tools.check_ci_policy:main"
knowledge-check-guardrails = "tools.check_guardrails:main"
knowledge-check-runtime = "tools.check_runtime_lock:main"
knowledge-surface-digest = "tools.check_runtime_lock:surface_digest_main"
knowledge-task-validate = "tools.task_envelope:validate_main"
knowledge-task-project = "tools.task_envelope:project_main"
knowledge-self-check = "tools.self_check:main"

[tool.setuptools]
packages = ["tools", "tools.experiment", "tools.capsule", "tools.capsule.adapters"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["tools", "ci"]
