handoff:
  actor: accountable maintainer
  read:
    - the generated current task projection
    - the focused Pull Request diff
    - linked detail only for an unresolved question
  verify:
    - the exact semantic and executable delta is understandable
    - declared identities that differ from supplied observations fail before projection
    - container evidence is green for the exact candidate
    - the runtime target passes self-check from a working directory outside the toolkit
    - the reported review surface matches the provider count for the exact head
    - malformed and recursive envelope input fails closed without a traceback
    - envelope input is bounded by byte size and nesting depth before parsing
    - the constructed envelope derives from the one bounded snapshot that was checked
