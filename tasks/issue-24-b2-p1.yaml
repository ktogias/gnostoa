schema_version: "0.1"
task:
  id: GNOSTOA/B2/P1
  objective: >-
    Make one bounded Gnostoa change resumable from validated durable state and
    one compact current projection without replaying the B1 ledger.
  owner: team:gnostoa-maintainers
  change_class: normative
scope:
  included:
    - a portable task-envelope schema, validator and deterministic projector
    - exact stale-base, dependency and checkpoint conflict detection
    - an explicit handoff and one current task projection
    - compact recording of the human-control findings used as B2 input
    - reconciliation of stale post-publication current-state projections
    - the B2/P1 measurement record compared with the recorded B1 baseline
  excluded:
    - a workflow engine, database or general event store
    - provider-specific authority or automatic human approval
    - raw conversation or hidden-reasoning storage
    - implementation of later Issue 3, 5-15 research surfaces
state:
  status: active
  completed:
    - Bound Issue 24 and Decision 0016 to protected public main.
    - Recorded the human-control assessment and reverse-centaur failure mode.
    - Established focused RED evidence before adding the task commands.
    - Implemented the bounded schema, validator, projector and focused tests.
    - Passed the focused, policy, fast, regression, smoke and extended suites in the development container.
    - Ran the declared runtime-target gate, which failed one working-directory-dependent required test.
    - Made required task-envelope evidence depend on the declared repository root rather than the caller working directory.
    - Mapped the renamed index-coverage test to graph integrity and kept the publication runbook mapping on evidence.
    - Replaced the ambiguous provider identity kind with github-issue-body-utf8-sha256-v1 and pinned it with offline evidence.
    - Recorded the B2/P1 measurements against the B1 baseline, with owner review time left pending.
    - Reported a commit-metadata provenance finding without rewriting published history.
    - Reconciled the review-surface accounting with the exact provider-reported head.
    - Corrected the candidate-authority wording; the envelope does not carry the candidate.
    - Made the provider digest fixture invariant under checkout line-ending normalization.
    - Rewrote the unmerged branch commit metadata under explicit owner authorization.
    - Rejected recursive YAML alias graphs with a bounded error instead of an uncaught RecursionError.
    - Bounded envelope input by byte size and nesting depth before the YAML parser runs.
    - Converted the five audited boundary exceptions into the documented bounded diagnostics.
    - Added the explicit repository root to both public workflow examples.
    - Loaded, bounded and constructed the envelope and any supplied schema from one immutable snapshot.
  next_action: Run the final closed-scope verification-only pass over the corrected candidate before the timed review.
  blocker: null
