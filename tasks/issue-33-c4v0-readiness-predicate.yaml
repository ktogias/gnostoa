schema_version: "0.1"
task:
  id: GNOSTOA/B2/C4-v0
  objective: >-
    Test whether READY can become a deterministic, fail-closed, read-only result
    over existing evidence that rejects the recorded false-ready states without
    unacceptable false blocks, maintenance surface or human-attention cost.
  owner: team:gnostoa-maintainers
  change_class: normal
scope:
  included:
    - record the owner boundary Decision for C4-v0
    - reconstruct the false-ready and owner-accepted states as replayable controls
    - derive the minimum precondition set and implement the predicate under tests/
    - replay every control, measure the result and record it in a durable assessment
    - reconcile the stale current-state projections
  excluded:
    - any change to the public inherited surface, including tools, schemas, policy and consumer CI
    - promotion of C4-v0 to a supported tool, inherited schema, guardrail or adopter contract
    - Decision 0016 increment 2 activation, and implementation of controls C2 or C3
    - task-envelope schema redesign, including a locally recorded provider witness
    - producing new verification-receipt or measurement-binding evidence classes
    - opening a Change Request or integrating the candidate
state:
  status: complete
  completed:
